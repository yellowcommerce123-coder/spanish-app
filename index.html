/* ============================================================
   8. UITSPRAAK — zet elke Spaanse zin om in Nederlandse klanken
   HOOFDLETTERS = daar leg je de klemtoon.
   ============================================================ */
const VOW = "aeiouáéíóúü";
const STR = "aeoáéó";
const isV = c => c && VOW.indexOf(c)>=0;
const isS = c => c && STR.indexOf(c)>=0;
const CLUST = ["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","tr","tl","ll","ch","rr"];

function syllabify(w){
  const g=[]; let i=0;
  while(i<w.length){
    if(isV(w[i])){
      let s=i,e=i;
      while(e+1<w.length && isV(w[e+1])){ if(isS(w[e])&&isS(w[e+1])) break; e++; }
      g.push([s,e]); i=e+1;
    } else i++;
  }
  if(g.length<2) return [w];
  const cuts=[];
  for(let k=0;k<g.length-1;k++){
    const a=g[k][1], b=g[k+1][0], cons=w.slice(a+1,b);
    let cut;
    if(cons.length===0) cut=b;
    else if(cons.length===1) cut=a+1;
    else if(cons.length===2) cut = CLUST.indexOf(cons)>=0 ? a+1 : a+2;
    else cut = CLUST.indexOf(cons.slice(-2))>=0 ? b-2 : b-1;
    cuts.push(cut);
  }
  const out=[]; let p=0;
  cuts.forEach(c=>{ out.push(w.slice(p,c)); p=c; });
  out.push(w.slice(p));
  return out.filter(x=>x.length);
}

function tsyl(s, prevChar, wordEnd){
  s = s.replace(/gu([eiéí])/g,"\u0001$1").replace(/qu([eiéí])/g,"\u0002$1");
  let o="", i=0;
  const A={"á":"a","é":"e","ó":"o"};
  while(i<s.length){
    const c=s[i], n=s[i+1]||"", n2=s[i+2]||"", pv = i>0 ? s[i-1] : prevChar;
    if(c==="\u0001"){ o+="g"; i++; continue; }
    if(c==="\u0002"){ o+="k"; i++; continue; }
    if(c==="q" && n==="u"){ o+="k"; i+=2; continue; }
    if(c==="g" && n==="ü"){ o+="gw"; i+=2; continue; }
    if(c==="g" && "eiéí".indexOf(n)>=0){ o+="ch"; i++; continue; }
    if(c==="j"){ o+="ch"; i++; continue; }
    if(c==="l" && n==="l"){ o+="j"; i+=2; continue; }
    if(c==="c" && n==="h"){ o+="tsj"; i+=2; continue; }
    if(c==="c" && "eiéí".indexOf(n)>=0){ o+="th"; i++; continue; }
    if(c==="c"){ o+="k"; i++; continue; }
    if(c==="z"){ o+="th"; i++; continue; }
    if(c==="v"){ o+="b"; i++; continue; }
    if(c==="h"){ i++; continue; }
    if(c==="ñ"){ o+="nj"; i++; continue; }
    if(c==="r" && n==="r"){ o+="rr"; i+=2; continue; }
    if(c==="x"){ o+="ks"; i++; continue; }
    if(c==="y"){ o += isV(n) ? "j" : "ie"; i++; continue; }
    if(c==="i"||c==="í"){ o += (isV(n)||isV(pv)) ? "i" : "ie"; i++; continue; }
    if(c==="u"||c==="ú"||c==="ü"){ o += isV(n) ? "w" : ((pv==="i"||pv==="í") ? "oe" : (isV(pv) ? "u" : "oe")); i++; continue; }
    if(c==="d" && wordEnd && i===s.length-1){ o+="th"; i++; continue; }
    if(A[c]){ o+=A[c]; i++; continue; }
    o+=c; i++;
  }
  return o;
}

function pronWord(raw){
  const w = raw.toLowerCase().replace(/[¿?¡!.,;:"'()]/g,"");
  if(!w) return "";
  if(!/[a-záéíóúüñ]/.test(w)) return raw;
  const syl = syllabify(w);
  let acc = -1;
  syl.forEach((s,i)=>{ if(/[áéíóú]/.test(s)) acc = i; });
  let stress;
  if(acc>=0) stress = acc;
  else if(syl.length===1) stress = -1;
  else stress = /[aeiouns]$/.test(w) ? syl.length-2 : syl.length-1;
  return syl.map((s,i)=>{
    const t = tsyl(s, i>0 ? syl[i-1].slice(-1) : "", i===syl.length-1);
    return i===stress ? t.toUpperCase() : t;
  }).join("-");
}
function pronOf(text){
  if(!text) return "";
  return String(text).split(/\s+/).map(pronWord).filter(x=>x).join(" ");
}

      extra: w.art ? (G_NL[w.g]+", meervoud "+w.pl) : "beschrijvend woord"});
    if(w.pl && w.pl!==w.es){
      glosAdd(w.pl, {es:(w.art?artPlur(w)+" ":"")+w.pl, nl:betekenis(w)+" ("+T("meervoud")+")", pron:pronOf(w.pl), emoji:w.emoji,
        extra:"meervoud van "+w.es});
    }
    if(w.isAdj){
      ["o","a","os","as"].forEach(eind=>{
        if(w.es.endsWith("o")){
          const vorm = w.es.slice(0,-1)+eind;
          glosAdd(vorm, {es:vorm, nl:betekenis(w), pron:pronOf(vorm), extra:"vorm van "+w.es});
        }
      });
    }
  });

  /* werkwoorden: alle zes vormen */
  VERBS.forEach(v=>{
    glosAdd(v.es, {es:v.es, nl:verbBetekenis(v), pron:v.pron || pronOf(v.es), extra:"heel werkwoord, groep -"+v.g});
    for(let i=0;i<6;i++){
      const vorm = conj(v,i);
      glosAdd(vorm, {es:vorm, nl:(LANG==="en" ? EN_PRON3[i]+" "+enVorm(v,i) : nlPresent(v,i)+" ("+P6[i].nl+")"),
        pron:pronOf(vorm), extra:"van "+v.es+" = "+verbBetekenis(v)});
    }
  });

  /* de onregelmatige */
  [["ser",SER,"zijn (vast)"],["estar",ESTAR,"zijn (nu)"],["tener",TENER,"hebben"],["ir",IR,"gaan"]].forEach(([naam,vormen,bet])=>{
    glosAdd(naam, {es:naam, nl:bet, pron:pronOf(naam), extra:"onregelmatig werkwoord"});
    vormen.forEach((f,i)=>glosAdd(f, {es:f, nl:pronNaam(i)+" "+(LANG==="en"
      ? ({ser:"am / is / are",estar:"am / is / are",tener:"have",ir:"go"}[naam]||bet)
      : bet.split(" ")[0]), pron:pronOf(f),
      extra:"van "+naam+" ("+bet+")"}));
  });

  /* getallen, plaatswoorden, vraagwoorden */
  NUMS.forEach(n=>glosAdd(n[1], {es:n[1], nl:"het getal "+n[0], pron:pronOf(n[1])}));
  PLACES.forEach(p=>glosAdd(p.es.split(" ")[0], {es:p.es, nl:p.nl, pron:pronOf(p.es), extra:"plaatswoord"}));
  QWORDS.forEach(q=>glosAdd(q.es.replace(/[¿?]/g,""), {es:q.es, nl:q.nl, pron:pronOf(q.es), extra:"vraagwoord, voor "+q.use}));

  GLOSVAST.forEach(([w,nl])=>glosAdd(w, {es:w, nl:nl, pron:pronOf(w)}));
}

function bouwGlosExtra(){
  GLOSDAG.forEach(([w,nl])=>glosAdd(w,{es:w,nl:nl,pron:pronOf(w),extra:"dag van de week"}));
  GLOSMEER.forEach(([w,nl])=>glosAdd(w,{es:w,nl:nl,pron:pronOf(w)}));
  /* meervoud en vrouwelijke vormen van alle beschrijvende woorden */
  ADJS.concat(ESTADJS).forEach(w=>{
    ["m","f"].forEach(g=>[1,2].forEach(n=>{
      const vorm = adjForm(w,g,n);
      glosAdd(vorm,{es:vorm,nl:betekenis(w),pron:pronOf(vorm),extra:"vorm van "+w.es});
    }));
  });
  /* de aan-het vorm van elk werkwoord */
  VERBS.forEach(v=>{
    const g = v.es.slice(0,-2) + (v.g==="ar" ? "ando" : "iendo");
    glosAdd(g,{es:g,nl:(LANG==="en"?verbBetekenis(v).replace(/^to /,"")+"ing":"aan het "+v.nl),pron:pronOf(g),extra:"van "+v.es});
  });
}

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* Spaanse tekst omzetten naar tekst met aanwijsbare woorden */
function glos(text){
  if(text==null) return "";
  return String(text).split(/(\s+)/).map(tok=>{
    if(!tok || /^\s+$/.test(tok)) return tok;
    const kaal = tok.replace(/^[¿¡("'.,]+/,"").replace(/[.,;:!?)"']+$/,"");
    if(!kaal || !GLOS[norm(kaal)]) return esc(tok);
    const voor = tok.slice(0, tok.indexOf(kaal));
    const na = tok.slice(tok.indexOf(kaal)+kaal.length);
    return esc(voor) + '<span class="gl" data-gl="'+esc(kaal)+'">'+esc(kaal)+'</span>' + esc(na);
  }).join("");
}

/* het zwevende kaartje */
let tipEl = null, tipTimer = null;
function tipShow(el){
  const info = GLOS[norm(el.dataset.gl||"")];
  if(!info) return;
  if(!tipEl){
    tipEl = document.createElement("div");
    tipEl.className = "tip";
    document.body.appendChild(tipEl);
  }
  tipEl.innerHTML = (info.emoji?'<div class="tip-emo">'+info.emoji+'</div>':'')
    + '<div class="tip-es">'+esc(info.es)+'</div>'
    + '<div class="tip-nl">'+esc(info.nl)+'</div>'
    + (info.pron?'<div class="tip-pr">'+esc(info.pron)+'</div>':'')
    + (info.extra?'<div class="tip-ex">'+esc(info.extra)+'</div>':'');
  const r = el.getBoundingClientRect();
  tipEl.style.visibility = "hidden";
  tipEl.classList.add("on");
  const tr = tipEl.getBoundingClientRect();
  let left = r.left + r.width/2 - tr.width/2;
  left = Math.max(10, Math.min(left, window.innerWidth - tr.width - 10));
  let top = r.top - tr.height - 10;
  if(top < 8) top = r.bottom + 10;
  tipEl.style.left = left+"px";
  tipEl.style.top = top+"px";
  tipEl.style.visibility = "visible";
}
function tipHide(){ if(tipEl) tipEl.classList.remove("on"); }

document.addEventListener("mouseover", ev=>{
  const g = ev.target.closest && ev.target.closest(".gl");
  if(g){ clearTimeout(tipTimer); tipShow(g); }
});
document.addEventListener("mouseout", ev=>{
  if(ev.target.closest && ev.target.closest(".gl")){
    clearTimeout(tipTimer);
    tipTimer = setTimeout(tipHide, 120);
  }
});
/* op de telefoon: tikken, maar alleen buiten knoppen zodat antwoorden blijft werken */
document.addEventListener("click", ev=>{
  const g = ev.target.closest && ev.target.closest(".gl");
  if(g && !ev.target.closest("button")){
    ev.stopPropagation();
    tipShow(g);
    clearTimeout(tipTimer);
    tipTimer = setTimeout(tipHide, 3200);
    return;
  }
  tipHide();
}, true);
document.addEventListener("scroll", tipHide, true);

/* Engelse werkwoordvorm: hij en zij krijgen een -s */
function enVorm(v, i){
  const basis = verbBetekenis(v).replace(/^to /,"");
  if(i===2) return basis.endsWith("s")||basis.endsWith("h")||basis.endsWith("o") ? basis+"es" : basis+"s";
  return basis;
}

  if(LANG === "en" && EN_WORD[w.es]) return EN_WORD[w.es];

}
function verbBetekenis(v){
  if(LANG === "en" && EN_VERB[v.es]) return EN_VERB[v.es];

}

secs:[

"What it is → ser. How it is now → estar.",
"Shorter still: passport or diary?"]},
{h:"The rules that never bend",p:[
"<b>Location</b> → always estar.",
"<b>Feelings</b> → always estar.",
"<b>Job, nationality, name, family</b> → always ser.",
"<b>Time and dates</b> → always ser. Son las dos. Hoy es lunes.",
"<b>Ownership</b> → always ser. Es de mi madre.",
"Learn just these five and most sentences take care of themselves."]},
{h:"Words that change meaning",p:[

"<b>bueno</b>: es bueno = it is good. está bueno = it tastes good.",

{h:"When you are stuck",p:[
"Could you add <i>right now</i> or <i>today</i>? Then estar.",
"Could it be printed in a passport or an encyclopaedia? Then ser.",

secs:[
{h:"The six forms",p:[
"<b>tengo, tienes, tiene, tenemos, tenéis, tienen</b>.",
"Spot the pattern: for tú, él and ellos the e becomes <b>ie</b>.",
"For nosotros and vosotros the e stays put: tenemos, tenéis.",
"And the I-form is tengo, with a g. That one you simply learn."]},
{h:"Age uses tener",p:[
"In Spanish you <b>have</b> years. You are not them.",
"Tengo treinta años. Literally: I have thirty years.",
"Do not drop años. Tengo treinta means I have thirty, and the listener will ask thirty what.",
"The question is ¿Cuántos años tienes? — how many years do you have?"]},
{h:"Hunger, thirst, cold: also tener",p:[
"<b>tener hambre</b> = to be hungry. Tengo hambre.",
"<b>tener sed</b> = to be thirsty.",
"<b>tener frío</b> = to be cold. <b>tener calor</b> = to be hot.",
"<b>tener sueño</b> = to be sleepy. <b>tener miedo</b> = to be afraid.",
"<b>tener prisa</b> = to be in a hurry. <b>tener razón</b> = to be right.",
"English uses am for all of these. Spanish uses have for all of them."]},

"tener plus <b>que</b> plus a plain verb means <i>have to</i>.",

EN_LESSONS.verbstem = {
lead:"Every Spanish verb has two parts: a <b>stem</b> and an <b>ending</b>. Split those and you can conjugate any verb, including ones you have never seen.",
why:"This is the key to the entire verb system. Conjugating is nothing more than removing the ending and attaching a different one.",
secs:[
{h:"Infinitives always end in ar, er or ir",p:[
"The dictionary form is called the infinitive: the <i>to</i> form in English.",
"In Spanish it always ends in <b>-ar</b>, <b>-er</b> or <b>-ir</b>. There is no fourth option.",
"cant<b>ar</b> (to sing), com<b>er</b> (to eat), viv<b>ir</b> (to live).",
"Those last two letters are the <b>ending</b>. What comes before is the <b>stem</b>."]},
{h:"Stem plus ending",p:[
"Read it as a sum: <b>stem + ending = infinitive</b>.",
"cant + ar = cantar. com + er = comer. viv + ir = vivir.",
"It works backwards too. See cantar and you know: stem cant, group -ar."]},
{h:"Why you need the stem",p:[
"To conjugate, you take the ending off and put a different tail on.",
"cantar becomes cant, then add -o: <b>canto</b>, I sing.",
"comer becomes com, then add -o: <b>como</b>, I eat.",
"The stem is the fixed part, the tail is the moving part."]},
{h:"Three groups, three sets of tails",p:[
"Each group has its own set of endings, and the vowel of the group turns up in them.",
"cant<b>ar</b> gives cant<b>amos</b>; com<b>er</b> gives com<b>emos</b>.",
"So checking the group is the first thing you do, before conjugating anything."]},
{h:"Regular or not",p:[
"A verb is <b>regular</b> if the stem does not change when you conjugate it.",
"hablar gives hablo, hablas, habla. The stem habl never moves. Regular.",
"poder gives puedo. The stem pod becomes pued. Not regular.",
"These are called stem-changing verbs: e becomes ie, o becomes ue.",
"The endings stay completely normal. Only the middle shifts, which is far less trouble than it sounds."]}],

EN_LESSONS.presente = {
lead:"You can conjugate now. But when do you actually use the present tense? The answer is generous: <b>far more often than in English</b>. One Spanish form covers two English tenses.",
why:"English speakers systematically overbuild here. They hear <i>-ing</i> and reach for estar plus -ando, when the plain form was already right. Fix this and your Spanish gets shorter and better at once.",
secs:[
{h:"One Spanish form, two English tenses",p:[
"<b>Canto.</b> That means <b>I sing</b>.",
"It also means <b>I am singing</b>.",
"Spanish does not separate the two in ordinary speech.",
"So when English uses -ing, you usually do nothing extra at all."]},
{h:"Then when do you use estoy cantando?",p:[
"There is a form for it: <b>estar</b> plus the verb with -ando or -iendo.",
"But you only use it to stress <b>right at this second</b>.",
"Someone phones and asks what you are doing: <b>Estoy comiendo.</b> Correct.",
"Saying you eat at two every day: <b>Como a las dos.</b> Not estoy comiendo.",
"Rule of thumb: if you could add <i>right now</i>, estar plus -ando is allowed. Otherwise use the plain form."]},
{h:"How to build the -ando form",p:[
"Take the stem and add a tail.",
"<b>-ar</b> verbs take <b>-ando</b>: cantar becomes cant<b>ando</b>.",
"<b>-er</b> and <b>-ir</b> verbs take <b>-iendo</b>: comer becomes com<b>iendo</b>, vivir becomes viv<b>iendo</b>.",
"Two groups, two tails. Simpler than conjugating."]},
{h:"Habits: what you always do",p:[
"The plain present also covers things you do regularly.",
"<b>Canto los domingos.</b> = I sing on Sundays. Note that little <b>los</b>.",
"English marks the habit with a plural: on Sunday<b>s</b>. Spanish marks it with los.",
"Other habit words: <b>todos los días</b>, <b>siempre</b>, <b>nunca</b>, <b>a veces</b>, <b>normalmente</b>."]},
{h:"And even for tomorrow",p:[
"Spanish uses the present for fixed near-future plans.",
"<b>Mañana trabajo.</b> = I am working tomorrow.",
"<b>El lunes viajo a Madrid.</b> = On Monday I travel to Madrid.",
"English does this too: <i>I fly on Monday</i>. So this one is free."]},
{h:"Questions: both word orders work",p:[
"<b>¿Cantas tú los domingos?</b> and <b>¿Tú cantas los domingos?</b> mean the same thing.",
"Better still, drop the pronoun: <b>¿Cantas los domingos?</b> is the most common.",
"There is no <i>do</i> to add. The question marks and your intonation carry it.",
"What you may never do is leave the verb in its plain form. ¿Tú cantar? does not exist."]}],

EN_LESSONS.usted = {
lead:"Spanish has two ways to say <b>you</b>. <b>tú</b> when you are on familiar terms, <b>usted</b> when you are being polite. In the plural: <b>vosotros</b> and <b>ustedes</b>.",
why:"English lost this distinction centuries ago, so there is nothing to transfer. But you use it constantly: you address a waiter differently from a friend at the bar.",
secs:[
{h:"The big shortcut: usted borrows the he-form",p:[
"This is the only thing you really have to remember, and it saves you a whole set of endings.",
"<b>usted</b> uses the same verb form as <b>él</b> and <b>ella</b>.",
"él habl<b>a</b> → usted habl<b>a</b>. Never usted hablas.",
"<b>ustedes</b> uses the same form as <b>ellos</b>: ellos habl<b>an</b> → ustedes habl<b>an</b>.",
"So there is nothing new to conjugate. You reuse what you already know."]},
{h:"Why it borrows the he-form",p:[
"usted comes from <i>vuestra merced</i>, roughly <i>your grace</i>.",
"That is a thing, not a person you address directly, so it takes the third person.",
"The phrase wore down to usted, but the grammar stayed.",
"You are literally saying <i>does your grace speak Spanish?</i>"]},
{h:"Which one to use",p:[
"<b>tú</b>: friends, family, people your own age or younger, anyone in a bar or café.",
"<b>usted</b>: strangers noticeably older than you, doctors, officials, police, smart restaurants, and always if someone uses usted with you.",
"Spain switches to tú <b>much faster</b> than Latin America. In an ordinary bar, tú with the barman is completely normal.",
"When in doubt, start with usted. If they answer with tú, switch. That is never wrong."]},
{h:"The plural differs by continent",p:[
"In <b>Spain</b>: vosotros for a group of friends, ustedes when you are being formal.",
"In <b>Latin America</b>: vosotros does not exist. Everyone gets ustedes, friends included.",
"So if you are learning for Latin America you can skip vosotros entirely."]},
{h:"How it sounds in practice",p:[
"To a waiter: <b>¿Tiene una mesa para dos?</b> That is usted.",
"At the bar: <b>¿Me pones una caña?</b> That is tú.",
"Both correct, different situations. You have already seen both in the phrase lessons.",
"And the classic pair: <b>¿Cómo está usted?</b> versus <b>¿Cómo estás?</b>"]}],

EN_LESSONS.possessives = {
lead:"<b>mi</b> is my, <b>tu</b> is your, <b>su</b> is his, her or their. These are easy: they only agree in <b>number</b>, not gender.",
why:"Without these you cannot talk about your own family or belongings. And because they are so simple, this is one of the quickest lessons here.",
secs:[
{h:"The forms",p:[
"<b>mi</b> = my. Plural: <b>mis</b>. mi hermano, mis hermanos.",
"<b>tu</b> = your. Plural: <b>tus</b>.",
"<b>su</b> = his, her, your (polite) or their. Plural: <b>sus</b>.",
"<b>nuestro</b> = our. This one does change for gender: nuestro, nuestra, nuestros, nuestras.",
"<b>vuestro</b> = your (plural, Spain). Also four forms.",
"So only nuestro and vuestro are fussy. The rest just count."]},
{h:"Why no feminine form?",p:[
"There is no mia or tua in this position. There is nothing to choose.",
"mi hermano and mi hermana are both mi. Less work than you feared.",
"But do not forget the -s for plurals: mis hermanos. That is the slip beginners make."]},
{h:"su is deliberately vague",p:[
"su can mean his, her, your or their. Context sorts it out.",
"If it is genuinely unclear, say it explicitly: la casa <b>de él</b>, la casa <b>de ella</b>.",
"That is the same de trick you use for ownership with ser."]},
{h:"tu and tú",p:[
"<b>tu</b> without an accent = your. <b>tú</b> with an accent = you.",
"Tu casa = your house. Tú eres alto = you are tall.",
"One accent changes the meaning entirely."]}],

EN_LESSONS.quantity = {
lead:"<b>mucho</b> is much or many, <b>poco</b> is little or few. Both agree with the noun: mucho, mucha, muchos, muchas.",
why:"You need these constantly: much work, little time, many people. And because they agree, they are good practice for everything else that agrees.",
secs:[
{h:"The four forms of mucho",p:[
"<b>mucho</b> with one masculine uncountable noun: mucho trabajo, a lot of work.",
"<b>mucha</b> with one feminine uncountable noun: mucha agua.",
"<b>muchos</b> with several masculine things: muchos libros.",
"<b>muchas</b> with several feminine things: muchas casas.",
"poco works identically: poco, poca, pocos, pocas."]},
{h:"Countable or not?",p:[
"Can you count it? Then plural: muchos libros.",
"Can you not count it (water, work, time, money)? Then singular: mucha agua, mucho tiempo.",
"English makes the same split with much and many. Spanish uses one word that changes shape instead."]},
{h:"mucho goes in front",p:[
"Unlike colours and qualities, mucho comes <b>before</b> the noun: muchas flores.",
"Because it is about quantity, not description. Quantities lead, like numbers do.",
"Compare: tres flores bonitas. Number first, description after. mucho behaves like the number."]},
{h:"muy is a different word",p:[
"<b>muy</b> also means very, but it attaches to an adjective, not a noun.",
"muy grande, muy cansado. muy never changes.",
"mucho goes with a thing: mucho trabajo. muy goes with a description: muy alto.",
"One to memorise: <b>muchas gracias</b>, not muy gracias, because gracias is a noun."]}],

EN_LESSONS.place = {
lead:"To say where something is you use a small set of phrases: encima de (on), debajo de (under), al lado de (next to). Almost all of them end in <b>de</b>.",
why:"With these you can describe a whole room. And they are the best possible practice for estar and hay, because location is their home ground.",
secs:[
{h:"The main ones",p:[
"<b>encima de</b> = on, on top of. El libro está encima de la mesa.",
"<b>debajo de</b> = under. El gato está debajo de la silla.",
"<b>al lado de</b> = next to. La lámpara está al lado de la cama.",
"<b>delante de</b> = in front of. <b>detrás de</b> = behind.",
"<b>dentro de</b> = inside. <b>fuera de</b> = outside.",
"<b>cerca de</b> = near. <b>lejos de</b> = far from.",
"<b>entre</b> = between. The only one without de."]},
{h:"Why the de is always there",p:[
"encima de literally means <i>on top of</i>. Spanish keeps the <i>of</i> where English often drops it.",
"So it is not encima la mesa but encima <b>de</b> la mesa.",
"entre is the exception, because it works with two things joined by y: entre la mesa y la silla."]},
{h:"de plus el becomes del",p:[
"When de meets el, they merge into <b>del</b>.",
"Not encima de el libro. It is encima <b>del</b> libro.",
"With la nothing happens: encima de la mesa stays as it is.",
"This is compulsory, not stylistic. de el simply does not exist in written or spoken Spanish."]},
{h:"Combining with hay and estar",p:[
"Known thing? <b>estar</b>: La llave está encima de la mesa.",
"New thing? <b>hay</b>: Hay una llave encima de la mesa.",
"So this lesson hangs directly off the hay lesson. Same question: does the listener know which one?"]}],

EN_LESSONS.zinsformule = {
lead:"Spanish sentences follow a reliable order. Learn the formula and you never have to wonder how to assemble one. You just fill it in.",
why:"Beginners build sentences by swapping English words for Spanish ones. That is exactly where word order goes wrong. A fixed formula lets you build left to right and land correctly.",
secs:[
{h:"The formula",p:[
"<b>Who</b> + <b>verb</b> + <b>preposition</b> + <b>article</b> + <b>noun</b> + <b>adjective</b>",
"Example: <b>Yo canto en la casa grande.</b> = I sing in the big house.",
"Yo (who) · canto (what I do) · en (where) · la (the) · casa (thing) · grande (what it is like).",
"You do not need every part. Who plus verb is already a sentence: <b>Canto.</b>"]},
{h:"What each part does",p:[
"<b>Who</b> performs the action. Can be dropped, because the verb ending gives it away.",
"<b>Verb</b> is what happens. The only part that can never be missing.",
"<b>Preposition</b> adds information: en (in), de (from), a (to), con (with).",
"<b>Article</b> shows the gender: el, la, un, una.",
"<b>Noun</b> is a person, animal, object, place or idea.",
"<b>Adjective</b> describes the noun, and always sits after it."]},
{h:"Negatives: no goes before the verb",p:[
"Positive: <b>Yo canto la canción.</b> = I sing the song.",
"Negative: <b>Yo <u>no</u> canto la canción.</b> = I do not sing the song.",
"no slides in between the person and the verb. Nowhere else.",
"Drop the pronoun and no leads: <b>No canto.</b>",
"This is one of the few Spanish rules with no exceptions at all."]},
{h:"There is no do or does",p:[
"English inserts a helper: <i>Do you sing?</i> and <i>I don't sing</i>.",
"Spanish has no such word. <b>¿Cantas?</b> is the whole question.",
"And <b>No canto</b> is the whole negative. Nothing to translate.",
"This is the single most common thing English speakers try to add. Resist it."]},
{h:"Questions: two orders both work",p:[
"Verb first: <b>¿Cantas tú los domingos?</b>",
"Person first: <b>¿Tú cantas los domingos?</b> Your voice does the work.",
"Most common of all: drop the pronoun. <b>¿Cantas los domingos?</b>",
"All three are correct. Only leaving the verb in its plain form is wrong."]}],

EN_LESSONS.wordorder = {
lead:"Spanish word order is close to English, with three differences that matter. Know those and your sentences stop sounding translated.",
why:"You can get every word right and still build a sentence that sounds foreign. Word order is what makes it sound Spanish rather than English with Spanish words.",
secs:[
{h:"Difference 1: the adjective moves back",p:[
"English: a <b>red</b> car. Spanish: un coche <b>rojo</b>.",
"The thing comes first, what it is like comes second.",
"Exception: numbers and quantities do stay in front. dos coches rojos, muchos coches rojos."]},
{h:"Difference 2: no auxiliary verbs",p:[
"English builds questions and negatives with do: <i>Do you work?</i>, <i>I don't work.</i>",
"Spanish has neither. ¿Trabajas? and No trabajo.",
"So when you feel the urge to add a helper verb, that is the habit to drop."]},
{h:"Difference 3: no comes before the verb",p:[
"English attaches not to the helper: <i>I do <b>not</b> eat that</i>.",
"Spanish puts no directly before the main verb: <b>No</b> como eso.",
"Same with gustar: No me gusta. First no, then the little word, then the verb."]},
{h:"The default order",p:[
"<b>Who</b> plus <b>verb</b> plus <b>what</b> plus <b>where or when</b>.",
"Mi hermana come pan en la cocina.",
"And the pronoun can go: Come pan en la cocina.",
"A question changes nothing: ¿Come pan en la cocina? Only the marks and the tune."]}],

EN_LESSONS.conversation = {
lead:"Time to talk. With a small set of fixed phrases you can introduce yourself, ask something and close politely. You do not need to understand these down to the last word. Treat them as blocks.",
why:"Grammar is useful, but a conversation is about reacting. These phrases buy you thinking time and let you join in from day one.",
secs:[
{h:"Greetings",p:[
"<b>Hola</b> = hello. Always safe, any time of day.",
"<b>Buenos días</b> = good morning, until about two in the afternoon.",
"<b>Buenas tardes</b> = good afternoon, until dark.",
"<b>Buenas noches</b> = good evening, and also good night.",
"Note the -s: it is buenos días, not buen día, in Spain."]},
{h:"Introducing yourself",p:[
"<b>¿Cómo te llamas?</b> = What is your name? Literally: how do you call yourself?",
"<b>Me llamo Jurre.</b> = My name is Jurre.",
"<b>¿De dónde eres?</b> = Where are you from?",
"<b>Soy de Inglaterra.</b> = I am from England.",
"<b>Mucho gusto.</b> = Pleased to meet you."]},
{h:"How are you",p:[
"<b>¿Cómo estás?</b> = How are you? With estar, because it is about now.",
"<b>Muy bien, gracias.</b> = Very well, thank you.",
"<b>Más o menos.</b> = So-so. Literally: more or less.",
"<b>¿Y tú?</b> = And you? Do not skip this. Not asking back reads as rude."]},
{h:"Emergency phrases",p:[
"<b>No entiendo.</b> = I do not understand.",
"<b>¿Puedes repetir?</b> = Can you repeat that?",
"<b>Más despacio, por favor.</b> = More slowly, please.",
"<b>¿Cómo se dice ... en español?</b> = How do you say ... in Spanish?",
"<b>Lo siento.</b> = I am sorry. <b>Perdón.</b> = Excuse me.",
"These five will rescue any conversation. Learn them before anything else."]},
{h:"In a shop or café",p:[
"<b>¿Cuánto es?</b> = How much is it?",
"<b>Un café, por favor.</b> = A coffee, please.",
"<b>La cuenta, por favor.</b> = The bill, please.",
"<b>Quiero ...</b> = I want ... Softer: <b>Quería ...</b> or <b>Me gustaría ...</b>",
"<b>Gracias</b> and <b>de nada</b> (you are welcome) belong with all of it."]}],

{es:"¿Cómo estás? Muy bien, gracias.",words:[["¿Cómo","How"],["estás","are you"],["Muy","Very"],["bien","well"],["gracias","thank you"]],

explain:"How you are is about now, so estar. you takes estás, with an accent. The answer is bien, not bueno.",
why:"bien means well, bueno means good as a quality. Estoy bien and soy bueno are different claims.",
mistake:"Beginners say estoy bueno, which in colloquial Spanish means you are good looking.",
trick:"How are you? Answer <b>bien</b>. What are you like? Answer bueno."},
{es:"Perdón, no entiendo. ¿Puedes repetir?",words:[["Perdón","Sorry"],["no","not"],["entiendo","I understand"],["¿Puedes","Can you"],["repetir","repeat"]],

explain:"no goes before the verb. puedes is the you form of can, and repetir stays plain after it.",
why:"After a verb like poder the second verb stays in its plain form, exactly as after tener que.",
mistake:"Beginners say ¿puedes repites? Only the first verb is conjugated.",
trick:"These are the two sentences you will use most. Learn them as one block."}],

/* ---------- Engelse woordenschatlessen ---------- */
function enVocabLesson(theme, lead, why, secs, examples, dutchNote, trick){
  return {lead, why, secs, examples, dutch:dutchNote, trick, wordTheme:theme, mistakes:[
    "Learning the word without el or la in front of it.",
    "Putting the stress in the wrong place. Check the capitals in the pronunciation guide.",
    "Forgetting to change the rest of the sentence when the noun goes plural."]};
}

EN_LESSONS.family = enVocabLesson("family",
"Family words are the nicest place to start, because they come up in almost every conversation and they are built very logically.",
"Once you know these you can talk about yourself. That is the point where a language starts to feel alive.",
[{h:"They come in pairs",p:[
"Nearly every family word has a partner: hermano and hermana, hijo and hija, abuelo and abuela.",
"The -o form is male, the -a form is female. So you really only learn half of them.",
"Know hermano and you already know hermana."]},
{h:"Plurals with a man in them go masculine",p:[
"<b>los padres</b> does not mean the fathers. It means <b>the parents</b>.",
"<b>los hermanos</b> can mean the brothers, or brothers and sisters together.",
"<b>los hijos</b> = the children. <b>los abuelos</b> = the grandparents.",
"One man in the group is enough to make the whole group masculine."]},
{h:"Talking about your family",p:[
"Tengo dos hermanos. = I have two brothers, or two siblings.",
"Mi padre se llama John. = My father is called John.",
"Mi madre es profesora. = My mother is a teacher. Job with ser, and no article.",
"Mis abuelos viven en Escocia. = My grandparents live in Scotland."]}],
[{es:"Mi hermana tiene dos hijos.",words:[["Mi","My"],["hermana","sister"],["tiene","has"],["dos","two"],["hijos","children"]],
nl:"My sister has two children.",
explain:"hijos in the plural means children: sons and daughters together. mi does not change for gender.",
why:"A mixed group takes the masculine form. Two daughters would be dos hijas, but a son and a daughter are dos hijos.",
mistake:"Beginners assume hijos means only sons and go looking for a separate word for children. There is not one.",
trick:"A plural family word means the whole group, not just the men."},
{es:"Mis padres son de Irlanda.",words:[["Mis","My"],["padres","parents"],["son","are"],["de","from"],["Irlanda","Ireland"]],
nl:"My parents are from Ireland.",
explain:"los padres means the parents. Several things, so mi becomes mis. Origin uses ser plus de.",
why:"padre in the plural covers father and mother together, so mi becomes mis and es becomes son.",
mistake:"Beginners write mi padres. The -s goes on mi as well.",
trick:"padres = parents. If you mean the fathers, you have to say so explicitly."}],
"English has separate words for parents and children. Spanish reuses padre and hijo in the plural, which is fewer words to learn, but you do have to get used to los padres meaning the parents.",
"Learn family words in pairs: hermano and hermana together. Two words for the price of one.");

EN_LESSONS.house = enVocabLesson("house",
"House words are perfect for practice, because you can look around you and name what you see.",
"With these words plus estar and the place words you can describe an entire room. That is real language, not a list.",
[{h:"Look around and say it",p:[
"The fastest way to learn these is to point at them. Walk through your home saying la cocina, el baño, el salón.",
"Always say the article with it. Not cocina, but la cocina.",
"Do it three days running and you will not forget them."]},
{h:"Rooms follow the usual rules",p:[
"Ending in -o or a consonant: masculine. el dormitorio, el salón, el baño, el jardín.",
"Ending in -a: feminine. la cocina, la casa, la escalera.",
"la pared (the wall) ends in a d and is feminine, along with the other -dad type words."]},
{h:"Describing a room",p:[
"En la cocina hay una mesa. = In the kitchen there is a table.",
"La mesa está al lado de la ventana. = The table is next to the window.",
"First hay to say what exists, then está to say where it is. That is the natural order of any description."]}],
[{es:"En mi casa hay tres dormitorios y un baño.",words:[["En","In"],["mi","my"],["casa","house"],["hay","there are"],["tres","three"],["dormitorios","bedrooms"],["y","and"],["un","one"],["baño","bathroom"]],
nl:"In my house there are three bedrooms and a bathroom.",
explain:"hay introduces what exists. After hay comes a number or un, never el or la.",
why:"You are listing what the house contains, which is new information, so hay. And hay stays hay for three rooms.",
mistake:"Beginners write hay los tres dormitorios. No article after hay.",
trick:"Describing a house always starts with hay."},
{es:"La cocina está al lado del salón.",words:[["La","The"],["cocina","kitchen"],["está","is"],["al lado","next to"],["del","of the"],["salón","living room"]],
nl:"The kitchen is next to the living room.",
explain:"Now you are placing something, so está. al lado de plus el salón becomes al lado del salón.",
why:"de and el merge into del. And location always uses estar, never ser.",
mistake:"Beginners write al lado de el salón, which does not exist.",
trick:"See de and el together? Make it del."}],
"English builds room names from one root: bedroom, bathroom, living room. Spanish uses unrelated words: dormitorio, baño, salón. There is one clue though: dormitorio comes from dormir, to sleep. So it is the sleeping place.",
"Walk through your home for three days naming each room out loud, with el or la. It beats reading a list ten times.");

EN_LESSONS.furniture = enVocabLesson("furniture",
"Furniture and things around the house. You will use these straight away with the place words: on the table, under the chair, next to the bed.",
"This is the vocabulary you can practise without a book. Everything you can see, you can name.",
[{h:"Most of them are feminine",p:[
"la mesa, la silla, la cama, la lámpara, la puerta, la ventana. All ending in -a, all feminine.",
"That means you will mostly be using la, las and adjectives in -a: la mesa pequeña.",
"The masculine exceptions: el sofá, el armario, el espejo, el cuadro."]},
{h:"el sofá is a trap",p:[
"sofá ends in a, so you expect feminine. It is masculine: <b>el</b> sofá.",
"The word came from Arabic and is stressed on the final a. Words like that are usually masculine.",
"Just remember it alongside el día and el mapa."]},
{h:"Combining with adjectives",p:[
"la mesa grande, la silla roja, el sofá nuevo.",
"The adjective goes after the noun and agrees with it: mesa is feminine, so roja.",
"So you practise two things at once: the word, and the agreement."]}],
[{es:"La lámpara está encima de la mesilla.",words:[["La","The"],["lámpara","lamp"],["está","is"],["encima","on top"],["de","of"],["la","the"],["mesilla","bedside table"]],
nl:"The lamp is on the bedside table.",
explain:"Two feminine nouns, so la twice. Location uses estar. encima de means on top of.",
why:"Both words end in -a and are feminine. And because la follows de, nothing merges.",
mistake:"Beginners turn de la into del. Only de plus el merges.",
trick:"del only exists with el. With la it stays de la."},
{es:"Tenemos un sofá nuevo y dos sillas viejas.",words:[["Tenemos","We have"],["un","a"],["sofá","sofa"],["nuevo","new"],["y","and"],["dos","two"],["sillas","chairs"],["viejas","old"]],
nl:"We have a new sofa and two old chairs.",
explain:"sofá is masculine despite the a, so un sofá nuevo. silla is feminine and plural, so dos sillas viejas.",
why:"One masculine and one feminine noun in the same sentence, each with its own forms.",
mistake:"Beginners write una sofá nueva because of the a ending. sofá is the exception.",
trick:"Remember three exceptions together: el sofá, el día, el mapa."}],
"English and Spanish share almost no vocabulary here, but the thinking is the same: you say a big table and the table is big. The only thing to flip is where the adjective sits.",
"Say each item three times with its article and one adjective: la mesa grande, la mesa grande, la mesa grande.");

EN_LESSONS.food = enVocabLesson("food",
"Food and drink is the vocabulary you will use first and most. In a restaurant or a shop you need these words immediately.",
"It also contains one exception you have to know: el agua, a feminine word wearing a masculine article.",
[{h:"Ordering takes three words",p:[
"<b>Un café, por favor.</b> Done. It really is that simple.",
"Slightly softer: <b>Quería un café.</b> I would like a coffee.",
"And afterwards: <b>La cuenta, por favor.</b>"]},
{h:"el agua: the famous exception",p:[
"agua is <b>feminine</b> but takes <b>el</b>, because la agua is clumsy with two a-sounds together.",
"It stays feminine, so the adjective agrees as feminine: el agua frí<b>a</b>.",
"In the plural it goes back to normal: <b>las</b> aguas.",
"This is one of the few exceptions genuinely worth memorising."]},
{h:"Free words and false friends",p:[
"Some words you get for nothing: el chocolate, el tomate, el café, la sopa.",
"One false friend: <b>el pescado</b> is fish on a plate, <b>el pez</b> is a fish swimming about.",
"And carne is meat, not carnival."]}],
[{es:"El agua está muy fría.",words:[["El","The"],["agua","water"],["está","is"],["muy","very"],["fría","cold"]],
nl:"The water is very cold.",
explain:"agua takes el but is feminine, hence fría with an a. Cold right now, so está.",
why:"Only the article changed, and only for the sound. The gender of the word itself did not.",
mistake:"Beginners write el agua frío, matching the adjective to el instead of to agua.",
trick:"el agua is in disguise. Masculine outside, feminine inside."},
{es:"Quiero un café con leche, por favor.",words:[["Quiero","I want"],["un","a"],["café","coffee"],["con","with"],["leche","milk"],["por favor","please"]],
nl:"I would like a white coffee, please.",
explain:"café is masculine, so un café. con means with, and no article follows it here.",
why:"For an unspecified amount of something, Spanish drops the article. con leche means with milk in general.",
mistake:"Beginners write un café con la leche, which suggests one particular milk.",
trick:"café con leche is a single block. Learn it as one word."}],
"Plenty of food words travel between languages, so tomate, chocolate and café are gifts. Watch only for pescado versus pez, where English has one word and Spanish has two.",
"Order something in your head every day: un café, una cerveza, un agua. That way you practise the article wherever you are.");

EN_LESSONS.animals = enVocabLesson("animals",
"Animal words are easy to remember because you can picture them. They are also ideal for practising articles and plurals.",
"Almost all of them follow the rules exactly, so you can test your gender and plural knowledge without nasty surprises.",
[{h:"Male and female animals",p:[
"Some come in pairs: el perro and la perra, el gato and la gata.",
"Others have one form for both: la araña (spider), el pez (fish), la abeja (bee).",
"Talking about an animal without knowing its sex? Use whichever form you know."]},
{h:"Watch out for el pez",p:[
"pez ends in z, so the plural is peces, with a c.",
"And remember: pez is a live fish, pescado is fish you eat.",
"So el pez está en el agua, but como pescado."]},
{h:"Describing animals",p:[
"El perro es grande. = The dog is big. A permanent quality, so ser.",
"El perro está en el jardín. = The dog is in the garden. Location, so estar.",
"Two sentences about the same dog with two different verbs. Perfect ser and estar practice."]}],
[{es:"Hay dos peces en el agua.",words:[["Hay","There are"],["dos","two"],["peces","fish"],["en","in"],["el","the"],["agua","water"]],
nl:"There are two fish in the water.",
explain:"pez becomes peces in the plural, because the z turns into a c. After hay a number is enough.",
why:"Spanish almost never writes z before e. So peces, not pezes. The sound is identical.",
mistake:"Beginners write pezes. Remember this word as the example of the z rule.",
trick:"z takes a holiday before e. c covers for it."},
{es:"Mi gato es negro y está en el sofá.",words:[["Mi","My"],["gato","cat"],["es","is"],["negro","black"],["y","and"],["está","is"],["en","on"],["el","the"],["sofá","sofa"]],
nl:"My cat is black and is on the sofa.",
explain:"Black is a permanent quality, so es. Being on the sofa is location, so está. Two verbs, one sentence.",
why:"This is precisely why Spanish has two verbs for to be. English uses is twice and loses the distinction.",
mistake:"Beginners pick one verb for the whole sentence.",
trick:"Colour is passport (ser). Position is diary (estar)."}],
"There is no vocabulary bridge from English here, so use pictures instead. Look at the emoji in the word list and say the Spanish out loud without translating first.",
"Use each animal in two sentences: one with ser for what it is like, one with estar for where it is.");

EN_LESSONS.colors = enVocabLesson("colors",
"Colours are adjectives, so they agree with the thing they describe. But not all of them: some change, some do not.",
"Colours are the best way to practise agreement, because you can attach one to any noun you already know.",
[{h:"Colours in -o agree fully",p:[
"rojo, blanco, negro, amarillo, morado. Four forms each.",
"el coche rojo, la casa roja, los coches rojos, las casas rojas.",
"So with these you always have to think about gender and number."]},
{h:"Colours in -e or a consonant agree halfway",p:[
"verde, azul, gris, marrón. No separate masculine and feminine.",
"la casa verde and el coche verde: identical.",
"They do change in the plural: verdes, azules, grises, marrones. Vowel: +s. Consonant: +es."]},
{h:"rosa and naranja never change",p:[
"rosa (pink) and naranja (orange) are really the names of things: a rose and an orange.",
"So they do not change at all, not even in the plural: las casas rosa, los coches naranja.",
"You will hear naranjas in casual speech, but rosa stays rosa."]},
{h:"Where the colour goes",p:[
"After the noun. Always. la casa blanca, el vino rojo.",
"To intensify, muy goes in front: la casa muy blanca.",
"And claro (light) or oscuro (dark) comes after the colour: azul claro, verde oscuro."]}],
[{es:"Las casas son blancas.",words:[["Las","The"],["casas","houses"],["son","are"],["blancas","white"]],
nl:"The houses are white.",
explain:"casa is feminine and plural, so las and son. blanco ends in -o, so it agrees fully: blancas.",
why:"Colours in -o have four forms. Feminine plus plural gives -as, and all three words show the plural.",
mistake:"Beginners write las casas son blancos, getting the number right and the gender wrong.",
trick:"Copy the last two letters of the noun: cas<b>as</b> → blanc<b>as</b>."},
{es:"Tengo dos coches azules.",words:[["Tengo","I have"],["dos","two"],["coches","cars"],["azules","blue"]],
nl:"I have two blue cars.",
explain:"azul does not change for gender, but it does for number. It ends in a consonant, so -es: azules.",
why:"With colours that do not end in -o you only have to think about number, which is less work than rojo.",
mistake:"Beginners write azuls or azulos. After a consonant it is -es, and there is no gendered form.",
trick:"Colour not ending in -o? Then only the plural matters."}],
"English colours never change at all: red car, red cars, red houses. So agreement is the entirely new habit here. The good news is that half the colours barely change either.",
"Look around and describe three things you can see: la puerta blanca, el libro rojo, las sillas verdes.");

function allItems(t){ return PHRASES[t].groups.reduce((a,g)=>a.concat(g.items),[]); }
function phraseGens(t){
  reg(t,"nl2es",()=>{
    const it = R.pick(allItems(t));
    return {type:"input", prompt:L("Hoe zeg je dit in het Spaans?","How do you say this in Spanish?"),
      sentence:phraseNl(it[0],it[1]), showEs:it[0],
      answer:it[0], accept:[it[0], it[0].replace(/[¿?¡!.,]/g,"").trim()],
      why:phraseNl(it[0],it[1])+" is <b>"+it[0]+"</b>. "+L("Uitspraak: ","Pronunciation: ")+pronOf(it[0])+". "+phraseNote(it[0],it[2]),
      wrongWhy:{},
      ruleName:L("Vaste zinnen voor: "+PHRASES[t].nl, "Set phrases for: "+topicNaam(TOPIC[t])),
      mistake:L("Woord voor woord vertalen. Deze zinnen leer je als één blok.",
                "Translating word by word. Learn these as one block."),
      trick:L("Zeg hem drie keer hardop.","Say it out loud three times. Set phrases are learned with your mouth, not your eyes.")};
  });
  reg(t,"es2nl",()=>{
    const it = R.pick(allItems(t)), others = R.pickN(allItems(t).filter(x=>x[0]!==it[0]),3);
    return {type:"mc", prompt:L("Wat betekent dit?","What does this mean?"), sentence:it[0], showEs:it[0],
      options:[phraseNl(it[0],it[1])].concat(others.map(x=>phraseNl(x[0],x[1]))), answer:phraseNl(it[0],it[1]),
      why:it[0]+L(" betekent "," means ")+phraseNl(it[0],it[1])+" "+L("Uitspraak: ","Pronunciation: ")+pronOf(it[0])+". "+phraseNote(it[0],it[2]),
      wrongWhy:others.reduce((o,x)=>{o[phraseNl(x[0],x[1])]=L("Dat is ","That is ")+x[0];return o;},{}),
      ruleName:L("Zinnen herkennen: "+PHRASES[t].nl, "Recognising phrases: "+topicNaam(TOPIC[t])),
      mistake:L("Alleen op één bekend woord letten.","Latching onto one familiar word and guessing the rest."),
      trick:L("Zoek het werkwoord.","Find the verb. It tells you what is happening.")};
  });
  reg(t,"situatie",()=>{
    const pool = allItems(t).filter(x=>x[2]);
    const it = R.pick(pool), others = R.pickN(pool.filter(x=>x[0]!==it[0]),3);
    return {type:"mc", prompt:L("Wat zeg je in deze situatie?","What do you say in this situation?"),
      sentence:phraseNote(it[0],it[2]) || it[2], showEs:it[0],
      options:[it[0]].concat(others.map(x=>x[0])), answer:it[0],
      why:"<b>"+it[0]+"</b> ("+phraseNl(it[0],it[1])+"). "+L("Uitspraak: ","Pronunciation: ")+pronOf(it[0])+".",
      wrongWhy:others.reduce((o,x)=>{o[x[0]]=x[0]+L(" betekent "," means ")+phraseNl(x[0],x[1])+L(" Dat past hier niet."," That does not fit here.");return o;},{}),
      ruleName:L("De juiste zin op het juiste moment","The right phrase at the right moment"),
      mistake:L("De zin wel kennen maar op het verkeerde moment gebruiken.","Knowing the phrase but using it at the wrong moment."),
      trick:L("Loop de situatie in je hoofd na.","Walk through the situation in your head: arriving, ordering, paying.")};
  });
  reg(t,"luister",()=>{
    const it = R.pick(allItems(t)), others = R.pickN(allItems(t).filter(x=>x[0]!==it[0]),3);
    return {type:"listen", prompt:L("Luister en kies wat je hoort.","Listen and pick what you hear."),
      showEs:it[0], audio:it[0],
      options:[it[0]].concat(others.map(x=>x[0])), answer:it[0],
      why:L("Je hoorde: ","You heard: ")+"<b>"+it[0]+"</b> ("+phraseNl(it[0],it[1])+"). "+L("Uitspraak: ","Pronunciation: ")+pronOf(it[0])+".",
      wrongWhy:others.reduce((o,x)=>{o[x[0]]="Dat klinkt als "+pronOf(x[0])+".";return o;},{}),
      ruleName:L("Gesproken zinnen herkennen","Recognising spoken phrases"),
      mistake:L("Te snel kiezen.","Choosing too fast. Listen as often as you like."),
      trick:L("Let op het eerste woord en het ritme.","Listen for the first word and the rhythm of the phrase.")};
  });
  reg(t,"gat",()=>{
    const it = R.pick(allItems(t).filter(x=>x[0].split(" ").length>2));
    const words = it[0].replace(/[¿?¡!]/g,"").split(" ");
    const i = R.int(words.length), gap = words[i].replace(/[.,]/g,"");

  reg(t,"bouw",()=>{

  const frameNl = LANG==="en" ? (EN_FRAME[pat.frameNl] || pat.frameNl) : pat.frameNl;
  const nl = frameNl.replace(/\{(\w+)\}/g, (m,k)=>{
    const o = pat.slots[k][(sel&&sel[k])||0];
    return slotNl(o[0], o[1]);
  });
  return {es:es.trim(), nl:nl.trim()};
}
function randomFill(pat){
  const sel = {};
  Object.keys(pat.slots).forEach(k => sel[k] = R.int(pat.slots[k].length));
  return {sel, out:fillPattern(pat, sel)};
}

/* ---------- generatoren ---------- */
function buildGens(src){
  const t = "b_"+src;
  const pats = () => BUILD[src].patterns;
  /* verzamel altijd genoeg verschillende afleiders */
  const distractors = (avoid, n) => {
    const out = []; let guard = 0;
    while(out.length < n && guard++ < 80){
      const cand = randomFill(R.pick(pats())).out.es;
      if(cand !== avoid && out.indexOf(cand) < 0) out.push(cand);
    }
    return out;
  };
  reg(t,"bouw",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    const words = f.out.es.replace(/[¿?¡!]/g,"").split(" ");
    return {type:"build", prompt:L("Maak deze zin in het Spaans.","Make this sentence in Spanish."),
      sentence:f.out.nl, showEs:f.out.es,
      pool:R.shuffle(words), answer:words.join(" "), accept:[words.join(" "), f.out.es, f.out.es.replace(/[¿?¡!]/g,"")],
      why:"<b>"+f.out.es+"</b> = "+f.out.nl+" "+L("Uitspraak: ","Pronunciation: ")+pronOf(f.out.es)+". "+noteTxt(pat),
      wrongWhy:{},
      ruleName:L("Patroon: ","Pattern: ")+patName(pat),
      mistake:L("De Nederlandse woordvolgorde aanhouden.","Keeping English word order."),
      trick:L("Bouw eerst het frame en vul dan het gat.","Build the frame first ("+pat.frame.replace(/\{\w+\}/g,"...")+"), then fill the gap.")};
  });
  reg(t,"zelfmaken",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"input", prompt:L("Maak zelf deze zin in het Spaans.","Write this sentence in Spanish yourself."),
      sentence:f.out.nl, showEs:f.out.es,
      answer:f.out.es, accept:[f.out.es, f.out.es.replace(/[¿?¡!.,]/g,"").trim()],
      why:"<b>"+f.out.es+"</b> "+L("Uitspraak: ","Pronunciation: ")+pronOf(f.out.es)+". "+noteTxt(pat),
      wrongWhy:{},
      ruleName:L("Patroon: ","Pattern: ")+patName(pat)+" ("+pat.frame+")",
      mistake:L("Het kleine woordje ertussen vergeten.","Getting the frame right but dropping the small word inside it, like the a in voy a or the al in juego al."),
      trick:L("Zeg eerst het frame hardop.","Say the frame out loud first, then the word that goes in it.")};
  });
  reg(t,"gat",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    const k = R.pick(Object.keys(pat.slots));
    const right = pat.slots[k][f.sel[k]][0];
    const others = R.pickN(pat.slots[k].filter((x,i)=>i!==f.sel[k]),3).map(x=>x[0]);
    const shown = pat.frame.replace(new RegExp("\\{"+k+"\\}"), "___")
      .replace(/\{(\w+)\}/g, (m,kk)=> pat.slots[kk][f.sel[kk]][0]);
    return {type:"mc", prompt:L("Je wil zeggen: ","You want to say: ")+f.out.nl+L(" Wat komt er in het gat?"," What goes in the gap?"),
      sentence:shown, showEs:f.out.es,
      options:[right].concat(others), answer:right,
      why:L("De hele zin wordt: ","The full sentence is: ")+"<b>"+f.out.es+"</b> ("+f.out.nl+") "+L("Uitspraak: ","Pronunciation: ")+pronOf(f.out.es)+".",
      wrongWhy:pat.slots[k].filter((x,i)=>i!==f.sel[k]).reduce((o,x)=>{o[x[0]]=x[0]+L(" betekent "," means ")+slotNl(x[0],x[1]);return o;},{}),
      ruleName:L("Patroon: ","Pattern: ")+patName(pat),
      mistake:L("Het gat vullen met iets dat niet in dit frame past.","Filling the gap with something that makes sense but does not fit this frame."),
      trick:noteTxt(pat)};
  });
  reg(t,"kies",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"mc", prompt:L("Welke zin betekent dit?","Which sentence means this?"), sentence:f.out.nl, showEs:f.out.es,
      options:[f.out.es].concat(distractors(f.out.es,3)), answer:f.out.es,
      why:"<b>"+f.out.es+"</b> "+L("Uitspraak: ","Pronunciation: ")+pronOf(f.out.es)+". "+noteTxt(pat),
      wrongWhy:{},
      ruleName:L("Patroon: ","Pattern: ")+patName(pat),
      mistake:L("Op één bekend woord afgaan.","Going on one familiar word without reading the rest."),
      trick:L("Kijk eerst welk frame er staat.","Check which frame it is first, then the word in the gap.")};
  });
  reg(t,"luister",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"listen", prompt:L("Luister en kies de zin die je hoort.","Listen and pick the sentence you hear."),
      showEs:f.out.es, audio:f.out.es,
      options:[f.out.es].concat(distractors(f.out.es,3)), answer:f.out.es,
      why:L("Je hoorde: ","You heard: ")+"<b>"+f.out.es+"</b> ("+f.out.nl+") "+L("Uitspraak: ","Pronunciation: ")+pronOf(f.out.es)+".",
      wrongWhy:{},
      ruleName:"Patroon: "+pat.name,
      mistake:L("Te snel kiezen.","Choosing too fast. Listen again, you always may."),
      trick:L("Let op het frame aan het begin van de zin.","Listen for the frame at the start of the sentence.")};
  });
}

/* Voortgang van een oudere versie mag gewoon in een nieuwere app.
   Onderwerpen die nieuw zijn beginnen op nul, onderwerpen die weg zijn
   worden overgeslagen. Zo overleeft je voortgang elke update. */
function applyState(d){
  if(!d || typeof d !== "object") return false;
  Object.keys(d).forEach(k=>{
    if(k==="t"){ Object.keys(d.t||{}).forEach(id=>{ if(S.t[id]) Object.assign(S.t[id], d.t[id]); }); }
    else if(k in S) S[k]=d[k];
  });
  /* losse tellers van verdwenen regels of woorden opruimen zodat het bestand klein blijft */
  ["r","w"].forEach(k=>{ if(!S[k] || typeof S[k]!=="object") S[k]={}; });
  if(!Array.isArray(S.unlocked)) S.unlocked = [];
  return true;
}

function bump(topic, ok){

  t.seen++; if(ok) t.ok++;
  if(ok) t.strength = Math.min(100, t.strength + (100-t.strength)*0.20 + 2);
  else   t.strength = Math.max(0,   t.strength - t.strength*0.28 - 5);
}

};

/* onderwerpen wegen: zwak komt vaker terug */
function weightedTopic(list){
  const pool = [];
  list.forEach(t=>{
    const s = S.t[t.id];
    let w = Math.max(1, Math.round((100 - s.strength)/12)) + (s.seen===0?3:0);
    for(let i=0;i<w;i++) pool.push(t.id);
  });
  return R.pick(pool);
}

/* ============================================================
   5. SESSIE: de oefenlus met herhaling tot je het kan
   ============================================================ */
let SESS = null;
const REM_CAP = 6;

function newSession(cfg){
  SESS = Object.assign({
    mode:"practice", topic:null, queue:[], idx:0, right:0, wrong:0,
    ruleStreak:{}, remLeft:{}, remRounds:{}, missed:{}, answered:0,
    limit:0, endAt:0, done:false, lastFb:null
  }, cfg);
  fillQueue();
  return SESS;
}
function nextExercise(){
  if(SESS.mode==="practice" || SESS.mode==="weak"){
    const id = SESS.topic || weightedTopic(weakTopics().length?weakTopics():openTopics());
    return makeExercise(id);
  }
  if(SESS.mode==="quiz") return makeExercise(SESS.topic);
  return makeExercise(weightedTopic(openTopics()));
}
function fillQueue(){
  const want = SESS.limit ? Math.min(SESS.limit, SESS.idx+6) : SESS.idx+6;
  let guard = 0;
  while(SESS.queue.length < want && guard++ < 40){
    const e = nextExercise();
    if(e) SESS.queue.push(e);
  }
}
function addRemediation(rule, n){
  const topic = rule.split(".")[0];
  const items = [];
  for(let i=0;i<n;i++){
    const e = makeExercise(topic, rule);
    if(e){ e.rem = rule; items.push(e); }
  }
  SESS.queue.splice(SESS.idx+1, 0, ...items);
  SESS.remLeft[rule] = (SESS.remLeft[rule]||0) + items.length;
  SESS.remRounds[rule] = (SESS.remRounds[rule]||0) + 1;
  return items.length;
}

/* Alles wat redelijkerwijs goed is, telt als goed.
   Vul je alleen het gat in? Prima. Typ je de hele zin? Ook prima. */
function acceptSet(e){
  const base = (e.accept && e.accept.length ? e.accept : [e.answer]).filter(Boolean).map(String);
  const out = base.slice();
  const push = v => { v = String(v==null?"":v).trim(); if(v && !out.some(x=>sameLoose(x,v))) out.push(v); };
  const sent = e.sentence ? String(e.sentence) : "";
  const gaps = (sent.match(/___/g)||[]).length;

  if(gaps===1) base.forEach(a => push(sent.replace("___", a)));
  if(gaps>1){
    base.forEach(a=>{
      const parts = a.split(/\s*,\s*/);
      if(parts.length===gaps){ let i=0; push(sent.replace(/___/g, ()=>parts[i++])); }
      else push(sent.replace(/___/g, a));
    });
  }
  /* de hele goede zin telt altijd, behalve als die gelijk is aan de vraag zelf */
  if(e.showEs && !sameLoose(e.showEs, sent)) push(e.showEs);
  base.slice().forEach(a => push(a.replace(/[¿¡]/g,"")));
  return out;
}

function grade(e, given){
  let ok, hit = null;
  if(e.type==="input" || e.type==="build"){
    const set = acceptSet(e);
    hit = set.find(a=>sameLoose(a, given));
    ok = !!hit;
  } else ok = given === e.answer;

  const flat = x => String(x==null?"":x).toLowerCase().replace(/\s+/g," ").trim();
  const accentOnly = !!(ok && hit && flat(hit) !== flat(given));

  S.answered++; if(ok){ S.correct++; S.streak++; S.best=Math.max(S.best,S.streak); } else S.streak = 0;
  bump(e.topic, ok);
  S.r[e.rule] = S.r[e.rule] || {ok:0,no:0};
  ok ? S.r[e.rule].ok++ : S.r[e.rule].no++;
  if(e.word){ S.w[e.word] = S.w[e.word] || {ok:0,no:0}; ok ? S.w[e.word].ok++ : S.w[e.word].no++; }

  SESS.answered++;
  if(ok){ SESS.right++; SESS.ruleStreak[e.rule] = (SESS.ruleStreak[e.rule]||0)+1; }
  else  { SESS.wrong++; SESS.ruleStreak[e.rule] = 0; SESS.missed[e.rule] = (SESS.missed[e.rule]||0)+1; }

  addXp(ok ? (SESS.mode==="quiz"||SESS.mode==="mixed"||SESS.mode==="master" ? 8 : 6) : 1);

  /* de herhaallus: fout betekent vijf nieuwe van precies deze regel */
  let extra = 0;
  const drilling = SESS.mode==="practice" || SESS.mode==="weak";
  if(drilling){
    if(!ok && (SESS.remRounds[e.rule]||0) < REM_CAP) extra = addRemediation(e.rule, 5);
    if(e.rem){
      SESS.remLeft[e.rem] = Math.max(0, (SESS.remLeft[e.rem]||0)-1);
      if(SESS.remLeft[e.rem]===0 && (SESS.ruleStreak[e.rem]||0) < 3 && (SESS.remRounds[e.rem]||0) < REM_CAP){
        extra += addRemediation(e.rem, 5);
      }
    }
  }
  save();
  return {ok, accentOnly, extra, streakOnRule:SESS.ruleStreak[e.rule]||0};
}

const ADMIN_EMAIL = "jurreb@live.nl";
const AKEY = "azulejo:auth";
const TKEY = "azulejo:admintoken";
const AUTH = {email:null, pass:null, admin:false, msg:"", busy:false};
const ADM  = {token:"", users:null, msg:"", busy:false};

function isAdmin(){ return (AUTH.email||"").toLowerCase() === ADMIN_EMAIL; }
function loadAuth(){
  try{
    const r = localStorage.getItem(AKEY);
    if(r){ const a = JSON.parse(r); AUTH.email = a.email || null; AUTH.pass = a.pass || null; }
    ADM.token = localStorage.getItem(TKEY) || "";
  }catch(e){}
  AUTH.admin = isAdmin();
}
function saveAuth(){
  try{
    if(AUTH.email) localStorage.setItem(AKEY, JSON.stringify({email:AUTH.email, pass:AUTH.pass}));
    else localStorage.removeItem(AKEY);
  }catch(e){}
  AUTH.admin = isAdmin();
}
function logout(){
  AUTH.email = null; AUTH.pass = null; AUTH.admin = false;
  try{ localStorage.removeItem(AKEY); }catch(e){}
}

async function api(body){
  const r = await fetch("/api/progress", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body), cache:"no-store"});
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ("status "+r.status));
  return j;
}
function apiUitleg(err){
  const m = String(err && err.message || err);
  if(m==="no_store") return "De database is nog niet gekoppeld. Doe dat in Vercel en deploy opnieuw.";
  if(m==="admin_disabled") return "AZULEJO_ADMIN_TOKEN staat nog niet ingesteld in Vercel.";
  if(m==="bad_token") return "Dat beheerderswachtwoord klopt niet.";
  if(m==="no_email") return "Vul een e-mailadres in.";
  if(m.indexOf("Failed to fetch")>=0 || m.indexOf("NetworkError")>=0)
    return "Geen verbinding. Draait de app op je eigen server?";
  return "Er ging iets mis: "+m;
}

function gateMsg(t){ const m = $("#g-msg"); if(m) m.textContent = t; AUTH.msg = t; }

async function doLogin(){
  if(AUTH.busy) return;
  const e = ($("#g-email")||{}).value, p = ($("#g-pass")||{}).value;
  const email = String(e||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return gateMsg("Vul een geldig e-mailadres in.");
  if(!p || p.length < 4) return gateMsg("Kies een wachtwoord van minstens 4 tekens.");
  AUTH.busy = true; gateMsg("Bezig met inloggen...");
  AUTH.email = email; AUTH.pass = p; saveAuth();
  try{
    const j = await api({action:"load", email:email, pass:p});
    const vorigeEigenaar = S.owner;
    if(j.data){
      /* dit account heeft al voortgang: die telt, wat er lokaal ook stond */
      resetState();
      applyState(j.data);
      S.owner = email;
    } else if(vorigeEigenaar && vorigeEigenaar !== email){
      /* er stond voortgang van een ander account op dit apparaat: schoon beginnen */
      resetState();
      S.owner = email;
      await cloudPush();
    } else {
      /* eerste keer inloggen met wat je lokaal al had opgebouwd: die nemen we mee */
      const hadAl = vorigeEigenaar === email && S.answered > 0;
      S.owner = email;
      await cloudPush();
      CLOUD.msg = hadAl
        ? "Let op: er stond niets online voor dit account. Als je een leeg overzicht ziet, is je wachtwoord waarschijnlijk net anders dan de vorige keer. Log uit en probeer het opnieuw, je voortgang op dit apparaat blijft gewoon staan."
        : "Je voortgang van dit apparaat staat nu online.";
    }
    save();
    AUTH.busy = false;
    try{ localStorage.removeItem("azulejo:skiplogin"); }catch(err){}
    const g = $("#gate"); if(g) g.remove();
    paintTop(); go("learn");
  }catch(err){
    AUTH.busy = false;
    logout();
    gateMsg(apiUitleg(err));
  }
}

async function cloudPull(){
  if(!AUTH.email) return null;
  const j = await api({action:"load", email:AUTH.email, pass:AUTH.pass});

async function cloudPush(){
  if(!AUTH.email) return;
  await api({action:"save", email:AUTH.email, pass:AUTH.pass, data:S,
    meta:{xp:S.xp, answered:S.answered, correct:S.correct, seconds:S.seconds},
    lang:S.lang, newSession: nieuweSessie});

}

async function admCall(op, extra){
  const f = $("#adm-token");
  if(f && f.value) { ADM.token = f.value.trim(); try{ localStorage.setItem(TKEY, ADM.token); }catch(e){} }
  if(!ADM.token){ ADM.msg = "Vul eerst het beheerderswachtwoord in."; return renderAdmin(); }
  ADM.msg = "Bezig..."; renderAdmin();
  try{
    const j = await api(Object.assign({action:"admin", token:ADM.token, op:op}, extra||{}));
    if(op==="list"){ ADM.users = j.users || []; ADM.msg = ADM.users.length+" account(s) opgehaald."; }
    if(op==="delete"){ ADM.msg = "Account verwijderd."; return admCall("list"); }
  }catch(err){ ADM.msg = apiUitleg(err); }
  renderAdmin();
}

/* ============================================================
   11. STAMPEN — een lijst uitschrijven tot hij erin zit
   ============================================================ */
const DRILL = {stage:null, items:[], i:0, need:3, hits:0, tries:0, misses:{}, title:"", key:"", topic:null, checked:false, wasOk:false};

const DRILLSETS = [
  {g:"Woorden", list:()=>Object.keys(THEMES).map(k=>({key:"v:"+k, ico:THEMES[k].ico, t:THEMES[k].nl,
    d:(k==="place"?PLACES.length:byTheme(k).length)+" woorden", topic:(TOPIC[k]?k:null)}))
    .filter(x=>drillItems(x.key).length>0)},
  {g:"Werkwoorden", list:()=>[
    {key:"w:ar",  ico:"🅰️", t:"Rijtjes op -ar",      d:"4 werkwoorden, 24 vormen", topic:"verbsar"},
    {key:"w:er",  ico:"🅱️", t:"Rijtjes op -er / -ir", d:"4 werkwoorden, 24 vormen", topic:"verberir"},
    {key:"w:irr", ico:"⚡", t:"ser, estar, tener, ir, ver", d:"de vijf onregelmatige, 30 vormen", topic:"serestar"},
    {key:"w:ger", ico:"⏱️", t:"De -ando vorm",         d:"12 werkwoorden", topic:"presente"}
  ]},
  {g:"Zinnen", list:()=>Object.keys(PHRASES).map(k=>({key:"z:"+k, ico:PHRASES[k].ico, t:PHRASES[k].nl,
    d:PHRASES[k].groups.reduce((a,g)=>a+g.items.length,0)+" zinnen", topic:k}))},
  {g:"Getallen", list:()=>[{key:"n:all", ico:"🔢", t:"Getallen tot honderd", d:"35 getallen", topic:"numbers"}]}
];

function drillItems(key){
  const [kind, k] = key.split(":");
  if(kind==="v" && k==="place"){
    return PLACES.map(p=>({q:p.nl, a:p.es, accept:[p.es], pron:pronOf(p.es),
      note:p.es.endsWith(" de") ? "vergeet de niet, en de plus el wordt del" : "de enige zonder de"}));
  }
  if(kind==="v"){
    return byTheme(k).map(w=>({
      q:betekenis(w), a:(w.art?w.art+" ":"")+w.es, accept:[(w.art?w.art+" ":"")+w.es, w.es],
      emoji:w.emoji, pron:w.pron || pronOf(w.es),
      note:w.art ? "meervoud: "+w.pl : "beschrijvend woord"
    }));
  }
  if(kind==="ger"){ return []; }
  if(kind==="w"){
    if(k==="ger"){
      return R.pickN(VERBS,12).map(v=>({
        q:(LANG==="en" ? enVorm(v,0)+"ing ("+v.es+")" : "aan het "+v.nl+" ("+v.es+")"), a:gerund(v), accept:[gerund(v),"estoy "+gerund(v)],
        pron:pronOf(gerund(v)), note:v.g==="ar" ? "-ar wordt -ando" : "-"+v.g+" wordt -iendo"
      }));
    }
    if(k==="irr"){
      const VER = ["veo","ves","ve","vemos","veis","ven"];
      const tabs = [["ser",SER,"zijn (vast)"],["estar",ESTAR,"zijn (nu)"],["tener",TENER,"hebben"],
                    ["ir",IR,"gaan"],["ver",VER,"zien"]];
      const out = [];
      tabs.forEach(([naam,vormen,nl])=>{
        vormen.forEach((f,i)=>out.push({
          q:naam+" ("+nl+") — "+P6[i].p+" / "+pronNaam(i), a:f, accept:[f, P6[i].p+" "+f],
          pron:pronOf(f), note:"onregelmatig, dus uit je hoofd"
        }));
      });
      return out;
    }
    const groep = k==="ar" ? ["ar"] : ["er","ir"];
    const vs = R.pickN(VERBS.filter(v=>groep.indexOf(v.g)>=0), 4);
    const out = [];
    vs.forEach(v=>{
      for(let i=0;i<6;i++) out.push({
        q:v.es+" ("+verbBetekenis(v)+") — "+P6[i].p+" / "+pronNaam(i), a:conj(v,i), accept:[conj(v,i), P6[i].p+" "+conj(v,i)],
        pron:pronOf(conj(v,i)), note:"stam "+v.es.slice(0,-2)+" plus -"+ENDINGS[v.g][i]
      });
    });
    return out;
  }
  if(kind==="z"){
    const out = [];
    PHRASES[k].groups.forEach(g=>g.items.forEach(it=>out.push({
      q:it[1], a:it[0], accept:[it[0], it[0].replace(/[¿?¡!.,]/g,"").trim()],
      pron:pronOf(it[0]), note:it[2]||""
    })));
    return out;
  }
  if(kind==="n"){
    return NUMS.map(n=>({q:"het getal "+n[0], a:n[1], accept:[n[1]], pron:pronOf(n[1]), note:""}));
  }
  return [];
}

function startDrill(key, title, topic){
  DRILL.key = key; DRILL.title = title; DRILL.topic = topic || null;
  DRILL.items = R.shuffle(drillItems(key)).map(x=>Object.assign({}, x, {hit:0}));
  DRILL.i = 0; DRILL.hits = 0; DRILL.tries = 0; DRILL.misses = {}; DRILL.checked = false;
  DRILL.stage = "list";
  renderDrill();
}

function drillTotal(){ return DRILL.items.length * DRILL.need; }
function drillDone(){ return DRILL.items.reduce((a,x)=>a+Math.min(x.hit, DRILL.need), 0); }

function renderDrill(){
  const box = $("#sc-practice");
  if(DRILL.stage==="pick") return renderDrillPick();
  if(DRILL.stage==="list") return renderDrillList();
  if(DRILL.stage==="run")  return renderDrillRun();
  if(DRILL.stage==="done") return renderDrillDone();
}

function renderDrillRun(){
  const it = DRILL.items[DRILL.i];
  if(!it){ DRILL.stage="done"; return renderDrill(); }
  const pct = Math.round(drillDone()/drillTotal()*100);
  let h = '<div class="runner stack-20">';
  h += '<div class="run-head"><button class="icon-btn" data-drillexit="1" aria-label="Stoppen">✕</button>'
    + '<div style="flex:1"><div class="bar"><div class="bar-fill verde" style="width:'+pct+'%"></div></div></div>'
    + '<div class="streak-pill mono">'+drillDone()+' / '+drillTotal()+'</div></div>';
  h += '<div class="row"><span class="q-kind">Uitschrijven</span><span class="tiny dim">'+DRILL.title+'</span>'
    + '<span class="spacer"></span><span class="tiny dim mono">woord '+(DRILL.i+1)+' van '+DRILL.items.length+'</span></div>';
  h += '<div class="stack-14"><div class="q-text">Schrijf dit in het Spaans</div>';
  h += '<div class="q-sent">'+(it.emoji?'<div style="font-size:46px;line-height:1;margin-bottom:6px">'+it.emoji+'</div>':'')
    + '<div>'+it.q+'</div></div>';
  h += '<div class="row" style="gap:6px">'
    + Array.from({length:DRILL.need}, (_,n)=>'<span class="tag '+(n<it.hit?"tag-verde":"tag-line")+'">'+(n<it.hit?"✓":"○")+'</span>').join("")
    + '<span class="tiny dim">'+it.hit+' van '+DRILL.need+' goed</span></div>';

  if(!DRILL.checked){
    h += '<input class="inp" id="dans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ het Spaanse woord">'
      + '<div class="accents">'+["á","é","í","ó","ú","ñ","¿","¡"].map(c=>'<button data-dacc="'+c+'">'+c+'</button>').join("")+'</div>'
      + '<button class="btn btn-primary btn-wide" data-drillcheck="1">Controleer</button>';
  } else {
    h += '<div class="fb '+(DRILL.wasOk?"ok":"no")+'"><div class="fb-top">'+(DRILL.wasOk?"✅ Goed":"❌ Niet goed")+'</div>'
      + '<div class="fb-body"><div class="fb-blk"><div class="fb-lab">'+T("Het juiste antwoord")+'</div>'
      + '<div class="row"><div class="fb-txt"><b>'+it.a+'</b></div>'+spk(it.a)+'</div>'
      + '<div class="vpron">'+(it.pron||"")+'</div></div>'
      + (it.note?'<div class="fb-blk"><div class="fb-lab">Onthoud</div><div class="fb-txt">'+it.note+'</div></div>':'')
      + (!DRILL.wasOk?'<div class="fb-blk"><div class="fb-txt tiny">De teller voor dit woord begint opnieuw. Schrijf hem nog een keer.</div></div>':'')
      + '<button class="btn '+(DRILL.wasOk?"btn-primary":"btn-saffron")+' btn-wide" data-drillnext="1">Verder</button></div></div>';
  }
  h += '</div></div>';
  $("#sc-practice").innerHTML = h;
  const inp = $("#dans"); if(inp) setTimeout(()=>inp.focus(), 60);
}

function drillCheck(){
  const it = DRILL.items[DRILL.i]; if(!it || DRILL.checked) return;
  const inp = $("#dans"); const given = inp ? inp.value.trim() : "";
  const ok = (it.accept||[it.a]).some(a=>sameLoose(a, given));
  DRILL.checked = true; DRILL.wasOk = ok; DRILL.tries++;
  if(ok){
    it.hit++;
    addXp(1);
    if(it.hit >= DRILL.need){
      addXp(3);
      if(DRILL.topic && S.t[DRILL.topic]) bump(DRILL.topic, true);
    }
  } else {
    it.hit = 0;
    DRILL.misses[it.a] = (DRILL.misses[it.a]||0)+1;
    if(DRILL.topic && S.t[DRILL.topic]) bump(DRILL.topic, false);
  }
  paintTop(); save();
  renderDrillRun();
}

function drillNext(){
  const it = DRILL.items[DRILL.i];
  DRILL.checked = false;
  if(it && it.hit >= DRILL.need){
    /* dit woord zit erin, door naar het volgende dat nog niet af is */
    let n = DRILL.i;
    for(let k=1;k<=DRILL.items.length;k++){
      const j = (DRILL.i + k) % DRILL.items.length;
      if(DRILL.items[j].hit < DRILL.need){ n = j; break; }
      if(k===DRILL.items.length){ DRILL.stage = "done"; return renderDrill(); }
    }
    if(DRILL.items.every(x=>x.hit>=DRILL.need)){ DRILL.stage="done"; return renderDrill(); }
    DRILL.i = n;
  }
  renderDrillRun();
}

function renderDrillDone(){
  const hard = Object.keys(DRILL.misses).sort((a,b)=>DRILL.misses[b]-DRILL.misses[a]).slice(0,6);
  const perfect = hard.length===0;
  shards(perfect?60:30);
  addXp(20);
  save();
  let h = '<div class="runner stack-20 center">'
    + '<div class="card pad stack-14"><div class="h-xl">'+(perfect?"Foutloos!":"Lijst uitgeschreven")+'</div>'
    + '<div class="stat-n" style="font-size:44px;color:var(--verde)">'+DRILL.items.length+'</div>'
    + '<div class="prose" style="font-size:16px">'+DRILL.items.length+' stuks, elk '+DRILL.need+' keer goed geschreven. '
    + (perfect ? "Zonder één fout. Dat is knap." : "Je typte in totaal "+DRILL.tries+" keer.")+'</div></div>';
  if(hard.length){
    h += '<div class="card pad" style="text-align:left"><div class="eyebrow" style="margin-bottom:8px">Deze kostten de meeste moeite</div><div class="stack-6">'
      + hard.map(a=>'<div class="row"><span class="es" style="font-weight:700">'+a+'</span>'+spk(a)
        + '<span class="spacer"></span><span class="tiny dim">'+DRILL.misses[a]+'x fout</span></div>').join("")
      + '</div></div>';
  }
  h += '<div class="row" style="justify-content:center"><button class="btn btn-primary" data-drillagain="1">Nog een keer</button>'
    + '<button class="btn" data-drillpick="1">Andere lijst</button>'
    + '<button class="btn btn-ghost" data-drillexit="1">Klaar</button></div></div>';
  $("#sc-practice").innerHTML = h;
}

  if(DRILL.stage) return renderDrill();
  const open = openTopics(), weak = weakTopics().slice(0,3);
  let h = '<div class="stack-20">';
  h += '<div><div class="eyebrow">Oefenen</div><h1 class="h-xl">Wat wil je doen?</h1></div>';
  h += '<div class="pickgrid">';

    + (S.mixedBest?' · beste '+S.mixedBest+'%':'') + '</div></button>';
  h += '<button class="pick-card" data-mode="master"><div class="pick-ico">🏆</div><div class="pick-t">Meesterproef</div><div class="pick-d">100 vragen'

    + (S.timedBest?' · record '+S.timedBest:'') + '</div></button>';
  h += '<button class="pick-card" data-drillpick="1"><div class="pick-ico">✍️</div><div class="pick-t">Stampen</div>'
    + '<div class="pick-d">Een lijst net zo lang uitschrijven tot hij erin zit</div></button>';

      + '<div class="pick-d">'+Math.round(S.t[t.id].strength)+'% sterk</div></button>';
