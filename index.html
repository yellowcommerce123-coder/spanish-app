<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azulejo — Spaans leren, tegel voor tegel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F8; --bg2:#E2E9F5; --surface:#FFFFFF; --surface2:#F6F9FD;
  --ink:#101F35; --ink2:#3D4F6B; --ink3:#6B7C96;
  --line:#D6E0EF; --line2:#C3D2E8;
  --azul:#1D4FA8; --azul2:#2E6BD4; --azulsoft:#DCE7FA;
  --saffron:#C77E12; --saffron2:#E39B2B; --saffronsoft:#FBEBCF;
  --verde:#0F7A55; --verdesoft:#D6F0E3;
  --granada:#B72B41; --granadasoft:#FBDCE1;
  --shadow:0 1px 2px rgba(16,31,53,.06), 0 10px 26px -14px rgba(16,31,53,.28);
  --shadow-lift:0 2px 4px rgba(16,31,53,.08), 0 18px 40px -18px rgba(16,31,53,.34);
  --r:20px; --r-sm:12px; --r-pill:999px;
  --disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --prose:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html[data-theme="dark"]{
  --bg:#0A1421; --bg2:#0E1C2E; --surface:#13233A; --surface2:#1A2C46;
  --ink:#E9EFF8; --ink2:#B2C2D9; --ink3:#8497B2;
  --line:#24374E; --line2:#2E4462;
  --azul:#7DAEFF; --azul2:#9CC2FF; --azulsoft:#1A3057;
  --saffron:#F0B15E; --saffron2:#F7C67F; --saffronsoft:#3A2C13;
  --verde:#4DC48D; --verdesoft:#0F3328;
  --granada:#F4808F; --granadasoft:#3A1C24;
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 22px 46px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--disp);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--azul2);outline-offset:2px;border-radius:6px}

/* ---------- azulejo pattern ---------- */
.azulejo{
  background-color:var(--azulsoft);
  background-image:
    radial-gradient(circle at 0% 0%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 100% 0%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 0% 100%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 100% 100%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 50% 50%, var(--saffron2) 9%, transparent 10%),
    radial-gradient(circle at 50% 0%, var(--azul2) 7%, transparent 8%),
    radial-gradient(circle at 0% 50%, var(--azul2) 7%, transparent 8%);
  background-size:30px 30px;
}

/* ---------- layout ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 20px 132px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.brand-txt{min-width:0}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;white-space:nowrap;
}
.chip-num{font-family:var(--mono);font-weight:500}
.chip.saffron{background:var(--saffronsoft);border-color:transparent;color:var(--saffron)}
.icon-btn{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;
  transition:transform .16s, background .16s;
}
.icon-btn:hover{transform:translateY(-1px);background:var(--surface2)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px max(14px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-bottom));
}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav-btn{
  padding:8px 2px 6px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink3);
  transition:color .16s, background .16s;
}
.nav-btn span{font-size:19px;line-height:1;filter:grayscale(1) opacity(.7);transition:filter .2s}
.nav-btn.on{color:var(--azul);background:var(--azulsoft)}
.nav-btn.on span{filter:none}

/* ---------- generic bits ---------- */
.screen{display:none;padding-top:22px;animation:fadein .28s ease both}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.h-xl{font-size:clamp(28px,5.2vw,40px);font-weight:800;letter-spacing:-.035em}
.h-lg{font-size:clamp(21px,3.4vw,26px);font-weight:800;letter-spacing:-.03em}
.h-md{font-size:17px;font-weight:700}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.mono{font-family:var(--mono)}
.center{text-align:center}
.stack-6>*+*{margin-top:6px}
.stack-10>*+*{margin-top:10px}
.stack-14>*+*{margin-top:14px}
.stack-20>*+*{margin-top:20px}
.stack-28>*+*{margin-top:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.pad-sm{padding:15px}
.hr{height:1px;background:var(--line);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:var(--r-pill);
  font-weight:700;letter-spacing:-.01em;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);
  transition:transform .14s, box-shadow .14s, background .14s;
}
.btn:hover{transform:translateY(-1.5px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--azul);border-color:transparent;color:#fff}
html[data-theme="dark"] .btn-primary{color:#08131f}
.btn-primary:hover{background:var(--azul2)}
.btn-saffron{background:var(--saffron);border-color:transparent;color:#fff}
html[data-theme="dark"] .btn-saffron{color:#2a1c05}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:9px 16px;font-size:13.5px}
.btn-wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.bar{height:9px;border-radius:var(--r-pill);background:var(--bg2);overflow:hidden}
html[data-theme="dark"] .bar{background:#0A1524}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--azul);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-fill.verde{background:var(--verde)}
.bar-fill.saffron{background:var(--saffron)}

.tag{display:inline-block;padding:3px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;letter-spacing:.01em}
.tag-m{background:var(--azulsoft);color:var(--azul)}
.tag-f{background:var(--granadasoft);color:var(--granada)}
.tag-verde{background:var(--verdesoft);color:var(--verde)}
.tag-saffron{background:var(--saffronsoft);color:var(--saffron)}
.tag-line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink3)}

.speak{
  width:28px;height:28px;flex:none;border-radius:8px;
  background:var(--azulsoft);color:var(--azul);
  display:inline-grid;place-items:center;font-size:13px;vertical-align:middle;
  transition:transform .14s;
}
.speak:hover{transform:scale(1.08)}
.speak.playing{animation:pulse .7s ease infinite}
@keyframes pulse{50%{transform:scale(1.14)}}

/* ---------- tile wall ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:13px}
.tile{
  position:relative;overflow:hidden;text-align:left;
  border-radius:16px;padding:14px;min-height:146px;
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tile-pat{position:absolute;inset:0;opacity:.16;transition:opacity .3s}
.tile-body{position:relative;display:flex;flex-direction:column;gap:5px;height:100%}
.tile-ico{font-size:25px;line-height:1}
.tile-name{font-size:15.5px;font-weight:800;letter-spacing:-.025em}
.tile-meta{font-size:11.5px;color:var(--ink3);font-weight:600}
.tile-num{
  position:absolute;top:12px;right:13px;
  font-family:var(--mono);font-size:11px;color:var(--ink3);
}
.tile.glazed .tile-pat{opacity:.42}
.tile.glazed::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg, transparent 32%, rgba(255,255,255,.5) 47%, rgba(255,255,255,.06) 56%, transparent 70%);
}
html[data-theme="dark"] .tile.glazed::after{background:linear-gradient(118deg, transparent 34%, rgba(255,255,255,.16) 48%, transparent 66%)}
.tile.mastered{border-color:var(--saffron2);box-shadow:0 0 0 2px var(--saffronsoft), var(--shadow)}
.tile.locked{opacity:.5;filter:grayscale(.85)}
.tile-lock{position:absolute;top:11px;right:12px;font-size:13px}
.tile-bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:auto}
html[data-theme="dark"] .tile-bar{background:#0A1524}
.tile-bar i{display:block;height:100%;background:var(--verde);border-radius:99px}
@keyframes glaze{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.glaze-sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);animation:glaze .9s ease}

/* ---------- lesson ---------- */
.prose{font-family:var(--prose);font-size:17.5px;line-height:1.68;color:var(--ink2)}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.lead{font-family:var(--prose);font-size:19.5px;line-height:1.6;color:var(--ink)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.sec-h .num{font-family:var(--mono);font-size:12px;color:var(--azul);flex:none}
.note{border-left:3px solid var(--saffron2);background:var(--saffronsoft);padding:13px 15px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.note-verde{border-left-color:var(--verde);background:var(--verdesoft)}
.note-granada{border-left-color:var(--granada);background:var(--granadasoft)}
.note-azul{border-left-color:var(--azul);background:var(--azulsoft)}

/* the 7-step example chain */
.ex{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.ex-top{padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.ex-es{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--azul)}
.ex-step{padding:14px 18px;border-top:1px solid var(--line)}
.ex-step:first-child{border-top:none}
.ex-lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.arrow{display:block;text-align:center;color:var(--line2);font-size:15px;line-height:1;padding:2px 0}
.w2w{display:flex;flex-wrap:wrap;gap:7px}
.w2w-i{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:13.5px}
.w2w-es{font-weight:700}
.w2w-eq{color:var(--ink3);font-family:var(--mono);font-size:11px}
.ex-nl{font-family:var(--prose);font-size:17px;color:var(--ink)}
.ex-p{font-family:var(--prose);font-size:16px;line-height:1.62;color:var(--ink2)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 12px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl .es{font-weight:700;color:var(--azul)}
.tbl .pr{font-family:var(--mono);font-size:12.5px;color:var(--ink3)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}

/* ---------- exercise runner ---------- */
.runner{max-width:640px;margin:0 auto}
.run-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.q-kind{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--azul)}
.q-text{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.q-sent{
  font-family:var(--prose);font-size:24px;line-height:1.45;color:var(--ink);
  padding:18px;border-radius:var(--r-sm);background:var(--surface2);border:1px dashed var(--line2);
  text-align:center;
}
.q-blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--azul);color:var(--azul);font-weight:700}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  text-align:left;padding:14px 16px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--line);
  font-size:16px;font-weight:600;
  display:flex;align-items:center;gap:11px;
  transition:transform .12s, border-color .14s, background .14s;
}
.opt:hover{transform:translateY(-1.5px);border-color:var(--azul)}
.opt-key{
  width:24px;height:24px;flex:none;border-radius:7px;background:var(--bg2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink3);
}
html[data-theme="dark"] .opt-key{background:#0A1524}
.opt.good{border-color:var(--verde);background:var(--verdesoft)}
.opt.good .opt-key{background:var(--verde);color:#fff}
.opt.bad{border-color:var(--granada);background:var(--granadasoft)}
.opt.bad .opt-key{background:var(--granada);color:#fff}
.opt.lock{pointer-events:none}
.opt.fade{opacity:.5}

.inp{
  width:100%;padding:15px 17px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--line2);
  font-size:18px;font-weight:600;outline:none;
}
.inp:focus{border-color:var(--azul)}
.accents{display:flex;flex-wrap:wrap;gap:5px}
.accents button{
  min-width:34px;padding:6px 8px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--line);
  font-size:15px;font-weight:600;
}
.accents button:hover{background:var(--azulsoft);border-color:var(--azul)}

.build-slot{
  min-height:60px;padding:11px;border-radius:14px;
  background:var(--surface2);border:1.5px dashed var(--line2);
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
}
.build-pool{display:flex;flex-wrap:wrap;gap:7px}
.word{
  padding:9px 14px;border-radius:var(--r-pill);
  background:var(--surface);border:1.5px solid var(--line2);
  font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line2);
  transition:transform .12s;
}
.word:hover{transform:translateY(-1.5px)}
.word.used{opacity:.28;pointer-events:none}
.build-hint{font-size:12.5px;color:var(--ink3)}

.fb{border-radius:var(--r);overflow:hidden;animation:pop .3s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.fb-top{padding:14px 18px;display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}
.fb.ok .fb-top{background:var(--verde);color:#fff}
.fb.no .fb-top{background:var(--granada);color:#fff}
.fb-body{background:var(--surface);border:1px solid var(--line);border-top:none;padding:18px;display:grid;gap:14px}
.fb-blk{display:grid;gap:4px}
.fb-lab{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.fb-txt{font-family:var(--prose);font-size:16px;line-height:1.6;color:var(--ink2)}
.fb-txt b{color:var(--ink);font-weight:600}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .42s}

.streak-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--saffron);font-weight:500}

/* celebration: azulejo shards */
.shards{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.shard{position:absolute;width:11px;height:11px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{
  0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--dx),104vh,0) rotate(var(--rot));opacity:.15}
}
.badge-pop{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;
  padding:22px 30px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-lift);
  border:1px solid var(--line);text-align:center;animation:badge .5s cubic-bezier(.2,.8,.3,1.3) both;
}
@keyframes badge{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ---------- words ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter{padding:8px 15px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:700;transition:background .14s}
.filter.on{background:var(--azul);border-color:transparent;color:#fff}
html[data-theme="dark"] .filter.on{color:#08131f}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.vtop{display:flex;align-items:flex-start;gap:10px}
.vemoji{font-size:27px;line-height:1;flex:none}
.ves{font-size:18px;font-weight:800;letter-spacing:-.025em}
.ves .art{color:var(--azul)}
.vnl{font-family:var(--prose);font-size:16px;color:var(--ink)}
.vpron{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.vex{font-family:var(--prose);font-size:14.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:11px}
.vex i{color:var(--azul);font-style:normal;font-weight:600}

/* ---------- stats ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat-n{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.stat-l{font-size:12px;font-weight:700;color:var(--ink3);margin-top:3px}
.blist{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:1fr;gap:5px}
.brow-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:700}
.brow-pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:500}

/* ---------- games ---------- */
.flash{
  perspective:1400px;max-width:440px;margin:0 auto;
}
.flash-in{
  position:relative;height:250px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer;
}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;gap:8px;
}
.flash-back{transform:rotateY(180deg)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{
  aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:6px;
  font-size:13.5px;font-weight:700;text-align:center;line-height:1.2;
  transition:transform .16s, background .16s;
}
.mcard.hidden-face{color:transparent}
.mcard.hidden-face::after{content:"";position:absolute}
.mcard.pick{border-color:var(--azul);background:var(--azulsoft)}
.mcard.done{border-color:var(--verde);background:var(--verdesoft);opacity:.55;pointer-events:none}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.pick-card{
  text-align:left;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:4px;
  transition:transform .16s, box-shadow .16s;
}
.pick-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.pick-ico{font-size:22px}
.pick-t{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.pick-d{font-size:12.5px;color:var(--ink3);font-weight:600}

.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.gl{border-bottom:1.5px dotted var(--line2);cursor:help;transition:color .12s,border-color .12s}
.gl:hover{border-bottom-color:var(--azul);color:var(--azul)}
.tip{position:fixed;z-index:140;max-width:270px;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow-lift);padding:13px 15px;pointer-events:none;
  opacity:0;transform:translateY(4px);transition:opacity .13s ease,transform .13s ease}
.tip.on{opacity:1;transform:none}
.tip-emo{font-size:24px;line-height:1;margin-bottom:5px}
.tip-es{font-size:16.5px;font-weight:800;letter-spacing:-.02em;color:var(--azul)}
.tip-nl{font-family:var(--prose);font-size:15.5px;color:var(--ink);margin-top:2px}
.tip-pr{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:4px}
.tip-ex{font-size:12px;color:var(--ink3);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.hintbar{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 13px}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,20,33,.55);backdrop-filter:blur(5px);
  display:grid;place-items:center;padding:20px;animation:fadein .2s ease both}
.modal{max-width:430px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lift);padding:24px;animation:badge .35s cubic-bezier(.2,.8,.3,1.2) both}
.gate{position:fixed;inset:0;z-index:130;background:var(--bg);overflow:auto;padding:26px 20px}
.gate-in{max-width:420px;margin:5vh auto}
.acct{display:flex;align-items:center;gap:9px;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.acct-av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--azul);color:#fff;font-weight:800;font-size:14px}
html[data-theme="dark"] .acct-av{color:#08131f}
.tile.locked{opacity:.55;filter:grayscale(.8);cursor:pointer}
.tile.locked:hover{opacity:.75;transform:translateY(-3px)}

@media (max-width:560px){
  .app{padding:0 14px 128px}

  .mgrid{grid-template-columns:repeat(3,1fr)}
  .match-cols{gap:7px}
  .pad{padding:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- kleine hulpjes ---------- */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
/* bijvoeglijk naamwoord aanpassen aan geslacht en aantal */
function adjForm(w,gender,count){
  let base = w.es;
  const invariable = ["azul","verde","gris","marrón","rosa","naranja","grande","fácil","difícil",
    "joven","fuerte","caliente","triste","interesante","inteligente"];
  if(invariable.includes(base)){
    if(count>1){
      if(base==="azul") return "azules";
      if(base==="marrón") return "marrones";
      if(base==="gris") return "grises";
      if(base==="fácil") return "fáciles";
      if(base==="difícil") return "difíciles";
      if(base==="joven") return "jóvenes";
      return base+"s";
    }
    return base;
  }
  if(base.endsWith("o")) base = base.slice(0,-1) + (gender==="f" ? "a" : "o");
  return count>1 ? base+"s" : base;
}

LESSONS.verberir = {
lead:"Werkwoorden op <b>-er</b> en <b>-ir</b> werken precies zoals -ar, maar met andere staartjes. En het beste nieuws: -er en -ir zijn bijna hetzelfde.",
why:"Met -ar, -er en -ir heb je alle drie de groepen gehad. Daarna kun je elk regelmatig Spaans werkwoord in de tegenwoordige tijd zetten.",
secs:[
{h:"De staartjes van -er",p:[
"comer (eten) wordt: com<b>o</b>, com<b>es</b>, com<b>e</b>, com<b>emos</b>, com<b>éis</b>, com<b>en</b>.",
"Dus: <b>-o, -es, -e, -emos, -éis, -en</b>.",
"Vergelijk met -ar: daar stond een a waar hier een e staat. Dat is het enige verschil."]},
{h:"De staartjes van -ir",p:[
"vivir (wonen) wordt: viv<b>o</b>, viv<b>es</b>, viv<b>e</b>, viv<b>imos</b>, viv<b>ís</b>, viv<b>en</b>.",
"Dus: <b>-o, -es, -e, -imos, -ís, -en</b>.",
"Kijk goed: vier van de zes zijn precies gelijk aan -er. Alleen bij wij en jullie is er een i in plaats van een e.",
"Je leert dus eigenlijk maar twee nieuwe vormen."]},
{h:"Alle drie naast elkaar",p:[
"Bij <b>yo</b> is het altijd -o. Bij alle drie de groepen. Altijd.",
"Bij <b>tú</b>: -as bij ar, -es bij er en ir.",
"Bij <b>nosotros</b>: -amos, -emos, -imos. De klinker van de groep komt terug.",
"Het patroon is dus: de klinker van het werkwoord zit in het staartje."]},
{h:"Wat je nu al kunt",p:[
"Como pan. (Ik eet brood.) Bebes agua. (Jij drinkt water.) Vivimos en Holanda. (Wij wonen in Nederland.)",
"Leemos un libro. (Wij lezen een boek.) Escriben una carta. (Zij schrijven een brief.)",
"Met deze drie groepen en de losse woordjes ser, estar en tener kun je al honderden zinnen maken."]}
],

LESSONS.presente = {
lead:"Je kunt nu vervoegen. Maar wanneer gebruik je die tegenwoordige tijd eigenlijk? Het antwoord is fijn: <b>veel vaker dan je denkt</b>. Eén Spaanse vorm dekt twee Nederlandse zinnen.",
why:"Nederlandstaligen bouwen hier bijna altijd te ingewikkelde zinnen. Ze zoeken naar een vertaling voor <i>aan het</i> en komen uit bij estoy cantando, terwijl canto genoeg is. Als je dit hoofdstuk snapt, worden je zinnen korter en meteen een stuk beter.",
secs:[
{h:"Eén Spaanse vorm, twee Nederlandse zinnen",p:[
"<b>Canto.</b> Dat betekent <b>ik zing</b>.",
"Maar het betekent óók <b>ik ben aan het zingen</b>.",
"Spaans maakt dat onderscheid niet. Eén vorm doet allebei.",
"Dus als je in het Nederlands <i>aan het</i> zegt, hoef je in het Spaans meestal niets extra's te doen. Gewoon de normale vorm."]},
{h:"Wanneer dan wel estoy cantando?",p:[
"Er bestaat wel een vorm voor <i>aan het</i>: <b>estar</b> plus het werkwoord met -ando of -iendo. Estoy cantando.",
"Maar die gebruik je alleen als je nadruk wilt leggen op <b>precies nu, op dit moment</b>.",
"Iemand belt en vraagt wat je doet: <b>Estoy comiendo.</b> (Ik ben nu aan het eten.) Dat is goed gebruikt.",
"Vertel je dat je elke dag om twee uur eet: <b>Como a las dos.</b> Niet estoy comiendo, want het gaat niet over dit moment.",
"Vuistregel: als je het woord <b>nu</b> erbij kunt zetten, mag estar plus -ando. Anders gewoon de normale vorm."]},
{h:"Hoe je de -ando vorm maakt",p:[
"Neem de stam en plak er een staartje aan.",
"Bij <b>-ar</b> werkwoorden: <b>-ando</b>. cantar wordt cant<b>ando</b>.",
"Bij <b>-er</b> en <b>-ir</b> werkwoorden: <b>-iendo</b>. comer wordt com<b>iendo</b>, vivir wordt viv<b>iendo</b>.",
"Twee groepen, twee staartjes. Simpeler dan het vervoegen zelf."]},
{h:"Gewoontes: wat je altijd doet",p:[
"De normale tegenwoordige tijd gebruik je ook voor dingen die je regelmatig doet.",
"<b>Canto los domingos.</b> = Ik zing op zondag. Let op dat kleine <b>los</b>: dat maakt er <i>elke zondag</i> van.",
"Zonder los zou je één specifieke zondag bedoelen. Met los bedoel je alle zondagen.",
"Andere woorden die bij gewoontes horen: <b>todos los días</b> (elke dag), <b>siempre</b> (altijd), <b>nunca</b> (nooit), <b>a veces</b> (soms), <b>normalmente</b> (meestal)."]},
{h:"En zelfs voor morgen",p:[
"Spaans gebruikt de tegenwoordige tijd ook voor iets wat binnenkort gebeurt, als het vaststaat.",
"<b>Mañana trabajo.</b> = Morgen werk ik.",
"<b>El lunes viajo a Madrid.</b> = Maandag reis ik naar Madrid.",
"Nederlands doet dit ook: wij zeggen ook <i>morgen werk ik</i> en niet per se <i>morgen zal ik werken</i>. Dus dit voelt meteen goed."]},
{h:"Vragen stellen: twee volgordes mogen allebei",p:[
"Je kunt de persoon vóór of achter het werkwoord zetten. Allebei is goed Spaans.",
"<b>¿Cantas tú los domingos?</b> en <b>¿Tú cantas los domingos?</b> betekenen hetzelfde.",
"Sterker nog: je mag het woordje tú gewoon weglaten. <b>¿Cantas los domingos?</b> is het meest gebruikt.",
"Het enige wat je écht nodig hebt is het omgekeerde vraagteken aan het begin en je stem omhoog aan het eind.",
"Wat <b>niet</b> mag: het werkwoord in de basisvorm laten staan. ¿Tú cantar? bestaat niet."]}
],

LESSONS.usted = {
lead:"Spaans heeft twee manieren om <b>u</b> of <b>jij</b> te zeggen. <b>tú</b> als je iemand tutoyeert, <b>usted</b> als je beleefd wilt zijn. En in het meervoud: <b>vosotros</b> en <b>ustedes</b>.",
why:"Je gebruikt dit elke dag zonder erbij na te denken, want in een restaurant spreek je de ober anders aan dan een vriend aan de bar. Als je het verschil kent, klink je meteen op je gemak in plaats van als een toerist die een zinnetje opzegt.",
secs:[
{h:"De grote truc: usted leent de hij-vorm",p:[
"Dit is het enige wat je echt moet onthouden, en het scheelt je een heel rijtje.",
"<b>usted</b> gebruikt dezelfde werkwoordvorm als <b>él</b> en <b>ella</b>.",
"Dus: él habl<b>a</b> → usted habl<b>a</b>. Niet usted hablas.",
"<b>ustedes</b> gebruikt dezelfde vorm als <b>ellos</b>: ellos habl<b>an</b> → ustedes habl<b>an</b>.",
"Je hoeft dus geen nieuwe vervoegingen te leren. Je hergebruikt wat je al kent."]},
{h:"Waarom leent usted de hij-vorm?",p:[

"Je zegt dus eigenlijk: <i>spreekt uwe genade Spaans?</i> Daarom ¿Habla usted español?"]},

{h:"Zo klinkt het in het echt",p:[

],

   3. GENERATOR — kern + hulpjes
   Elke oefening wordt vers gemaakt. Niets is vastgezet.
   ============================================================ */
const R = {
  int:n => Math.floor(Math.random()*n),
  pick(a){ return a[Math.floor(Math.random()*a.length)]; },
  shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; },
  pickN(a,n){ return R.shuffle(a).slice(0,n); },
  chance(p){ return Math.random()<p; }
};

function norm(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:]/g,"")
    .replace(/\s+/g," ").trim();
}
function sameLoose(a,b){ return norm(a)===norm(b); }

/* uitleg waarom een woord mannelijk of vrouwelijk is */
const GEX = {
  "agua":"agua is vrouwelijk, maar krijgt el omdat la agua lelijk klinkt met twee a-klanken achter elkaar. Het beschrijvende woord blijft wel vrouwelijk.",
  "problema":"problema eindigt op -a maar is mannelijk. Woorden op -ma zijn dat vaak. Uitzondering om te onthouden.",
  "día":"día eindigt op -a maar is mannelijk. Een van de bekendste uitzonderingen.",
  "mapa":"mapa eindigt op -a maar is mannelijk. Onthoud el mapa samen met el día.",
  "mano":"mano eindigt op -o maar is vrouwelijk. La mano is de uitzondering die je moet kennen.",
  "sofá":"sofá eindigt op -á maar is mannelijk. Woorden met de klemtoon op de laatste a zijn vaak mannelijk."
};
function genderReason(w){
  if(GEX[w.es]) return GEX[w.es];
  const e = w.es;
  if(e.endsWith("ción")||e.endsWith("sión")) return e+" eindigt op -ción, en die woorden zijn altijd vrouwelijk.";
  if(e.endsWith("dad")||e.endsWith("tad")) return e+" eindigt op -dad, en die woorden zijn altijd vrouwelijk.";
  if(e.endsWith("aje")) return e+" eindigt op -aje, en die woorden zijn mannelijk.";
  if(e.endsWith("o")) return e+" eindigt op een -o. Woorden op -o zijn mannelijk.";
  if(e.endsWith("a")) return e+" eindigt op een -a. Woorden op -a zijn vrouwelijk.";
  return e+" eindigt niet op -o of -a, dus je kunt het niet zien aan het woord. Zulke woorden leer je altijd met het lidwoord erbij: "+w.art+" "+e+".";
}
function pluralReason(w){
  const e=w.es;
  if(e.endsWith("z")) return e+" eindigt op een -z. Dan wordt de z een c en komt er -es achter: "+w.pl+".";
  if(/[aeiouáéíóú]$/.test(e)) return e+" eindigt op een klinker. Dan komt er alleen een -s achter: "+w.pl+".";
  return e+" eindigt op een consonant. Dan komt er -es achter: "+w.pl+".";
}
const G_NL = {m:"mannelijk", f:"vrouwelijk"};

/* het bouwen van oefeningen */
function ex(o){
  if(!o.kind) o.kind = ({mc:"Meerkeuze",input:"Vul in",build:"Zin bouwen",order:"Zet in de juiste orde",
    listen:"Luisteren",picture:"Wat zie je?",match:"Woorden koppelen"})[o.type] || "Oefening";
  if(o.type==="input" && !o.accept) o.accept=[o.answer];
  if(o.options){
    const gezien = {}; const uniek = [];
    o.options.map(String).forEach(x=>{ const k=x.toLowerCase().trim(); if(!gezien[k]){ gezien[k]=1; uniek.push(x); } });
    o.options = R.shuffle(uniek);
  }
  return o;
}

/* register: GEN[topic] = [functies], elke functie heeft .rule */
const GEN = {};
function reg(topic, rule, fn){
  fn.rule = topic+"."+rule;
  (GEN[topic] = GEN[topic] || []).push(fn);
}
function makeExercise(topic, rule){
  const pool = GEN[topic] || [];
  if(!pool.length) return null;
  const list = rule ? pool.filter(f=>f.rule===rule) : pool;
  const fn = R.pick(list.length ? list : pool);
  const e = fn();
  e.topic = topic; e.rule = fn.rule;
  return ex(e);
}

/* herschrijven: van tener naar een bezitswoord */
const POSSP = [
  {p:"Yo",v:"tengo",b:"mi",nl:"ik"},{p:"Tú",v:"tienes",b:"tu",nl:"jij"},
  {p:"Ella",v:"tiene",b:"su",nl:"zij"},{p:"Él",v:"tiene",b:"su",nl:"hij"},
  {p:"Nosotros",v:"tenemos",b:"nuestro",nl:"wij"},{p:"Ellos",v:"tienen",b:"su",nl:"zij (meervoud)"}
];
function possForm(base, w, plural){
  if(base==="nuestro") return "nuestr"+(w.g==="f"?"a":"o")+(plural?"s":"");
  return base+(plural?"s":"");
}
reg("possessives","herschrijven",()=>{
  const pp = R.pick(POSSP), w = R.pick(NOUNS), plural = R.chance(.45);
  const have = pp.p+" "+pp.v+" "+(plural ? "dos "+w.pl : indefSing(w)+" "+w.es)+".";
  const form = possForm(pp.b, w, plural);
  const out  = (plural?"Son ":"Es ")+form+" "+(plural?w.pl:w.es)+".";
  return {type:"input", prompt:"Schrijf deze zin om met een bezitswoord.", sentence:have, showEs:out,
    answer:out, accept:[out, out.replace(".",""), form+" "+(plural?w.pl:w.es)], word:w.key,
    why:"Bij "+pp.nl+" hoort <b>"+pp.b+"</b>. Er "+(plural?"zijn meer dingen, dus son en "+form:"is één ding, dus es en "+form)+". Samen: <b>"+out+"</b>"+
      (pp.b==="nuestro"?" nuestro past ook mee op geslacht, en "+w.es+" is "+G_NL[w.g]+".":""),
    wrongWhy:{},
    ruleName:"tener wordt es of son plus een bezitswoord",
    mistake:"De -s vergeten op het bezitswoord, of es laten staan bij meervoud.",
    trick:"Twee dingen tegelijk: wie het heeft kiest mi, tu of su. Hoeveel dingen kiest es of son én de -s."};
});

  const pp = R.pick(POSSP), w = R.pick(NOUNS), plural = R.chance(.5);

function verbGen(topic, group, label){
  reg(topic,"vervoegen",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.int(6), pr = P6[i], form = conj(v,i);
    const wrongs = [conj(v,(i+1)%6), conj(v,(i+2)%6), v.es].filter((x,ix,arr)=>x!==form && arr.indexOf(x)===ix);
    return {type:"mc", prompt:"Vervoeg "+v.es+" ("+v.nl+") voor "+pr.p+".",
      sentence:cap(pr.p)+" ___ .", showEs:cap(pr.p)+" "+form+".",
      options:[form].concat(wrongs.slice(0,3)), answer:form,
      why:"Haal -"+v.g+" van "+v.es+" af, dat geeft de stam "+v.es.slice(0,-2)+". Bij "+pr.p+" hoort het staartje -"+ENDINGS[v.g][i]+". Samen: "+form+".",
      wrongWhy:{[v.es]:"Dat is de basisvorm. Zodra je zegt wie het doet, moet het staartje eraan."},
      ruleName:"Staartjes van "+label+": "+ENDINGS[v.g].join(", "),
      mistake:"De basisvorm laten staan, of het staartje van een andere groep gebruiken.",
      trick:"Stam plus staartje. Het rijtje is: "+ENDINGS[v.g].join(", ")+"."};
  });
  reg(topic,"invullen",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.int(6), pr = P6[i], form = conj(v,i);
    return {type:"input", prompt:"Vul de juiste vorm in van "+v.es+" ("+v.nl+").",
      sentence:cap(pr.p)+" ___ ("+v.es+").", showEs:cap(pr.p)+" "+form+".",
      answer:form, accept:[form, pr.p+" "+form],
      why:"Stam "+v.es.slice(0,-2)+" plus het staartje voor "+pr.p+", dat is -"+ENDINGS[v.g][i]+". Samen: "+form+".",
      wrongWhy:{},
      ruleName:"Zelf vervoegen in "+label,
      mistake:"Het staartje van een andere groep pakken.",
      trick:"De klinker van het werkwoord komt terug in het staartje."};
  });
  reg(topic,"nl2es",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.pick([0,1,2,3]), pr = P6[i], form = conj(v,i);
    const nlv = {0:v.nl, 1:v.nl.replace(/en$/,"")+"t", 2:v.nl.replace(/en$/,"")+"t", 3:v.nl}[i];
    return {type:"input", prompt:"Vertaal naar het Spaans. Laat het woordje voor de persoon weg.",
      sentence:cap(pr.nl)+" "+nlv+".", showEs:cap(form)+".",
      answer:cap(form)+".", accept:[form, form+".", pr.p+" "+form],
      why:"Bij "+pr.nl+" hoort de vorm "+form+". Het woordje "+pr.p+" mag weg, want het staartje zegt al wie het doet.",
      wrongWhy:{},
      ruleName:"Van Nederlands naar een vervoegd werkwoord",
      mistake:"Het woordje yo of tú erbij zetten uit gewoonte.",
      trick:"Het staartje vertelt wie het doet. Meer heb je niet nodig."};
  });
}

const HABIT = [
  ["todos los días","elke dag"],["los lunes","op maandag"],["los domingos","op zondag"],
  ["siempre","altijd"],["a veces","soms"],["normalmente","meestal"],

function gerund(v){ return v.es.slice(0,-2) + (v.g==="ar" ? "ando" : "iendo"); }

/* Nederlandse ik-vorm per werkwoord. Zomaar -en weghalen gaat mis
   bij woorden als betalen (betaal) en koken (kook). */
const NLSTEM = {
  hablar:"spreek", comprar:"koop", trabajar:"werk", estudiar:"studeer", cantar:"zing",
  bailar:"dans", escuchar:"luister", mirar:"kijk", esperar:"wacht", cocinar:"kook",
  tomar:"neem", llamar:"bel", ayudar:"help", buscar:"zoek", pagar:"betaal",
  preguntar:"vraag", caminar:"loop", lavar:"was", limpiar:"maak schoon", viajar:"reis",
  llegar:"kom aan", llevar:"draag", entrenar:"train", nadar:"zwem", descansar:"rust uit",
  levantar:"til", necesitar:"heb nodig", comer:"eet", beber:"drink", leer:"lees",
  aprender:"leer", vender:"verkoop", correr:"ren", comprender:"begrijp", responder:"antwoord",
  vivir:"woon", escribir:"schrijf", abrir:"open", subir:"ga omhoog", recibir:"ontvang",
  decidir:"beslis"
};
/* werkwoorden die in het Nederlands uit twee stukken bestaan laten we hier weg,
   want die maken de voorbeeldzin onnodig ingewikkeld */
const NLSIMPLE = v => NLSTEM[v.es] && NLSTEM[v.es].indexOf(" ") < 0;
const PVERBS = () => VERBS.filter(NLSIMPLE);

function nlPresent(v, i){
  const stam = NLSTEM[v.es] || v.nl.replace(/en$/,"");
  if(i===3) return v.nl;
  if(i===0) return stam;
  return stam.endsWith("t") ? stam : stam+"t";
}

const PLAATSEN = ["casa","cocina","jardín","salón","oficina","gimnasio","hotel","playa","ciudad","dormitorio"];
/* eigenschap met de juiste Nederlandse buigingsvorm erbij */
const FORMADJ = [["grande","grote"],["pequeño","kleine"],["nuevo","nieuwe"],["viejo","oude"],
  ["bonito","mooie"],["limpio","schone"],["sucio","vieze"],["frío","koude"],["caro","dure"]];
const DOEPAREN = [
  ["comer",["pan","queso","pollo","pescado","sopa","ensalada","tomate"]],
  ["beber",["agua","leche","café","vino","cerveza","zumo"]],
  ["comprar",["libro","coche","camiseta","pantalón","chaqueta","mesa","silla"]],
  ["escuchar",["música","canción","radio"]],
  ["cantar",["canción","música"]],
  ["limpiar",["cocina","casa","mesa","ventana","suelo"]],
  ["lavar",["camiseta","coche","ropa","mano"]],
  ["buscar",["llave","móvil","dinero","trabajo"]],
  ["leer",["libro","correo","factura"]]
];
function vondWoord(es){ return NOUNS.find(w=>w.es===es); }
function doePaar(){
  for(let k=0;k<20;k++){
    const p = R.pick(DOEPAREN);
    const v = VERBS.find(x=>x.es===p[0]);
    const n = vondWoord(R.pick(p[1]));
    if(v && n) return {v:v, n:n};
  }
  return {v:VERBS.find(x=>x.es==="comer"), n:vondWoord("pan")};
}

function formuleZin(){
  const v = VERBS.find(x=>x.es===R.pick(PLAATSWW)) || VERBS[0];
  const p = R.pick([["en","in"],["en","in"],["cerca de","dichtbij"]]);
  /* na "cerca de" zou el samensmelten tot del, dus daar kiezen we een
     vrouwelijk woord: die les hoort bij het onderwerp Plaats, niet hier */
  const kandidaten = PLAATSEN.map(vondWoord).filter(Boolean)
    .filter(w => p[0]==="cerca de" ? w.art==="la" : true);
  const n = R.pick(kandidaten.length?kandidaten:[vondWoord("casa")]);
  const ap = R.pick(FORMADJ);
  const a = ADJS.find(x=>x.es===ap[0]) || ADJS[0];
  const wie = R.pick([["Yo",0,"Ik"],["Tú",1,"Jij"],["Ella",2,"Zij"]]);
  const adj = adjForm(a, n.g, 1);
  return {
    v:v, p:p, n:n, a:a, wie:wie, adj:adj,
    es:wie[0]+" "+conj(v,wie[1])+" "+p[0]+" "+n.art+" "+n.es+" "+adj+".",
    nl:wie[2]+" "+nlPresent(v,wie[1])+" "+p[1]+" de "+ap[1]+" "+n.nl+".",
    delen:[[wie[0],"wie"],[conj(v,wie[1]),"werkwoord"],[p[0],"plaatswoordje"],[n.art,"lidwoord"],[n.es,"ding"],[adj,"eigenschap"]]
  };
}

/* ---------- WOORDENSCHAT PER THEMA ---------- */
function vocabGens(theme){
  const pool = () => byTheme(theme);
  reg(theme,"es2nl",()=>{
    const w = R.pick(pool()), others = R.pickN(pool().filter(x=>x.es!==w.es),3);
    return {type:"mc", prompt:"Wat betekent dit woord?", sentence:(w.art?w.art+" ":"")+w.es,
      showEs:(w.art?w.art+" ":"")+w.es, options:[w.nl].concat(others.map(x=>x.nl)), answer:w.nl, word:w.key,
      why:(w.art?w.art+" ":"")+w.es+" betekent "+w.nl+". Uitspraak: "+w.pron+".",
      wrongWhy:others.reduce((o,x)=>{o[x.nl]=x.nl+" is "+(x.art?x.art+" ":"")+x.es+".";return o;},{}),
      ruleName:"Woorden van het thema "+THEMES[theme].nl,
      mistake:"Woorden leren zonder het lidwoord.",
      trick:"Leer altijd "+(w.art||"")+" "+w.es+" als één geheel."};
  });
  reg(theme,"nl2es",()=>{
    const w = R.pick(pool());
    return {type:"input", prompt:"Schrijf dit woord in het Spaans"+(w.art?", met el of la ervoor.":"."),
      sentence:w.nl, showEs:(w.art?w.art+" ":"")+w.es,
      answer:(w.art?w.art+" ":"")+w.es, accept:[(w.art?w.art+" ":"")+w.es, w.es], word:w.key,
      why:w.nl+" is "+(w.art?w.art+" ":"")+w.es+". "+(w.art?genderReason(w):"Dit is een beschrijvend woord, dus er hoort geen lidwoord bij."),
      wrongWhy:{},
      ruleName:"Woorden actief kunnen opschrijven",
      mistake:"Het lidwoord weglaten. Dat is de helft van het woord.",
      trick:"Uitspraak: "+w.pron};
  });
  reg(theme,"plaatje",()=>{
    const withPic = pool().filter(x=>x.emoji);
    if(!withPic.length) return makeExercise(theme,theme+".es2nl");
    const w = R.pick(withPic), others = R.pickN(pool().filter(x=>x.es!==w.es),3);
    return {type:"picture", prompt:"Wat zie je hier?", emoji:w.emoji,
      showEs:(w.art?w.art+" ":"")+w.es,
      options:[(w.art?w.art+" ":"")+w.es].concat(others.map(x=>(x.art?x.art+" ":"")+x.es)),
      answer:(w.art?w.art+" ":"")+w.es, word:w.key,
      why:"Dit is "+(w.art?w.art+" ":"")+w.es+" ("+w.nl+"). Uitspraak: "+w.pron+".",
      wrongWhy:others.reduce((o,x)=>{o[(x.art?x.art+" ":"")+x.es]=x.es+" betekent "+x.nl+".";return o;},{}),
      ruleName:"Woorden bij een beeld",
      mistake:"Twijfelen tussen twee woorden die op elkaar lijken.",
      trick:"Maak een plaatje in je hoofd bij het Spaanse woord, niet bij het Nederlandse."};
  });
  reg(theme,"luister",()=>{
    const w = R.pick(pool()), others = R.pickN(pool().filter(x=>x.es!==w.es),3);
    return {type:"listen", prompt:"Luister en kies het woord dat je hoort.",
      showEs:(w.art?w.art+" ":"")+w.es, audio:(w.art?w.art+" ":"")+w.es,
      options:[(w.art?w.art+" ":"")+w.es].concat(others.map(x=>(x.art?x.art+" ":"")+x.es)),
      answer:(w.art?w.art+" ":"")+w.es, word:w.key,
      why:"Je hoorde "+(w.art?w.art+" ":"")+w.es+" ("+w.nl+"). Uitspraak: "+w.pron+".",
      wrongWhy:others.reduce((o,x)=>{o[(x.art?x.art+" ":"")+x.es]=x.es+" klinkt als "+x.pron+".";return o;},{}),
      ruleName:"Woorden op gehoor herkennen",
      mistake:"Alleen op de eerste letter letten. Let ook op de klemtoon.",
      trick:"De hoofdletters in "+w.pron+" laten zien waar de nadruk ligt."};
  });
  reg(theme,"koppelen",()=>{
    const ws = R.pickN(pool(),4);
    return {type:"match", prompt:"Koppel elk Spaans woord aan de Nederlandse betekenis.",
      pairs:ws.map(w=>[(w.art?w.art+" ":"")+w.es, w.nl]),
      answer:"", showEs:ws.map(w=>w.es).join(", "),
      why:"Goed gedaan. "+ws.map(w=>(w.art?w.art+" ":"")+w.es+" = "+w.nl).join(". ")+".",
      wrongWhy:{},
      ruleName:"Woorden van het thema "+THEMES[theme].nl,
      mistake:"Gokken bij woorden die op elkaar lijken.",
      trick:"Koppel eerst de woorden die je zeker weet. Dan blijven er minder over."};
  });
  const nouns = byTheme(theme).filter(w=>!w.isAdj);
  if(nouns.length){
    reg(theme,"lidwoord",()=>{
      const w = R.pick(nouns);
      return {type:"mc", prompt:"Welk lidwoord hoort bij dit woord?", sentence:"___ "+w.es+" ("+w.nl+")",
        showEs:w.art+" "+w.es, options:["el","la"], answer:w.art, word:w.key,
        why:genderReason(w),
        wrongWhy:{[w.art==="el"?"la":"el"]:"Nee, het is "+w.art+" "+w.es+". "+genderReason(w)},
        ruleName:"Lidwoord bij woorden van het thema "+THEMES[theme].nl,
        mistake:"Gokken in plaats van naar de laatste letter kijken.",
        trick:"Zeg het woord altijd met lidwoord: "+w.art+" "+w.es+"."};
    });
  }
}

function vocabGens2(theme){
  const nouns = () => byTheme(theme).filter(w=>!w.isAdj);
  const adjs  = () => byTheme(theme).filter(w=>w.isAdj);

  if(nouns().length){
    reg(theme,"zin",()=>{
      const w = R.pick(nouns()), a = R.pick(ADJS), plural = R.chance(.4);
      const right = adjForm(a, w.g, plural?2:1);
      const noun = plural?w.pl:w.es, art = plural?artPlur(w):w.art;
      const wrongs = [adjForm(a, w.g==="f"?"m":"f", plural?2:1), adjForm(a, w.g, plural?1:2)]
        .filter((x,i,arr)=>x!==right && arr.indexOf(x)===i);
      return {type:"mc", prompt:"Vul de juiste vorm in van "+a.es+" ("+a.nl+").",

/* ============================================================
   8. UITSPRAAK — zet elke Spaanse zin om in Nederlandse klanken
   HOOFDLETTERS = daar leg je de klemtoon.
   ============================================================ */
const VOW = "aeiouáéíóúü";
const STR = "aeoáéó";
const isV = c => c && VOW.indexOf(c)>=0;
const isS = c => c && STR.indexOf(c)>=0;
const CLUST = ["bl","br","cl","cr","dr","fl","fr","gl","gr","pl","pr","tr","tl","ll","ch","rr"];

function syllabify(w){
  const g=[]; let i=0;
  while(i<w.length){
    if(isV(w[i])){
      let s=i,e=i;
      while(e+1<w.length && isV(w[e+1])){ if(isS(w[e])&&isS(w[e+1])) break; e++; }
      g.push([s,e]); i=e+1;
    } else i++;
  }
  if(g.length<2) return [w];
  const cuts=[];
  for(let k=0;k<g.length-1;k++){
    const a=g[k][1], b=g[k+1][0], cons=w.slice(a+1,b);
    let cut;
    if(cons.length===0) cut=b;
    else if(cons.length===1) cut=a+1;
    else if(cons.length===2) cut = CLUST.indexOf(cons)>=0 ? a+1 : a+2;
    else cut = CLUST.indexOf(cons.slice(-2))>=0 ? b-2 : b-1;
    cuts.push(cut);
  }
  const out=[]; let p=0;
  cuts.forEach(c=>{ out.push(w.slice(p,c)); p=c; });
  out.push(w.slice(p));
  return out.filter(x=>x.length);
}

function tsyl(s, prevChar, wordEnd){
  s = s.replace(/gu([eiéí])/g,"\u0001$1").replace(/qu([eiéí])/g,"\u0002$1");
  let o="", i=0;
  const A={"á":"a","é":"e","ó":"o"};
  while(i<s.length){
    const c=s[i], n=s[i+1]||"", n2=s[i+2]||"", pv = i>0 ? s[i-1] : prevChar;
    if(c==="\u0001"){ o+="g"; i++; continue; }
    if(c==="\u0002"){ o+="k"; i++; continue; }
    if(c==="q" && n==="u"){ o+="k"; i+=2; continue; }
    if(c==="g" && n==="ü"){ o+="gw"; i+=2; continue; }
    if(c==="g" && "eiéí".indexOf(n)>=0){ o+="ch"; i++; continue; }
    if(c==="j"){ o+="ch"; i++; continue; }
    if(c==="l" && n==="l"){ o+="j"; i+=2; continue; }
    if(c==="c" && n==="h"){ o+="tsj"; i+=2; continue; }
    if(c==="c" && "eiéí".indexOf(n)>=0){ o+="th"; i++; continue; }
    if(c==="c"){ o+="k"; i++; continue; }
    if(c==="z"){ o+="th"; i++; continue; }
    if(c==="v"){ o+="b"; i++; continue; }
    if(c==="h"){ i++; continue; }
    if(c==="ñ"){ o+="nj"; i++; continue; }
    if(c==="r" && n==="r"){ o+="rr"; i+=2; continue; }
    if(c==="x"){ o+="ks"; i++; continue; }
    if(c==="y"){ o += isV(n) ? "j" : "ie"; i++; continue; }
    if(c==="i"||c==="í"){ o += (isV(n)||isV(pv)) ? "i" : "ie"; i++; continue; }
    if(c==="u"||c==="ú"||c==="ü"){ o += isV(n) ? "w" : ((pv==="i"||pv==="í") ? "oe" : (isV(pv) ? "u" : "oe")); i++; continue; }
    if(c==="d" && wordEnd && i===s.length-1){ o+="th"; i++; continue; }
    if(A[c]){ o+=A[c]; i++; continue; }
    o+=c; i++;
  }
  return o;
}

function pronWord(raw){
  const w = raw.toLowerCase().replace(/[¿?¡!.,;:"'()]/g,"");
  if(!w) return "";
  if(!/[a-záéíóúüñ]/.test(w)) return raw;
  const syl = syllabify(w);
  let acc = -1;
  syl.forEach((s,i)=>{ if(/[áéíóú]/.test(s)) acc = i; });
  let stress;
  if(acc>=0) stress = acc;
  else if(syl.length===1) stress = -1;
  else stress = /[aeiouns]$/.test(w) ? syl.length-2 : syl.length-1;
  return syl.map((s,i)=>{
    const t = tsyl(s, i>0 ? syl[i-1].slice(-1) : "", i===syl.length-1);
    return i===stress ? t.toUpperCase() : t;
  }).join("-");
}
function pronOf(text){
  if(!text) return "";
  return String(text).split(/\s+/).map(pronWord).filter(x=>x).join(" ");
}

function bouwGlos(){
  /* zelfstandige naamwoorden en bijvoeglijke naamwoorden */
  VOCAB.forEach(w=>{
    const lidw = w.art ? w.art+" " : "";
    glosAdd(w.es, {es:lidw+w.es, nl:w.nl, pron:w.pron || pronOf(w.es), emoji:w.emoji,
      extra: w.art ? (G_NL[w.g]+", meervoud "+w.pl) : "beschrijvend woord"});
    if(w.pl && w.pl!==w.es){
      glosAdd(w.pl, {es:(w.art?artPlur(w)+" ":"")+w.pl, nl:w.nl+" (meervoud)", pron:pronOf(w.pl), emoji:w.emoji,
        extra:"meervoud van "+w.es});
    }
    if(w.isAdj){
      ["o","a","os","as"].forEach(eind=>{
        if(w.es.endsWith("o")){
          const vorm = w.es.slice(0,-1)+eind;
          glosAdd(vorm, {es:vorm, nl:w.nl, pron:pronOf(vorm), extra:"vorm van "+w.es});
        }
      });
    }
  });

  /* werkwoorden: alle zes vormen */
  VERBS.forEach(v=>{
    glosAdd(v.es, {es:v.es, nl:v.nl, pron:v.pron || pronOf(v.es), extra:"heel werkwoord, groep -"+v.g});
    for(let i=0;i<6;i++){
      const vorm = conj(v,i);
      glosAdd(vorm, {es:vorm, nl:nlPresent(v,i)+" ("+P6[i].nl+")", pron:pronOf(vorm),
        extra:"van "+v.es+" = "+v.nl});
    }
  });

  /* de onregelmatige */
  [["ser",SER,"zijn (vast)"],["estar",ESTAR,"zijn (nu)"],["tener",TENER,"hebben"],["ir",IR,"gaan"]].forEach(([naam,vormen,bet])=>{
    glosAdd(naam, {es:naam, nl:bet, pron:pronOf(naam), extra:"onregelmatig werkwoord"});
    vormen.forEach((f,i)=>glosAdd(f, {es:f, nl:P6[i].nl+" "+(bet.split(" ")[0]), pron:pronOf(f),
      extra:"van "+naam+" ("+bet+")"}));
  });

  /* getallen, plaatswoorden, vraagwoorden */
  NUMS.forEach(n=>glosAdd(n[1], {es:n[1], nl:"het getal "+n[0], pron:pronOf(n[1])}));
  PLACES.forEach(p=>glosAdd(p.es.split(" ")[0], {es:p.es, nl:p.nl, pron:pronOf(p.es), extra:"plaatswoord"}));
  QWORDS.forEach(q=>glosAdd(q.es.replace(/[¿?]/g,""), {es:q.es, nl:q.nl, pron:pronOf(q.es), extra:"vraagwoord, voor "+q.use}));

  GLOSVAST.forEach(([w,nl])=>glosAdd(w, {es:w, nl:nl, pron:pronOf(w)}));
}

function bouwGlosExtra(){
  GLOSDAG.forEach(([w,nl])=>glosAdd(w,{es:w,nl:nl,pron:pronOf(w),extra:"dag van de week"}));
  GLOSMEER.forEach(([w,nl])=>glosAdd(w,{es:w,nl:nl,pron:pronOf(w)}));
  /* meervoud en vrouwelijke vormen van alle beschrijvende woorden */
  ADJS.concat(ESTADJS).forEach(w=>{
    ["m","f"].forEach(g=>[1,2].forEach(n=>{
      const vorm = adjForm(w,g,n);
      glosAdd(vorm,{es:vorm,nl:w.nl,pron:pronOf(vorm),extra:"vorm van "+w.es});
    }));
  });
  /* de aan-het vorm van elk werkwoord */
  VERBS.forEach(v=>{
    const g = v.es.slice(0,-2) + (v.g==="ar" ? "ando" : "iendo");
    glosAdd(g,{es:g,nl:"aan het "+v.nl,pron:pronOf(g),extra:"van "+v.es});
  });
}

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* Spaanse tekst omzetten naar tekst met aanwijsbare woorden */
function glos(text){
  if(text==null) return "";
  return String(text).split(/(\s+)/).map(tok=>{
    if(!tok || /^\s+$/.test(tok)) return tok;
    const kaal = tok.replace(/^[¿¡("'.,]+/,"").replace(/[.,;:!?)"']+$/,"");
    if(!kaal || !GLOS[norm(kaal)]) return esc(tok);
    const voor = tok.slice(0, tok.indexOf(kaal));
    const na = tok.slice(tok.indexOf(kaal)+kaal.length);
    return esc(voor) + '<span class="gl" data-gl="'+esc(kaal)+'">'+esc(kaal)+'</span>' + esc(na);
  }).join("");
}

/* het zwevende kaartje */
let tipEl = null, tipTimer = null;
function tipShow(el){
  const info = GLOS[norm(el.dataset.gl||"")];
  if(!info) return;
  if(!tipEl){
    tipEl = document.createElement("div");
    tipEl.className = "tip";
    document.body.appendChild(tipEl);
  }
  tipEl.innerHTML = (info.emoji?'<div class="tip-emo">'+info.emoji+'</div>':'')
    + '<div class="tip-es">'+esc(info.es)+'</div>'
    + '<div class="tip-nl">'+esc(info.nl)+'</div>'
    + (info.pron?'<div class="tip-pr">'+esc(info.pron)+'</div>':'')
    + (info.extra?'<div class="tip-ex">'+esc(info.extra)+'</div>':'');
  const r = el.getBoundingClientRect();
  tipEl.style.visibility = "hidden";
  tipEl.classList.add("on");
  const tr = tipEl.getBoundingClientRect();
  let left = r.left + r.width/2 - tr.width/2;
  left = Math.max(10, Math.min(left, window.innerWidth - tr.width - 10));
  let top = r.top - tr.height - 10;
  if(top < 8) top = r.bottom + 10;
  tipEl.style.left = left+"px";
  tipEl.style.top = top+"px";
  tipEl.style.visibility = "visible";
}
function tipHide(){ if(tipEl) tipEl.classList.remove("on"); }

document.addEventListener("mouseover", ev=>{
  const g = ev.target.closest && ev.target.closest(".gl");
  if(g){ clearTimeout(tipTimer); tipShow(g); }
});
document.addEventListener("mouseout", ev=>{
  if(ev.target.closest && ev.target.closest(".gl")){
    clearTimeout(tipTimer);
    tipTimer = setTimeout(tipHide, 120);
  }
});
/* op de telefoon: tikken, maar alleen buiten knoppen zodat antwoorden blijft werken */
document.addEventListener("click", ev=>{
  const g = ev.target.closest && ev.target.closest(".gl");
  if(g && !ev.target.closest("button")){
    ev.stopPropagation();
    tipShow(g);
    clearTimeout(tipTimer);
    tipTimer = setTimeout(tipHide, 3200);
    return;
  }
  tipHide();
}, true);
document.addEventListener("scroll", tipHide, true);

/* ---------- zin uit een patroon bouwen ---------- */
function fillPattern(pat, sel){
  const es = pat.frame.replace(/\{(\w+)\}/g, (m,k)=> pat.slots[k][(sel&&sel[k])||0][0]);
  const nl = pat.frameNl.replace(/\{(\w+)\}/g, (m,k)=> pat.slots[k][(sel&&sel[k])||0][1]);
  return {es:es.trim(), nl:nl.trim()};
}
function randomFill(pat){
  const sel = {};
  Object.keys(pat.slots).forEach(k => sel[k] = R.int(pat.slots[k].length));
  return {sel, out:fillPattern(pat, sel)};
}

/* ---------- generatoren ---------- */
function buildGens(src){
  const t = "b_"+src;
  const pats = () => BUILD[src].patterns;
  /* verzamel altijd genoeg verschillende afleiders */
  const distractors = (avoid, n) => {
    const out = []; let guard = 0;
    while(out.length < n && guard++ < 80){
      const cand = randomFill(R.pick(pats())).out.es;
      if(cand !== avoid && out.indexOf(cand) < 0) out.push(cand);
    }
    return out;
  };
  reg(t,"bouw",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    const words = f.out.es.replace(/[¿?¡!]/g,"").split(" ");
    return {type:"build", prompt:"Maak deze zin in het Spaans.", sentence:f.out.nl, showEs:f.out.es,
      pool:R.shuffle(words), answer:words.join(" "), accept:[words.join(" "), f.out.es, f.out.es.replace(/[¿?¡!]/g,"")],
      why:"<b>"+f.out.es+"</b> = "+f.out.nl+" Uitspraak: "+pronOf(f.out.es)+". "+pat.note,
      wrongWhy:{},
      ruleName:"Patroon: "+pat.name,
      mistake:"De Nederlandse woordvolgorde aanhouden.",
      trick:"Bouw eerst het frame ("+pat.frame.replace(/\{\w+\}/g,"...")+") en vul dan het gat."};
  });
  reg(t,"zelfmaken",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"input", prompt:"Maak zelf deze zin in het Spaans.", sentence:f.out.nl, showEs:f.out.es,
      answer:f.out.es, accept:[f.out.es, f.out.es.replace(/[¿?¡!.,]/g,"").trim()],
      why:"<b>"+f.out.es+"</b> Uitspraak: "+pronOf(f.out.es)+". "+pat.note,
      wrongWhy:{},
      ruleName:"Patroon: "+pat.name+" ("+pat.frame+")",
      mistake:"Het frame goed hebben maar het woordje ertussen vergeten, zoals de a in voy a of de al in juego al.",
      trick:"Zeg eerst het frame hardop, dan pas het woord dat erin moet."};
  });
  reg(t,"gat",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    const k = R.pick(Object.keys(pat.slots));
    const right = pat.slots[k][f.sel[k]][0];
    const others = R.pickN(pat.slots[k].filter((x,i)=>i!==f.sel[k]),3).map(x=>x[0]);
    const shown = pat.frame.replace(new RegExp("\\{"+k+"\\}"), "___")
      .replace(/\{(\w+)\}/g, (m,kk)=> pat.slots[kk][f.sel[kk]][0]);
    return {type:"mc", prompt:"Je wil zeggen: "+f.out.nl+" Wat komt er in het gat?", sentence:shown, showEs:f.out.es,
      options:[right].concat(others), answer:right,
      why:"De hele zin wordt: <b>"+f.out.es+"</b> ("+f.out.nl+") Uitspraak: "+pronOf(f.out.es)+".",
      wrongWhy:pat.slots[k].filter((x,i)=>i!==f.sel[k]).reduce((o,x)=>{o[x[0]]=x[0]+" betekent "+x[1];return o;},{}),
      ruleName:"Patroon: "+pat.name,
      mistake:"Het gat vullen met iets dat qua betekenis klopt maar niet in dit frame past.",
      trick:pat.note};
  });
  reg(t,"kies",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"mc", prompt:"Welke zin betekent dit?", sentence:f.out.nl, showEs:f.out.es,
      options:[f.out.es].concat(distractors(f.out.es,3)), answer:f.out.es,
      why:"<b>"+f.out.es+"</b> Uitspraak: "+pronOf(f.out.es)+". "+pat.note,
      wrongWhy:{},
      ruleName:"Patroon: "+pat.name,
      mistake:"Op één bekend woord afgaan zonder de rest te lezen.",
      trick:"Kijk eerst welk frame er staat, dan pas naar het woord in het gat."};
  });
  reg(t,"luister",()=>{
    const pat = R.pick(pats()), f = randomFill(pat);
    return {type:"listen", prompt:"Luister en kies de zin die je hoort.", showEs:f.out.es, audio:f.out.es,
      options:[f.out.es].concat(distractors(f.out.es,3)), answer:f.out.es,
      why:"Je hoorde: <b>"+f.out.es+"</b> ("+f.out.nl+") Uitspraak: "+pronOf(f.out.es)+".",
      wrongWhy:{},
      ruleName:"Patroon: "+pat.name,
      mistake:"Te snel kiezen. Luister nog een keer, dat mag altijd.",
      trick:"Let op het frame aan het begin van de zin."};
  });
}

const KEY = "azulejo:v1";

/* Voortgang wordt op twee plekken bewaard, zodat het overal werkt:
   binnen Claude via window.storage, en als los bestand via de browseropslag. */
function localGet(){ try{ return window.localStorage ? window.localStorage.getItem(KEY) : null; }catch(e){ return null; } }
function localSet(v){ try{ if(window.localStorage) window.localStorage.setItem(KEY, v); }catch(e){} }

/* Voortgang van een oudere versie mag gewoon in een nieuwere app.
   Onderwerpen die nieuw zijn beginnen op nul, onderwerpen die weg zijn
   worden overgeslagen. Zo overleeft je voortgang elke update. */
function applyState(d){
  if(!d || typeof d !== "object") return false;
  Object.keys(d).forEach(k=>{
    if(k==="t"){ Object.keys(d.t||{}).forEach(id=>{ if(S.t[id]) Object.assign(S.t[id], d.t[id]); }); }
    else if(k in S) S[k]=d[k];
  });
  /* losse tellers van verdwenen regels of woorden opruimen zodat het bestand klein blijft */
  ["r","w"].forEach(k=>{ if(!S[k] || typeof S[k]!=="object") S[k]={}; });
  if(!Array.isArray(S.unlocked)) S.unlocked = [];
  return true;
}

const CLOUD = {msg:"", on:false};

function cloudSoon(){
  if(!AUTH.email) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{
    cloudPush().then(()=>{ CLOUD.msg = "Opgeslagen in de cloud."; })
      .catch(()=>{ CLOUD.msg = "Cloud even niet bereikbaar. Lokaal is alles bewaard."; })

async function loadState(){
  let raw = null;
  try{
    if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) raw = r.value; }
  }catch(e){ /* eerste keer: nog niets bewaard */ }
  if(!raw) raw = localGet();
  if(raw){ try{ applyState(JSON.parse(raw)); }catch(e){} }

  loadAuth();
  if(AUTH.email){
    try{
      const remote = await cloudPull();
      if(remote && (remote.savedAt||0) > (S.savedAt||0)){
        applyState(remote);
        CLOUD.msg = "Voortgang opgehaald uit de cloud.";
      } else if(remote){
        CLOUD.msg = "Alles was al bij.";
      } else {
        CLOUD.msg = "Nog niets in de cloud. Wordt vanzelf opgeslagen.";
        cloudSoon();
      }
    }catch(e){ CLOUD.msg = "Cloud even niet bereikbaar. Lokaal werkt gewoon door."; }
  }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    S.savedAt = Date.now();
    const v = JSON.stringify(S);

/* ---------- niveau en xp ---------- */
const XP_LVL = 140;
const levelOf = xp => Math.floor(xp/XP_LVL)+1;
const lvlProgress = xp => (xp % XP_LVL)/XP_LVL;

/* ---------- kracht per onderwerp ---------- */
function bump(topic, ok){
  const t = S.t[topic]; if(!t) return;
  t.seen++; if(ok) t.ok++;
  if(ok) t.strength = Math.min(100, t.strength + (100-t.strength)*0.20 + 2);
  else   t.strength = Math.max(0,   t.strength - t.strength*0.28 - 5);
}
const unlockedIdx = () => {
  let n = 2;
  for(let i=0;i<GTOPICS.length;i++){
    const t = S.t[GTOPICS[i].id];
    if(t.strength>=50 || t.quiz>=80) n = Math.max(n, i+2);
  }
  return Math.min(n, GTOPICS.length);
};
/* praktijkzinnen staan altijd open: die wil je vanaf dag één kunnen gebruiken */
const isUnlocked = id => TOPIC[id].kind==="phrase" || TOPIC[id].kind==="build"
  || (S.unlocked||[]).indexOf(id) >= 0 || TOPIC[id].n < unlockedIdx();
const isGlazed   = id => S.t[id].quiz>=80 || S.t[id].strength>=70;
const isMastered  = id => S.t[id].quiz>=80 && S.t[id].strength>=88;
const openTopics = () => TOPICS.filter(t=>isUnlocked(t.id));
const weakTopics = () => openTopics().filter(t=>S.t[t.id].seen>0)
  .sort((a,b)=>S.t[a.id].strength - S.t[b.id].strength);

/* onderwerpen wegen: zwak komt vaker terug */
function weightedTopic(list){
  const pool = [];
  list.forEach(t=>{
    const s = S.t[t.id];
    let w = Math.max(1, Math.round((100 - s.strength)/12)) + (s.seen===0?3:0);
    for(let i=0;i<w;i++) pool.push(t.id);
  });
  return R.pick(pool);
}

   5. SESSIE: de oefenlus met herhaling tot je het kan
   ============================================================ */
let SESS = null;
const REM_CAP = 6;

function newSession(cfg){
  SESS = Object.assign({
    mode:"practice", topic:null, queue:[], idx:0, right:0, wrong:0,
    ruleStreak:{}, remLeft:{}, remRounds:{}, missed:{}, answered:0,
    limit:0, endAt:0, done:false, lastFb:null
  }, cfg);
  fillQueue();
  return SESS;
}
function nextExercise(){
  if(SESS.mode==="practice" || SESS.mode==="weak"){
    const id = SESS.topic || weightedTopic(weakTopics().length?weakTopics():openTopics());
    return makeExercise(id);
  }
  if(SESS.mode==="quiz") return makeExercise(SESS.topic);
  return makeExercise(weightedTopic(openTopics()));
}
function fillQueue(){
  const want = SESS.limit ? Math.min(SESS.limit, SESS.idx+6) : SESS.idx+6;
  let guard = 0;
  while(SESS.queue.length < want && guard++ < 40){
    const e = nextExercise();
    if(e) SESS.queue.push(e);
  }
}
function addRemediation(rule, n){
  const topic = rule.split(".")[0];
  const items = [];
  for(let i=0;i<n;i++){
    const e = makeExercise(topic, rule);
    if(e){ e.rem = rule; items.push(e); }
  }
  SESS.queue.splice(SESS.idx+1, 0, ...items);
  SESS.remLeft[rule] = (SESS.remLeft[rule]||0) + items.length;
  SESS.remRounds[rule] = (SESS.remRounds[rule]||0) + 1;
  return items.length;
}

/* Alles wat redelijkerwijs goed is, telt als goed.
   Vul je alleen het gat in? Prima. Typ je de hele zin? Ook prima. */
function acceptSet(e){
  const base = (e.accept && e.accept.length ? e.accept : [e.answer]).filter(Boolean).map(String);
  const out = base.slice();
  const push = v => { v = String(v==null?"":v).trim(); if(v && !out.some(x=>sameLoose(x,v))) out.push(v); };
  const sent = e.sentence ? String(e.sentence) : "";
  const gaps = (sent.match(/___/g)||[]).length;

  if(gaps===1) base.forEach(a => push(sent.replace("___", a)));
  if(gaps>1){
    base.forEach(a=>{
      const parts = a.split(/\s*,\s*/);
      if(parts.length===gaps){ let i=0; push(sent.replace(/___/g, ()=>parts[i++])); }
      else push(sent.replace(/___/g, a));
    });
  }
  /* de hele goede zin telt altijd, behalve als die gelijk is aan de vraag zelf */
  if(e.showEs && !sameLoose(e.showEs, sent)) push(e.showEs);
  base.slice().forEach(a => push(a.replace(/[¿¡]/g,"")));
  return out;
}

function grade(e, given){
  let ok, hit = null;
  if(e.type==="input" || e.type==="build"){
    const set = acceptSet(e);
    hit = set.find(a=>sameLoose(a, given));
    ok = !!hit;
  } else ok = given === e.answer;

  const flat = x => String(x==null?"":x).toLowerCase().replace(/\s+/g," ").trim();
  const accentOnly = !!(ok && hit && flat(hit) !== flat(given));

  S.answered++; if(ok){ S.correct++; S.streak++; S.best=Math.max(S.best,S.streak); } else S.streak = 0;
  bump(e.topic, ok);
  S.r[e.rule] = S.r[e.rule] || {ok:0,no:0};
  ok ? S.r[e.rule].ok++ : S.r[e.rule].no++;
  if(e.word){ S.w[e.word] = S.w[e.word] || {ok:0,no:0}; ok ? S.w[e.word].ok++ : S.w[e.word].no++; }

  SESS.answered++;
  if(ok){ SESS.right++; SESS.ruleStreak[e.rule] = (SESS.ruleStreak[e.rule]||0)+1; }
  else  { SESS.wrong++; SESS.ruleStreak[e.rule] = 0; SESS.missed[e.rule] = (SESS.missed[e.rule]||0)+1; }

  addXp(ok ? (SESS.mode==="quiz"||SESS.mode==="mixed"||SESS.mode==="master" ? 8 : 6) : 1);

  /* de herhaallus: fout betekent vijf nieuwe van precies deze regel */
  let extra = 0;
  const drilling = SESS.mode==="practice" || SESS.mode==="weak";
  if(drilling){
    if(!ok && (SESS.remRounds[e.rule]||0) < REM_CAP) extra = addRemediation(e.rule, 5);
    if(e.rem){
      SESS.remLeft[e.rem] = Math.max(0, (SESS.remLeft[e.rem]||0)-1);
      if(SESS.remLeft[e.rem]===0 && (SESS.ruleStreak[e.rem]||0) < 3 && (SESS.remRounds[e.rem]||0) < REM_CAP){
        extra += addRemediation(e.rem, 5);
      }
    }
  }
  save();
  return {ok, accentOnly, extra, streakOnRule:SESS.ruleStreak[e.rule]||0};
}

const ADMIN_EMAIL = "jurreb@live.nl";
const AKEY = "azulejo:auth";
const TKEY = "azulejo:admintoken";
const AUTH = {email:null, pass:null, admin:false, msg:"", busy:false};
const ADM  = {token:"", users:null, msg:"", busy:false};

function isAdmin(){ return (AUTH.email||"").toLowerCase() === ADMIN_EMAIL; }
function loadAuth(){
  try{
    const r = localStorage.getItem(AKEY);
    if(r){ const a = JSON.parse(r); AUTH.email = a.email || null; AUTH.pass = a.pass || null; }
    ADM.token = localStorage.getItem(TKEY) || "";
  }catch(e){}
  AUTH.admin = isAdmin();
}
function saveAuth(){
  try{
    if(AUTH.email) localStorage.setItem(AKEY, JSON.stringify({email:AUTH.email, pass:AUTH.pass}));
    else localStorage.removeItem(AKEY);
  }catch(e){}
  AUTH.admin = isAdmin();
}
function logout(){
  AUTH.email = null; AUTH.pass = null; AUTH.admin = false;
  try{ localStorage.removeItem(AKEY); }catch(e){}
}

async function api(body){
  const r = await fetch("/api/progress", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body), cache:"no-store"});
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || ("status "+r.status));
  return j;
}
function apiUitleg(err){
  const m = String(err && err.message || err);
  if(m==="no_store") return "De database is nog niet gekoppeld. Doe dat in Vercel en deploy opnieuw.";
  if(m==="admin_disabled") return "AZULEJO_ADMIN_TOKEN staat nog niet ingesteld in Vercel.";
  if(m==="bad_token") return "Dat beheerderswachtwoord klopt niet.";
  if(m==="no_email") return "Vul een e-mailadres in.";
  if(m.indexOf("Failed to fetch")>=0 || m.indexOf("NetworkError")>=0)
    return "Geen verbinding. Draait de app op je eigen server?";
  return "Er ging iets mis: "+m;
}

function gateMsg(t){ const m = $("#g-msg"); if(m) m.textContent = t; AUTH.msg = t; }

async function doLogin(){
  if(AUTH.busy) return;
  const e = ($("#g-email")||{}).value, p = ($("#g-pass")||{}).value;
  const email = String(e||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return gateMsg("Vul een geldig e-mailadres in.");
  if(!p || p.length < 4) return gateMsg("Kies een wachtwoord van minstens 4 tekens.");
  AUTH.busy = true; gateMsg("Bezig met inloggen...");
  AUTH.email = email; AUTH.pass = p; saveAuth();
  try{
    const j = await api({action:"load", email:email, pass:p});
    const vorigeEigenaar = S.owner;
    if(j.data){
      /* dit account heeft al voortgang: die telt, wat er lokaal ook stond */
      resetState();
      applyState(j.data);
      S.owner = email;
    } else if(vorigeEigenaar && vorigeEigenaar !== email){
      /* er stond voortgang van een ander account op dit apparaat: schoon beginnen */
      resetState();
      S.owner = email;
      await cloudPush();
    } else {
      /* eerste keer inloggen met wat je lokaal al had opgebouwd: die nemen we mee */
      const hadAl = vorigeEigenaar === email && S.answered > 0;
      S.owner = email;
      await cloudPush();
      CLOUD.msg = hadAl
        ? "Let op: er stond niets online voor dit account. Als je een leeg overzicht ziet, is je wachtwoord waarschijnlijk net anders dan de vorige keer. Log uit en probeer het opnieuw, je voortgang op dit apparaat blijft gewoon staan."
        : "Je voortgang van dit apparaat staat nu online.";
    }
    save();
    AUTH.busy = false;
    try{ localStorage.removeItem("azulejo:skiplogin"); }catch(err){}
    const g = $("#gate"); if(g) g.remove();
    paintTop(); go("learn");
  }catch(err){
    AUTH.busy = false;
    logout();
    gateMsg(apiUitleg(err));
  }
}

    if(op==="list"){ ADM.users = j.users || []; ADM.msg = ADM.users.length+" account(s) opgehaald."; }

  }catch(err){ ADM.msg = apiUitleg(err); }

];

function drillItems(key){
  const [kind, k] = key.split(":");
  if(kind==="v" && k==="place"){
    return PLACES.map(p=>({q:p.nl, a:p.es, accept:[p.es], pron:pronOf(p.es),
      note:p.es.endsWith(" de") ? "vergeet de niet, en de plus el wordt del" : "de enige zonder de"}));
  }
  if(kind==="v"){
    return byTheme(k).map(w=>({
      q:w.nl, a:(w.art?w.art+" ":"")+w.es, accept:[(w.art?w.art+" ":"")+w.es, w.es],
      emoji:w.emoji, pron:w.pron || pronOf(w.es),
      note:w.art ? "meervoud: "+w.pl : "beschrijvend woord"
    }));
  }
  if(kind==="ger"){ return []; }
  if(kind==="w"){
    if(k==="ger"){
      return R.pickN(VERBS,12).map(v=>({
        q:"aan het "+v.nl+" ("+v.es+")", a:gerund(v), accept:[gerund(v),"estoy "+gerund(v)],
        pron:pronOf(gerund(v)), note:v.g==="ar" ? "-ar wordt -ando" : "-"+v.g+" wordt -iendo"
      }));
    }
    if(k==="irr"){
      const VER = ["veo","ves","ve","vemos","veis","ven"];
      const tabs = [["ser",SER,"zijn (vast)"],["estar",ESTAR,"zijn (nu)"],["tener",TENER,"hebben"],
                    ["ir",IR,"gaan"],["ver",VER,"zien"]];
      const out = [];
      tabs.forEach(([naam,vormen,nl])=>{
        vormen.forEach((f,i)=>out.push({
          q:naam+" ("+nl+") — "+P6[i].p+" / "+P6[i].nl, a:f, accept:[f, P6[i].p+" "+f],
          pron:pronOf(f), note:"onregelmatig, dus uit je hoofd"
        }));
      });
      return out;
    }
    const groep = k==="ar" ? ["ar"] : ["er","ir"];
    const vs = R.pickN(VERBS.filter(v=>groep.indexOf(v.g)>=0), 4);
    const out = [];
    vs.forEach(v=>{
      for(let i=0;i<6;i++) out.push({
        q:v.es+" ("+v.nl+") — "+P6[i].p+" / "+P6[i].nl, a:conj(v,i), accept:[conj(v,i), P6[i].p+" "+conj(v,i)],
        pron:pronOf(conj(v,i)), note:"stam "+v.es.slice(0,-2)+" plus -"+ENDINGS[v.g][i]
      });
    });
    return out;
  }
  if(kind==="z"){
    const out = [];
    PHRASES[k].groups.forEach(g=>g.items.forEach(it=>out.push({
      q:it[1], a:it[0], accept:[it[0], it[0].replace(/[¿?¡!.,]/g,"").trim()],
      pron:pronOf(it[0]), note:it[2]||""
    })));
    return out;
  }
  if(kind==="n"){
    return NUMS.map(n=>({q:"het getal "+n[0], a:n[1], accept:[n[1]], pron:pronOf(n[1]), note:""}));
  }
  return [];
}

function startDrill(key, title, topic){
  DRILL.key = key; DRILL.title = title; DRILL.topic = topic || null;
  DRILL.items = R.shuffle(drillItems(key)).map(x=>Object.assign({}, x, {hit:0}));
  DRILL.i = 0; DRILL.hits = 0; DRILL.tries = 0; DRILL.misses = {}; DRILL.checked = false;
  DRILL.stage = "list";
  renderDrill();
}

function drillTotal(){ return DRILL.items.length * DRILL.need; }
function drillDone(){ return DRILL.items.reduce((a,x)=>a+Math.min(x.hit, DRILL.need), 0); }

function renderDrill(){
  const box = $("#sc-practice");
  if(DRILL.stage==="pick") return renderDrillPick();
  if(DRILL.stage==="list") return renderDrillList();
  if(DRILL.stage==="run")  return renderDrillRun();
  if(DRILL.stage==="done") return renderDrillDone();
}

function renderDrillRun(){
  const it = DRILL.items[DRILL.i];
  if(!it){ DRILL.stage="done"; return renderDrill(); }
  const pct = Math.round(drillDone()/drillTotal()*100);
  let h = '<div class="runner stack-20">';
  h += '<div class="run-head"><button class="icon-btn" data-drillexit="1" aria-label="Stoppen">✕</button>'
    + '<div style="flex:1"><div class="bar"><div class="bar-fill verde" style="width:'+pct+'%"></div></div></div>'
    + '<div class="streak-pill mono">'+drillDone()+' / '+drillTotal()+'</div></div>';
  h += '<div class="row"><span class="q-kind">Uitschrijven</span><span class="tiny dim">'+DRILL.title+'</span>'
    + '<span class="spacer"></span><span class="tiny dim mono">woord '+(DRILL.i+1)+' van '+DRILL.items.length+'</span></div>';
  h += '<div class="stack-14"><div class="q-text">Schrijf dit in het Spaans</div>';
  h += '<div class="q-sent">'+(it.emoji?'<div style="font-size:46px;line-height:1;margin-bottom:6px">'+it.emoji+'</div>':'')
    + '<div>'+it.q+'</div></div>';
  h += '<div class="row" style="gap:6px">'
    + Array.from({length:DRILL.need}, (_,n)=>'<span class="tag '+(n<it.hit?"tag-verde":"tag-line")+'">'+(n<it.hit?"✓":"○")+'</span>').join("")
    + '<span class="tiny dim">'+it.hit+' van '+DRILL.need+' goed</span></div>';

  if(!DRILL.checked){
    h += '<input class="inp" id="dans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ het Spaanse woord">'
      + '<div class="accents">'+["á","é","í","ó","ú","ñ","¿","¡"].map(c=>'<button data-dacc="'+c+'">'+c+'</button>').join("")+'</div>'
      + '<button class="btn btn-primary btn-wide" data-drillcheck="1">Controleer</button>';
  } else {
    h += '<div class="fb '+(DRILL.wasOk?"ok":"no")+'"><div class="fb-top">'+(DRILL.wasOk?"✅ Goed":"❌ Niet goed")+'</div>'
      + '<div class="fb-body"><div class="fb-blk"><div class="fb-lab">Het juiste antwoord</div>'
      + '<div class="row"><div class="fb-txt"><b>'+it.a+'</b></div>'+spk(it.a)+'</div>'
      + '<div class="vpron">'+(it.pron||"")+'</div></div>'
      + (it.note?'<div class="fb-blk"><div class="fb-lab">Onthoud</div><div class="fb-txt">'+it.note+'</div></div>':'')
      + (!DRILL.wasOk?'<div class="fb-blk"><div class="fb-txt tiny">De teller voor dit woord begint opnieuw. Schrijf hem nog een keer.</div></div>':'')
      + '<button class="btn '+(DRILL.wasOk?"btn-primary":"btn-saffron")+' btn-wide" data-drillnext="1">Verder</button></div></div>';
  }
  h += '</div></div>';
  $("#sc-practice").innerHTML = h;
  const inp = $("#dans"); if(inp) setTimeout(()=>inp.focus(), 60);
}

function drillCheck(){
  const it = DRILL.items[DRILL.i]; if(!it || DRILL.checked) return;
  const inp = $("#dans"); const given = inp ? inp.value.trim() : "";
  const ok = (it.accept||[it.a]).some(a=>sameLoose(a, given));
  DRILL.checked = true; DRILL.wasOk = ok; DRILL.tries++;
  if(ok){
    it.hit++;
    addXp(1);
    if(it.hit >= DRILL.need){
      addXp(3);
      if(DRILL.topic && S.t[DRILL.topic]) bump(DRILL.topic, true);
    }
  } else {
    it.hit = 0;
    DRILL.misses[it.a] = (DRILL.misses[it.a]||0)+1;
    if(DRILL.topic && S.t[DRILL.topic]) bump(DRILL.topic, false);
  }
  paintTop(); save();
  renderDrillRun();
}

function drillNext(){
  const it = DRILL.items[DRILL.i];
  DRILL.checked = false;
  if(it && it.hit >= DRILL.need){
    /* dit woord zit erin, door naar het volgende dat nog niet af is */
    let n = DRILL.i;
    for(let k=1;k<=DRILL.items.length;k++){
      const j = (DRILL.i + k) % DRILL.items.length;
      if(DRILL.items[j].hit < DRILL.need){ n = j; break; }
      if(k===DRILL.items.length){ DRILL.stage = "done"; return renderDrill(); }
    }
    if(DRILL.items.every(x=>x.hit>=DRILL.need)){ DRILL.stage="done"; return renderDrill(); }
    DRILL.i = n;
  }
  renderDrillRun();
}

function renderDrillDone(){
  const hard = Object.keys(DRILL.misses).sort((a,b)=>DRILL.misses[b]-DRILL.misses[a]).slice(0,6);
  const perfect = hard.length===0;
  shards(perfect?60:30);
  addXp(20);
  save();
  let h = '<div class="runner stack-20 center">'
    + '<div class="card pad stack-14"><div class="h-xl">'+(perfect?"Foutloos!":"Lijst uitgeschreven")+'</div>'
    + '<div class="stat-n" style="font-size:44px;color:var(--verde)">'+DRILL.items.length+'</div>'
    + '<div class="prose" style="font-size:16px">'+DRILL.items.length+' stuks, elk '+DRILL.need+' keer goed geschreven. '
    + (perfect ? "Zonder één fout. Dat is knap." : "Je typte in totaal "+DRILL.tries+" keer.")+'</div></div>';
  if(hard.length){
    h += '<div class="card pad" style="text-align:left"><div class="eyebrow" style="margin-bottom:8px">Deze kostten de meeste moeite</div><div class="stack-6">'
      + hard.map(a=>'<div class="row"><span class="es" style="font-weight:700">'+a+'</span>'+spk(a)
        + '<span class="spacer"></span><span class="tiny dim">'+DRILL.misses[a]+'x fout</span></div>').join("")
      + '</div></div>';
  }
  h += '<div class="row" style="justify-content:center"><button class="btn btn-primary" data-drillagain="1">Nog een keer</button>'
    + '<button class="btn" data-drillpick="1">Andere lijst</button>'
    + '<button class="btn btn-ghost" data-drillexit="1">Klaar</button></div></div>';
  $("#sc-practice").innerHTML = h;
}
