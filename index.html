<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azulejo — Spaans leren, tegel voor tegel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F8; --bg2:#E2E9F5; --surface:#FFFFFF; --surface2:#F6F9FD;
  --ink:#101F35; --ink2:#3D4F6B; --ink3:#6B7C96;
  --line:#D6E0EF; --line2:#C3D2E8;
  --azul:#1D4FA8; --azul2:#2E6BD4; --azulsoft:#DCE7FA;
  --saffron:#C77E12; --saffron2:#E39B2B; --saffronsoft:#FBEBCF;
  --verde:#0F7A55; --verdesoft:#D6F0E3;
  --granada:#B72B41; --granadasoft:#FBDCE1;
  --shadow:0 1px 2px rgba(16,31,53,.06), 0 10px 26px -14px rgba(16,31,53,.28);
  --shadow-lift:0 2px 4px rgba(16,31,53,.08), 0 18px 40px -18px rgba(16,31,53,.34);
  --r:20px; --r-sm:12px; --r-pill:999px;
  --disp:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --prose:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html[data-theme="dark"]{
  --bg:#0A1421; --bg2:#0E1C2E; --surface:#13233A; --surface2:#1A2C46;
  --ink:#E9EFF8; --ink2:#B2C2D9; --ink3:#8497B2;
  --line:#24374E; --line2:#2E4462;
  --azul:#7DAEFF; --azul2:#9CC2FF; --azulsoft:#1A3057;
  --saffron:#F0B15E; --saffron2:#F7C67F; --saffronsoft:#3A2C13;
  --verde:#4DC48D; --verdesoft:#0F3328;
  --granada:#F4808F; --granadasoft:#3A1C24;
  --shadow:0 1px 2px rgba(0,0,0,.34), 0 12px 30px -16px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4), 0 22px 46px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--disp);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.02em;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--azul2);outline-offset:2px;border-radius:6px}

/* ---------- azulejo pattern ---------- */
.azulejo{
  background-color:var(--azulsoft);
  background-image:
    radial-gradient(circle at 0% 0%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 100% 0%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 0% 100%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 100% 100%, var(--azul) 15%, transparent 16%),
    radial-gradient(circle at 50% 50%, var(--saffron2) 9%, transparent 10%),
    radial-gradient(circle at 50% 0%, var(--azul2) 7%, transparent 8%),
    radial-gradient(circle at 0% 50%, var(--azul2) 7%, transparent 8%);
  background-size:30px 30px;
}

/* ---------- layout ---------- */
.app{max-width:1080px;margin:0 auto;padding:0 20px 132px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.brand-txt{min-width:0}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;white-space:nowrap;
}
.chip-num{font-family:var(--mono);font-weight:500}
.chip.saffron{background:var(--saffronsoft);border-color:transparent;color:var(--saffron)}
.icon-btn{
  width:38px;height:38px;flex:none;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;font-size:16px;
  transition:transform .16s, background .16s;
}
.icon-btn:hover{transform:translateY(-1px);background:var(--surface2)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px max(14px, env(safe-area-inset-left)) max(6px, env(safe-area-inset-bottom));
}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav-btn{
  padding:8px 2px 6px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink3);
  transition:color .16s, background .16s;
}
.nav-btn span{font-size:19px;line-height:1;filter:grayscale(1) opacity(.7);transition:filter .2s}
.nav-btn.on{color:var(--azul);background:var(--azulsoft)}
.nav-btn.on span{filter:none}

/* ---------- generic bits ---------- */
.screen{display:none;padding-top:22px;animation:fadein .28s ease both}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.h-xl{font-size:clamp(28px,5.2vw,40px);font-weight:800;letter-spacing:-.035em}
.h-lg{font-size:clamp(21px,3.4vw,26px);font-weight:800;letter-spacing:-.03em}
.h-md{font-size:17px;font-weight:700}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.mono{font-family:var(--mono)}
.center{text-align:center}
.stack-6>*+*{margin-top:6px}
.stack-10>*+*{margin-top:10px}
.stack-14>*+*{margin-top:14px}
.stack-20>*+*{margin-top:20px}
.stack-28>*+*{margin-top:28px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:22px}
.pad-sm{padding:15px}
.hr{height:1px;background:var(--line);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:var(--r-pill);
  font-weight:700;letter-spacing:-.01em;
  background:var(--surface);border:1px solid var(--line2);color:var(--ink);
  transition:transform .14s, box-shadow .14s, background .14s;
}
.btn:hover{transform:translateY(-1.5px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--azul);border-color:transparent;color:#fff}
html[data-theme="dark"] .btn-primary{color:#08131f}
.btn-primary:hover{background:var(--azul2)}
.btn-saffron{background:var(--saffron);border-color:transparent;color:#fff}
html[data-theme="dark"] .btn-saffron{color:#2a1c05}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:9px 16px;font-size:13.5px}
.btn-wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.bar{height:9px;border-radius:var(--r-pill);background:var(--bg2);overflow:hidden}
html[data-theme="dark"] .bar{background:#0A1524}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--azul);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-fill.verde{background:var(--verde)}
.bar-fill.saffron{background:var(--saffron)}

.tag{display:inline-block;padding:3px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;letter-spacing:.01em}
.tag-m{background:var(--azulsoft);color:var(--azul)}
.tag-f{background:var(--granadasoft);color:var(--granada)}
.tag-verde{background:var(--verdesoft);color:var(--verde)}
.tag-saffron{background:var(--saffronsoft);color:var(--saffron)}
.tag-line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink3)}

.speak{
  width:28px;height:28px;flex:none;border-radius:8px;
  background:var(--azulsoft);color:var(--azul);
  display:inline-grid;place-items:center;font-size:13px;vertical-align:middle;
  transition:transform .14s;
}
.speak:hover{transform:scale(1.08)}
.speak.playing{animation:pulse .7s ease infinite}
@keyframes pulse{50%{transform:scale(1.14)}}

/* ---------- tile wall ---------- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:13px}
.tile{
  position:relative;overflow:hidden;text-align:left;
  border-radius:16px;padding:14px;min-height:146px;
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.tile-pat{position:absolute;inset:0;opacity:.16;transition:opacity .3s}
.tile-body{position:relative;display:flex;flex-direction:column;gap:5px;height:100%}
.tile-ico{font-size:25px;line-height:1}
.tile-name{font-size:15.5px;font-weight:800;letter-spacing:-.025em}
.tile-meta{font-size:11.5px;color:var(--ink3);font-weight:600}
.tile-num{
  position:absolute;top:12px;right:13px;
  font-family:var(--mono);font-size:11px;color:var(--ink3);
}
.tile.glazed .tile-pat{opacity:.42}
.tile.glazed::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg, transparent 32%, rgba(255,255,255,.5) 47%, rgba(255,255,255,.06) 56%, transparent 70%);
}
html[data-theme="dark"] .tile.glazed::after{background:linear-gradient(118deg, transparent 34%, rgba(255,255,255,.16) 48%, transparent 66%)}
.tile.mastered{border-color:var(--saffron2);box-shadow:0 0 0 2px var(--saffronsoft), var(--shadow)}
.tile.locked{opacity:.5;filter:grayscale(.85)}
.tile-lock{position:absolute;top:11px;right:12px;font-size:13px}
.tile-bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:auto}
html[data-theme="dark"] .tile-bar{background:#0A1524}
.tile-bar i{display:block;height:100%;background:var(--verde);border-radius:99px}
@keyframes glaze{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
.glaze-sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);animation:glaze .9s ease}

/* ---------- lesson ---------- */
.prose{font-family:var(--prose);font-size:17.5px;line-height:1.68;color:var(--ink2)}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.lead{font-family:var(--prose);font-size:19.5px;line-height:1.6;color:var(--ink)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.sec-h .num{font-family:var(--mono);font-size:12px;color:var(--azul);flex:none}
.note{border-left:3px solid var(--saffron2);background:var(--saffronsoft);padding:13px 15px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.note-verde{border-left-color:var(--verde);background:var(--verdesoft)}
.note-granada{border-left-color:var(--granada);background:var(--granadasoft)}
.note-azul{border-left-color:var(--azul);background:var(--azulsoft)}

/* the 7-step example chain */
.ex{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.ex-top{padding:16px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.ex-es{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--azul)}
.ex-step{padding:14px 18px;border-top:1px solid var(--line)}
.ex-step:first-child{border-top:none}
.ex-lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.arrow{display:block;text-align:center;color:var(--line2);font-size:15px;line-height:1;padding:2px 0}
.w2w{display:flex;flex-wrap:wrap;gap:7px}
.w2w-i{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 11px;font-size:13.5px}
.w2w-es{font-weight:700}
.w2w-eq{color:var(--ink3);font-family:var(--mono);font-size:11px}
.ex-nl{font-family:var(--prose);font-size:17px;color:var(--ink)}
.ex-p{font-family:var(--prose);font-size:16px;line-height:1.62;color:var(--ink2)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 12px;border-bottom:1px solid var(--line2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl .es{font-weight:700;color:var(--azul)}
.tbl .pr{font-family:var(--mono);font-size:12.5px;color:var(--ink3)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}

/* ---------- exercise runner ---------- */
.runner{max-width:640px;margin:0 auto}
.run-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.q-kind{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--azul)}
.q-text{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.q-sent{
  font-family:var(--prose);font-size:24px;line-height:1.45;color:var(--ink);
  padding:18px;border-radius:var(--r-sm);background:var(--surface2);border:1px dashed var(--line2);
  text-align:center;
}
.q-blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--azul);color:var(--azul);font-weight:700}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  text-align:left;padding:14px 16px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--line);
  font-size:16px;font-weight:600;
  display:flex;align-items:center;gap:11px;
  transition:transform .12s, border-color .14s, background .14s;
}
.opt:hover{transform:translateY(-1.5px);border-color:var(--azul)}
.opt-key{
  width:24px;height:24px;flex:none;border-radius:7px;background:var(--bg2);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink3);
}
html[data-theme="dark"] .opt-key{background:#0A1524}
.opt.good{border-color:var(--verde);background:var(--verdesoft)}
.opt.good .opt-key{background:var(--verde);color:#fff}
.opt.bad{border-color:var(--granada);background:var(--granadasoft)}
.opt.bad .opt-key{background:var(--granada);color:#fff}
.opt.lock{pointer-events:none}
.opt.fade{opacity:.5}

.inp{
  width:100%;padding:15px 17px;border-radius:14px;
  background:var(--surface);border:1.5px solid var(--line2);
  font-size:18px;font-weight:600;outline:none;
}
.inp:focus{border-color:var(--azul)}
.accents{display:flex;flex-wrap:wrap;gap:5px}
.accents button{
  min-width:34px;padding:6px 8px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--line);
  font-size:15px;font-weight:600;
}
.accents button:hover{background:var(--azulsoft);border-color:var(--azul)}

.build-slot{
  min-height:60px;padding:11px;border-radius:14px;
  background:var(--surface2);border:1.5px dashed var(--line2);
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
}
.build-pool{display:flex;flex-wrap:wrap;gap:7px}
.word{
  padding:9px 14px;border-radius:var(--r-pill);
  background:var(--surface);border:1.5px solid var(--line2);
  font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line2);
  transition:transform .12s;
}
.word:hover{transform:translateY(-1.5px)}
.word.used{opacity:.28;pointer-events:none}
.build-hint{font-size:12.5px;color:var(--ink3)}

.fb{border-radius:var(--r);overflow:hidden;animation:pop .3s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.fb-top{padding:14px 18px;display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px}
.fb.ok .fb-top{background:var(--verde);color:#fff}
.fb.no .fb-top{background:var(--granada);color:#fff}
.fb-body{background:var(--surface);border:1px solid var(--line);border-top:none;padding:18px;display:grid;gap:14px}
.fb-blk{display:grid;gap:4px}
.fb-lab{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.fb-txt{font-family:var(--prose);font-size:16px;line-height:1.6;color:var(--ink2)}
.fb-txt b{color:var(--ink);font-weight:600}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .42s}

.streak-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--saffron);font-weight:500}

/* celebration: azulejo shards */
.shards{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.shard{position:absolute;width:11px;height:11px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{
  0%{transform:translate3d(0,-8vh,0) rotate(0);opacity:1}
  100%{transform:translate3d(var(--dx),104vh,0) rotate(var(--rot));opacity:.15}
}
.badge-pop{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;
  padding:22px 30px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-lift);
  border:1px solid var(--line);text-align:center;animation:badge .5s cubic-bezier(.2,.8,.3,1.3) both;
}
@keyframes badge{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ---------- words ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter{padding:8px 15px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:700;transition:background .14s}
.filter.on{background:var(--azul);border-color:transparent;color:#fff}
html[data-theme="dark"] .filter.on{color:#08131f}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.vtop{display:flex;align-items:flex-start;gap:10px}
.vemoji{font-size:27px;line-height:1;flex:none}
.ves{font-size:18px;font-weight:800;letter-spacing:-.025em}
.ves .art{color:var(--azul)}
.vnl{font-family:var(--prose);font-size:16px;color:var(--ink)}
.vpron{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.vex{font-family:var(--prose);font-size:14.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-top:11px}
.vex i{color:var(--azul);font-style:normal;font-weight:600}

/* ---------- stats ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat-n{font-family:var(--mono);font-size:27px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.stat-l{font-size:12px;font-weight:700;color:var(--ink3);margin-top:3px}
.blist{display:grid;gap:11px}
.brow{display:grid;grid-template-columns:1fr;gap:5px}
.brow-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:700}
.brow-pct{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3);font-weight:500}

/* ---------- games ---------- */
.flash{
  perspective:1400px;max-width:440px;margin:0 auto;
}
.flash-in{
  position:relative;height:250px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.8,.3,1);cursor:pointer;
}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  box-shadow:var(--shadow);display:grid;place-items:center;padding:24px;text-align:center;gap:8px;
}
.flash-back{transform:rotateY(180deg)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{
  aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:6px;
  font-size:13.5px;font-weight:700;text-align:center;line-height:1.2;
  transition:transform .16s, background .16s;
}
.mcard.hidden-face{color:transparent}
.mcard.hidden-face::after{content:"";position:absolute}
.mcard.pick{border-color:var(--azul);background:var(--azulsoft)}
.mcard.done{border-color:var(--verde);background:var(--verdesoft);opacity:.55;pointer-events:none}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.pick-card{
  text-align:left;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:4px;
  transition:transform .16s, box-shadow .16s;
}
.pick-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.pick-ico{font-size:22px}
.pick-t{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.pick-d{font-size:12.5px;color:var(--ink3);font-weight:600}

.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);z-index:150;
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:var(--shadow-lift);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flags{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex:none}
.flag{width:32px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
  opacity:.42;filter:grayscale(.7);transition:opacity .16s,filter .16s,background .16s}
.flag:hover{opacity:.8;filter:none}
.flag.on{opacity:1;filter:none;background:var(--azulsoft)}
@media (max-width:560px){ .flag{width:28px;height:26px;font-size:14px} }

.gl{border-bottom:1.5px dotted var(--line2);cursor:help;transition:color .12s,border-color .12s}
.gl:hover{border-bottom-color:var(--azul);color:var(--azul)}
.tip{position:fixed;z-index:140;max-width:270px;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;box-shadow:var(--shadow-lift);padding:13px 15px;pointer-events:none;
  opacity:0;transform:translateY(4px);transition:opacity .13s ease,transform .13s ease}
.tip.on{opacity:1;transform:none}
.tip-emo{font-size:24px;line-height:1;margin-bottom:5px}
.tip-es{font-size:16.5px;font-weight:800;letter-spacing:-.02em;color:var(--azul)}
.tip-nl{font-family:var(--prose);font-size:15.5px;color:var(--ink);margin-top:2px}
.tip-pr{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:4px}
.tip-ex{font-size:12px;color:var(--ink3);margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.hintbar{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 13px}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,20,33,.55);backdrop-filter:blur(5px);
  display:grid;place-items:center;padding:20px;animation:fadein .2s ease both}
.modal{max-width:430px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lift);padding:24px;animation:badge .35s cubic-bezier(.2,.8,.3,1.2) both}
.gate{position:fixed;inset:0;z-index:130;background:var(--bg);overflow:auto;padding:26px 20px}
.gate-in{max-width:420px;margin:5vh auto}
.acct{display:flex;align-items:center;gap:9px;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.acct-av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--azul);color:#fff;font-weight:800;font-size:14px}
html[data-theme="dark"] .acct-av{color:#08131f}
.tile.locked{opacity:.55;filter:grayscale(.8);cursor:pointer}
.tile.locked:hover{opacity:.75;transform:translateY(-3px)}

@media (max-width:560px){
  .app{padding:0 14px 128px}
  .topbar-in{padding:10px 14px;gap:9px}
  .brand-sub{display:none}
  .wall{grid-template-columns:repeat(2,1fr);gap:10px}
  .opts.two{grid-template-columns:1fr}
  .q-sent{font-size:20px;padding:15px}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .match-cols{gap:7px}
  .pad{padding:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- kleine hulpjes ---------- */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
/* bijvoeglijk naamwoord aanpassen aan geslacht en aantal */
function adjForm(w,gender,count){
  let base = w.es;
  const invariable = ["azul","verde","gris","marrón","rosa","naranja","grande","fácil","difícil",
    "joven","fuerte","caliente","triste","interesante","inteligente"];
  if(invariable.includes(base)){
    if(count>1){
      if(base==="azul") return "azules";
      if(base==="marrón") return "marrones";
      if(base==="gris") return "grises";
      if(base==="fácil") return "fáciles";
      if(base==="difícil") return "difíciles";
      if(base==="joven") return "jóvenes";
      return base+"s";
    }
    return base;
  }
  if(base.endsWith("o")) base = base.slice(0,-1) + (gender==="f" ? "a" : "o");
  return count>1 ? base+"s" : base;
}
function pluralOf(w){ return w.pl; }
function artSing(w){ return w.art; }
function artPlur(w){ return w.g==="f" ? "las" : "los"; }
function indefSing(w){ return w.g==="f" ? (w.art==="el" ? "un" : "una") : "un"; }

{h:"Waarom je de stam nodig hebt",p:[
"Bij vervoegen haal je de uitgang eraf en zet je er een ander staartje op.",
"cantar wordt cant, en daar plak je -o achter: <b>canto</b> (ik zing).",
"comer wordt com, en daar plak je -o achter: <b>como</b> (ik eet).",
"De stam blijft dus staan, alleen het staartje verandert. Daarom is de stam het vaste deel en de uitgang het losse deel."]},
{h:"Drie groepen, drie sets staartjes",p:[
"Waarom zijn er drie groepen? Omdat elke groep zijn eigen staartjes heeft.",
"De klinker van de uitgang komt terug in de staartjes. Bij cant<b>ar</b> hoort cant<b>amos</b>, bij com<b>er</b> hoort com<b>emos</b>.",
"Daarom moet je altijd eerst kijken welke groep het is. Dat is de eerste vraag, nog voor je gaat vervoegen.",
"Groep herkennen kost een halve seconde: kijk naar de laatste twee letters."]},
{h:"Regelmatig of niet",p:[
"Een werkwoord is <b>regelmatig</b> als de stam niet verandert bij het vervoegen.",
"hablar wordt hablo, hablas, habla. De stam habl blijft steeds gelijk. Regelmatig dus.",
"poder wordt puedo. De stam pod verandert in pued. Dat is <b>niet</b> regelmatig.",
"Zulke werkwoorden noemen we stamveranderend. Je herkent ze doordat er een letter bij komt of verandert in het midden: e wordt ie, o wordt ue.",
"De uitgangen blijven wel gewoon dezelfde. Alleen de stam doet iets geks. Dat is minder erg dan het klinkt."]}
],

secs:[
{h:"De staartjes van -er",p:[

"Dus: <b>-o, -es, -e, -emos, -éis, -en</b>.",
"Vergelijk met -ar: daar stond een a waar hier een e staat. Dat is het enige verschil."]},
{h:"De staartjes van -ir",p:[

"Dus: <b>-o, -es, -e, -imos, -ís, -en</b>.",
"Kijk goed: vier van de zes zijn precies gelijk aan -er. Alleen bij wij en jullie is er een i in plaats van een e.",
"Je leert dus eigenlijk maar twee nieuwe vormen."]},
{h:"Alle drie naast elkaar",p:[

"Bij <b>tú</b>: -as bij ar, -es bij er en ir.",
"Bij <b>nosotros</b>: -amos, -emos, -imos. De klinker van de groep komt terug.",
"Het patroon is dus: de klinker van het werkwoord zit in het staartje."]},

LESSONS.presente = {
lead:"Je kunt nu vervoegen. Maar wanneer gebruik je die tegenwoordige tijd eigenlijk? Het antwoord is fijn: <b>veel vaker dan je denkt</b>. Eén Spaanse vorm dekt twee Nederlandse zinnen.",
why:"Nederlandstaligen bouwen hier bijna altijd te ingewikkelde zinnen. Ze zoeken naar een vertaling voor <i>aan het</i> en komen uit bij estoy cantando, terwijl canto genoeg is. Als je dit hoofdstuk snapt, worden je zinnen korter en meteen een stuk beter.",
secs:[
{h:"Eén Spaanse vorm, twee Nederlandse zinnen",p:[
"<b>Canto.</b> Dat betekent <b>ik zing</b>.",
"Maar het betekent óók <b>ik ben aan het zingen</b>.",
"Spaans maakt dat onderscheid niet. Eén vorm doet allebei.",
"Dus als je in het Nederlands <i>aan het</i> zegt, hoef je in het Spaans meestal niets extra's te doen. Gewoon de normale vorm."]},
{h:"Wanneer dan wel estoy cantando?",p:[
"Er bestaat wel een vorm voor <i>aan het</i>: <b>estar</b> plus het werkwoord met -ando of -iendo. Estoy cantando.",
"Maar die gebruik je alleen als je nadruk wilt leggen op <b>precies nu, op dit moment</b>.",
"Iemand belt en vraagt wat je doet: <b>Estoy comiendo.</b> (Ik ben nu aan het eten.) Dat is goed gebruikt.",
"Vertel je dat je elke dag om twee uur eet: <b>Como a las dos.</b> Niet estoy comiendo, want het gaat niet over dit moment.",
"Vuistregel: als je het woord <b>nu</b> erbij kunt zetten, mag estar plus -ando. Anders gewoon de normale vorm."]},
{h:"Hoe je de -ando vorm maakt",p:[
"Neem de stam en plak er een staartje aan.",
"Bij <b>-ar</b> werkwoorden: <b>-ando</b>. cantar wordt cant<b>ando</b>.",
"Bij <b>-er</b> en <b>-ir</b> werkwoorden: <b>-iendo</b>. comer wordt com<b>iendo</b>, vivir wordt viv<b>iendo</b>.",
"Twee groepen, twee staartjes. Simpeler dan het vervoegen zelf."]},
{h:"Gewoontes: wat je altijd doet",p:[
"De normale tegenwoordige tijd gebruik je ook voor dingen die je regelmatig doet.",
"<b>Canto los domingos.</b> = Ik zing op zondag. Let op dat kleine <b>los</b>: dat maakt er <i>elke zondag</i> van.",
"Zonder los zou je één specifieke zondag bedoelen. Met los bedoel je alle zondagen.",
"Andere woorden die bij gewoontes horen: <b>todos los días</b> (elke dag), <b>siempre</b> (altijd), <b>nunca</b> (nooit), <b>a veces</b> (soms), <b>normalmente</b> (meestal)."]},
{h:"En zelfs voor morgen",p:[
"Spaans gebruikt de tegenwoordige tijd ook voor iets wat binnenkort gebeurt, als het vaststaat.",
"<b>Mañana trabajo.</b> = Morgen werk ik.",
"<b>El lunes viajo a Madrid.</b> = Maandag reis ik naar Madrid.",
"Nederlands doet dit ook: wij zeggen ook <i>morgen werk ik</i> en niet per se <i>morgen zal ik werken</i>. Dus dit voelt meteen goed."]},
{h:"Vragen stellen: twee volgordes mogen allebei",p:[
"Je kunt de persoon vóór of achter het werkwoord zetten. Allebei is goed Spaans.",
"<b>¿Cantas tú los domingos?</b> en <b>¿Tú cantas los domingos?</b> betekenen hetzelfde.",
"Sterker nog: je mag het woordje tú gewoon weglaten. <b>¿Cantas los domingos?</b> is het meest gebruikt.",
"Het enige wat je écht nodig hebt is het omgekeerde vraagteken aan het begin en je stem omhoog aan het eind.",
"Wat <b>niet</b> mag: het werkwoord in de basisvorm laten staan. ¿Tú cantar? bestaat niet."]}
],

LESSONS.usted = {
lead:"Spaans heeft twee manieren om <b>u</b> of <b>jij</b> te zeggen. <b>tú</b> als je iemand tutoyeert, <b>usted</b> als je beleefd wilt zijn. En in het meervoud: <b>vosotros</b> en <b>ustedes</b>.",

   3. GENERATOR — kern + hulpjes
   Elke oefening wordt vers gemaakt. Niets is vastgezet.
   ============================================================ */
const R = {
  int:n => Math.floor(Math.random()*n),
  pick(a){ return a[Math.floor(Math.random()*a.length)]; },
  shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; },
  pickN(a,n){ return R.shuffle(a).slice(0,n); },
  chance(p){ return Math.random()<p; }
};

function norm(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:]/g,"")
    .replace(/\s+/g," ").trim();
}
function sameLoose(a,b){ return norm(a)===norm(b); }

/* uitleg waarom een woord mannelijk of vrouwelijk is */
const GEX = {
  "agua":"agua is vrouwelijk, maar krijgt el omdat la agua lelijk klinkt met twee a-klanken achter elkaar. Het beschrijvende woord blijft wel vrouwelijk.",
  "problema":"problema eindigt op -a maar is mannelijk. Woorden op -ma zijn dat vaak. Uitzondering om te onthouden.",
  "día":"día eindigt op -a maar is mannelijk. Een van de bekendste uitzonderingen.",
  "mapa":"mapa eindigt op -a maar is mannelijk. Onthoud el mapa samen met el día.",
  "mano":"mano eindigt op -o maar is vrouwelijk. La mano is de uitzondering die je moet kennen.",
  "sofá":"sofá eindigt op -á maar is mannelijk. Woorden met de klemtoon op de laatste a zijn vaak mannelijk."
};
function genderReason(w){
  if(GEX[w.es]) return GEX[w.es];
  const e = w.es;
  if(e.endsWith("ción")||e.endsWith("sión")) return e+" eindigt op -ción, en die woorden zijn altijd vrouwelijk.";
  if(e.endsWith("dad")||e.endsWith("tad")) return e+" eindigt op -dad, en die woorden zijn altijd vrouwelijk.";
  if(e.endsWith("aje")) return e+" eindigt op -aje, en die woorden zijn mannelijk.";
  if(e.endsWith("o")) return e+" eindigt op een -o. Woorden op -o zijn mannelijk.";
  if(e.endsWith("a")) return e+" eindigt op een -a. Woorden op -a zijn vrouwelijk.";
  return e+" eindigt niet op -o of -a, dus je kunt het niet zien aan het woord. Zulke woorden leer je altijd met het lidwoord erbij: "+w.art+" "+e+".";
}
function pluralReason(w){
  const e=w.es;
  if(e.endsWith("z")) return e+" eindigt op een -z. Dan wordt de z een c en komt er -es achter: "+w.pl+".";
  if(/[aeiouáéíóú]$/.test(e)) return e+" eindigt op een klinker. Dan komt er alleen een -s achter: "+w.pl+".";
  return e+" eindigt op een consonant. Dan komt er -es achter: "+w.pl+".";
}

/* het bouwen van oefeningen */
function ex(o){
  if(!o.kind) o.kind = ({mc:"Meerkeuze",input:"Vul in",build:"Zin bouwen",order:"Zet in de juiste orde",
    listen:"Luisteren",picture:"Wat zie je?",match:"Woorden koppelen"})[o.type] || "Oefening";
  if(o.type==="input" && !o.accept) o.accept=[o.answer];
  if(o.options){
    const gezien = {}; const uniek = [];
    o.options.map(String).forEach(x=>{ const k=x.toLowerCase().trim(); if(!gezien[k]){ gezien[k]=1; uniek.push(x); } });
    o.options = R.shuffle(uniek);
  }
  return o;
}

/* register: GEN[topic] = [functies], elke functie heeft .rule */
const GEN = {};
function reg(topic, rule, fn){
  fn.rule = topic+"."+rule;
  (GEN[topic] = GEN[topic] || []).push(fn);
}
function makeExercise(topic, rule){
  const pool = GEN[topic] || [];
  if(!pool.length) return null;
  const list = rule ? pool.filter(f=>f.rule===rule) : pool;
  const fn = R.pick(list.length ? list : pool);
  const e = fn();
  e.topic = topic; e.rule = fn.rule;
  return ex(e);
}

const KLAAR_EN = "*";
const isKlaarEn = id => KLAAR_EN === "*" || KLAAR_EN.indexOf(id) >= 0;

function genderReasonL(w){
  if(LANG !== "en") return genderReason(w);
  const e = w.es;
  const EX = {
    "agua":"agua is feminine, but takes el because la agua sounds clumsy with two a-sounds in a row. The adjective stays feminine.",
    "problema":"problema ends in -a but is masculine. Words ending in -ma often are. One to remember.",
    "día":"día ends in -a but is masculine. One of the best known exceptions.",
    "mapa":"mapa ends in -a but is masculine. Remember it together with el día.",
    "mano":"mano ends in -o but is feminine. La mano is the exception you have to know.",
    "sofá":"sofá ends in -á but is masculine. Words stressed on a final a are often masculine."
  };
  if(EX[e]) return EX[e];
  if(e.endsWith("ción")||e.endsWith("sión")) return e+" ends in -ción, and those words are always feminine.";
  if(e.endsWith("dad")||e.endsWith("tad")) return e+" ends in -dad, and those words are always feminine.";
  if(e.endsWith("aje")) return e+" ends in -aje, so it is masculine.";
  if(e.endsWith("o")) return e+" ends in -o. Words ending in -o are masculine.";
  if(e.endsWith("a")) return e+" ends in -a. Words ending in -a are feminine.";
  return e+" does not end in -o or -a, so you cannot tell from the word itself. Always learn these with the article: "+w.art+" "+e+".";
}
function pluralReasonL(w){
  if(LANG !== "en") return pluralReason(w);
  const e = w.es;
  if(e.endsWith("z")) return e+" ends in -z. The z becomes a c and you add -es: "+w.pl+".";
  if(/[aeiouáéíóú]$/.test(e)) return e+" ends in a vowel, so you just add -s: "+w.pl+".";
  return e+" ends in a consonant, so you add -es: "+w.pl+".";
}

reg("tener","uitdrukking",()=>{

    ? [["hambre","hungry"],["sed","thirsty"],["frío","cold"],["calor","hot"],["sueño","sleepy"],["miedo","scared"],["prisa","in a hurry"],["razón","right"]]
    : [["hambre","honger"],["sed","dorst"],["frío","het koud"],["calor","het warm"],["sueño","slaap"],["miedo","angst"],["prisa","haast"],["razón","gelijk"]];
  const e = R.pick(exp), i = R.pick([0,1,2,3]), pr = P6[i], form = TENER[i];
  return {type:"input", prompt:L("Vertaal naar het Spaans.","Translate into Spanish."),
    sentence:L(cap(pr.nl)+" heb "+e[1]+".", cap(pronNaam(i))+" "+(i===0?"am":i===2?"is":"are")+" "+e[1]+"."),
    showEs:form+" "+e[0]+".", answer:form+" "+e[0]+".",
    accept:[form+" "+e[0], form+" "+e[0]+".", pr.p+" "+form+" "+e[0]],
    why:L("In het Spaans <b>heb</b> je "+e[1]+". Dus tener plus "+e[0]+".",
      "In Spanish this is something you <b>have</b>, not something you are. English says I am hungry; Spanish says tengo hambre, literally I have hunger. Same pattern for cold, thirst, sleep and being in a hurry."),
    wrongWhy:{},
    ruleName:L("tener plus honger, dorst, kou, haast","tener plus hunger, thirst, cold, hurry"),
    mistake:L("estar of ser gebruiken.","Using ser or estar because English uses am. These expressions always take tener."),
    trick:L("Nederlands zegt ook ik heb honger.","Picture it as owning the feeling: I have hunger, I have cold, I have hurry.")};
});
reg("tener","que",()=>{
  const v = R.pick(VERBS), i = R.pick([0,1,3]), pr = P6[i], form = TENER[i];
  return {type:"mc", prompt:L("Hoe zeg je: "+pr.nl+" moet "+v.nl+"?",
                              "How do you say: "+pronNaam(i)+" "+(i===2?"has":"have")+" to "+verbBetekenis(v).replace(/^to /,"")+"?"),
    sentence:L(pr.nl+" moet "+v.nl+".", cap(pronNaam(i))+" must "+verbBetekenis(v).replace(/^to /,"")+"."),
    showEs:form+" que "+v.es+".",
    options:[form+" que "+v.es, form+" "+v.es, form+" que "+conj(v,i===3?3:i), "debo "+v.es],
    answer:form+" que "+v.es,
    why:L("Moeten zeg je met tener plus que plus de basisvorm.",
      "Must is tener plus que plus the plain verb. Literally: I have that to work. The que is not optional."),
    wrongWhy:{[form+" "+v.es]:L("que ontbreekt.","que is missing. Without it the sentence means something else."),
      [form+" que "+conj(v,i===3?3:i)]:L("Het tweede werkwoord mag niet vervoegd worden.","The second verb must stay in its plain form. Only tener changes."),
      ["debo "+v.es]:L("deber betekent ook moeten, maar dan als plicht.","deber also means must, but as a duty or moral obligation. For everyday must, use tener que.")},
    ruleName:L("tener que plus basisvorm","tener que plus the plain verb"),
    mistake:L("que weglaten of het tweede werkwoord ook vervoegen.","Dropping que, or conjugating the second verb too."),
    trick:L("tener + que + basisvorm.","tener + que + plain verb. Three blocks, always that order.")};
});

/* ---------- GETALLEN ---------- */
reg("numbers","naarwoord",()=>{
  const n = R.pick(NUMS);
  const wrongs = R.pickN(NUMS.filter(x=>x[0]!==n[0]),3).map(x=>x[1]);
  return {type:"mc", prompt:L("Hoe schrijf je dit getal in het Spaans?","How do you write this number in Spanish?"),
    sentence:String(n[0]), showEs:n[1], options:[n[1]].concat(wrongs), answer:n[1],
    why:L(n[0]+" is "+n[1]+" in het Spaans.", n[0]+" is "+n[1]+" in Spanish.")
      + (n[0]>30 && n[0]%10!==0 ? L(" Vanaf 31 komt er een y tussen."," From 31 up you put y between the tens and the unit, just like English uses a hyphen in thirty-two.") : "")
      + (n[0]>20 && n[0]<30 ? L(" Bij de twintigers plak je alles aan elkaar."," The twenties are written as one word, with no y.") : ""),
    wrongWhy:wrongs.reduce((o,x)=>{const m=NUMS.find(y=>y[1]===x); o[x]=L(x+" betekent "+m[0]+".", x+" means "+m[0]+"."); return o;},{}),
    ruleName:L("De getallen tot honderd","Numbers up to a hundred"),
    mistake:L("De Nederlandse volgorde gebruiken.","Splitting the twenties into two words. veintiuno is one word."),
    trick:L("Groot getal eerst, dan y, dan het kleine getal.","Big number first, then y, then the small one. Same order as English.")};
});
reg("numbers","naarcijfer",()=>{
  const n = R.pick(NUMS);
  return {type:"input", prompt:L("Welk getal is dit? Schrijf het als cijfer.","Which number is this? Write it as digits."),
    sentence:n[1], showEs:n[1], answer:String(n[0]), accept:[String(n[0])],
    why:L(n[1]+" betekent "+n[0]+".", n[1]+" means "+n[0]+".")
      + (n[1].includes(" y ") ? L(" y betekent en: tiental plus getal."," y means and: add the tens and the unit together.") : ""),
    wrongWhy:{},
    ruleName:L("Spaanse getallen herkennen","Recognising Spanish numbers"),
    mistake:L("veinte en veintiuno door elkaar halen.","Mixing up veinte and veintiuno."),
    trick:L("Hoor je y? Dan tel je de twee delen op.","Hear a y? Then add the two parts together.")};
});
reg("numbers","rekenen",()=>{
  const a = 1+R.int(12), b = 1+R.int(12), s = a+b;
  const sw = NUMS.find(x=>x[0]===s) || [s,String(s)];
  const wrongs = R.pickN(NUMS.filter(x=>x[0]!==s && x[0]<=24),3).map(x=>x[1]);
  return {type:"mc", prompt:L("Reken uit en kies het Spaanse woord.","Work it out and pick the Spanish word."),
    sentence:(NUMS.find(x=>x[0]===a)[1])+" + "+(NUMS.find(x=>x[0]===b)[1])+" = ?",
    showEs:sw[1], options:[sw[1]].concat(wrongs), answer:sw[1],
    why:L(a+" plus "+b+" is "+s+", en dat is "+sw[1]+".", a+" plus "+b+" is "+s+", which is "+sw[1]+" in Spanish."),
    wrongWhy:wrongs.reduce((o,x)=>{const m=NUMS.find(y=>y[1]===x); o[x]=L(x+" is "+m[0]+".", x+" is "+m[0]+", not "+s+"."); return o;},{}),
    ruleName:L("Getallen herkennen en gebruiken","Recognising and using numbers"),
    mistake:L("Het getal goed uitrekenen maar het Spaanse woord verkeerd kiezen.","Doing the sum right but picking the wrong Spanish word."),
    trick:L("Reken eerst in cijfers, zoek dan het woord.","Do the sum in digits first, then find the word.")};
});
reg("numbers","leeftijdvraag",()=>{
  const n = 6+R.int(70);
  const word = NUMS.find(x=>x[0]===n);
  const num = word ? word[1] : (NUMS.find(x=>x[0]===Math.floor(n/10)*10)[1]+" y "+NUMS.find(x=>x[0]===n%10)[1]);
  return {type:"input", prompt:L("Iemand vraagt: ¿Cuántos años tienes? Antwoord dat je "+n+" jaar bent, met woorden.",
                                 "Someone asks: ¿Cuántos años tienes? Answer that you are "+n+", in words."),
    sentence:"¿Cuántos años tienes?", showEs:"Tengo "+num+" años.",
    answer:"Tengo "+num+" años.", accept:["Tengo "+num+" años","Tengo "+num+" años.",num+" años"],
    why:L("Leeftijd gaat met tener plus getal plus años.","Age is tener plus the number plus años. "+n+" is "+num+"."),
    wrongWhy:{},
    ruleName:L("Leeftijd zeggen met woorden","Saying your age in words"),
    mistake:L("años vergeten, of ser gebruiken.","Forgetting años, or using ser like English I am."),
    trick:L("Tengo ... años. Altijd dat vaste patroon.","Tengo ... años. Always that fixed pattern.")};
});

/* ---------- GUSTAR ---------- */
const GUST_WHO = [["me","ik","mij","I","me"],["te","jij","jou","you","you"],
  ["le","hij of zij","hem of haar","he or she","him or her"],["nos","wij","ons","we","us"],
  ["les","zij","hen","they","them"]];
const whoSub = x => LANG==="en" ? x[3] : x[1];
const whoObj = x => LANG==="en" ? x[4] : x[2];

reg("gustar","aantal",()=>{
  const w = R.pick(NOUNS), who = R.pick(GUST_WHO), plural = R.chance(.5);
  const form = plural ? "gustan" : "gusta";
  const thing = plural ? artPlur(w)+" "+w.pl : w.art+" "+w.es;
  return {type:"mc", prompt:L("Vul in: gusta of gustan?","Fill in: gusta or gustan?"),
    sentence:cap(who[0])+" ___ "+thing+".", showEs:cap(who[0])+" "+form+" "+thing+".",
    options:["gusta","gustan"], answer:form, word:w.key,
    why:L("Kijk naar het ding, niet naar de persoon. "+thing+" is "+(plural?"meervoud":"enkelvoud")+", dus "+form+
        ". Letterlijk: "+thing+" "+(plural?"bevallen":"bevalt")+" "+whoObj(who)+".",
      "Look at the thing, not at the person. "+thing+" is "+(plural?"plural":"singular")+", so "+form+
        ". Literally it means "+thing+" "+(plural?"are":"is")+" pleasing to "+whoObj(who)+"."),
    wrongWhy:{[plural?"gusta":"gustan"]:L(plural?"gusta hoort bij één ding.":"gustan hoort bij meer dingen.",
      plural?"gusta goes with one thing. Here there are several.":"gustan goes with several things. Here there is one.")},
    ruleName:L("gusta of gustan hangt af van het ding","gusta or gustan depends on the thing, not on you"),
    mistake:L("Naar jezelf kijken in plaats van naar het ding.","Looking at yourself instead of at the thing."),
    trick:L("Vertaal met bevallen.","Translate it as is pleasing to me. Then the ending lands in the right place.")};
});
reg("gustar","wie",()=>{
  const who = R.pick(GUST_WHO), w = R.pick(NOUNS);
  return {type:"mc", prompt:L("Hoe zeg je: "+who[1]+" vindt "+w.nl+" leuk?",
                              "How do you say: "+whoSub(who)+" like "+betekenis(w)+"?"),
    sentence:"___ gusta "+w.art+" "+w.es+".", showEs:who[0]+" gusta "+w.art+" "+w.es+".",
    options:GUST_WHO.map(x=>x[0]), answer:who[0], word:w.key,
    why:L(who[0]+" betekent "+who[2]+".", who[0]+" means to "+whoObj(who)+". The whole sentence literally says: the "+betekenis(w)+" is pleasing to "+whoObj(who)+"."),
    wrongWhy:GUST_WHO.reduce((o,x)=>{ if(x[0]!==who[0]) o[x[0]]=L(x[0]+" betekent "+x[2]+".", x[0]+" means to "+whoObj(x)+"."); return o; },{}),
    ruleName:L("me, te, le, nos, les: wie vindt het leuk","me, te, le, nos, les: who is doing the liking"),
    mistake:L("yo gusto zeggen.","Saying yo gusto. That means other people find you attractive."),
    trick:L("Het woordje staat altijd vooraan.","The little word always comes first, before gusta.")};
});
reg("gustar","werkwoord",()=>{
  const v = R.pick(VERBS), who = R.pick(GUST_WHO);
  return {type:"mc", prompt:L("Vul in: gusta of gustan?","Fill in: gusta or gustan?"),
    sentence:cap(who[0])+" ___ "+v.es+".", showEs:cap(who[0])+" gusta "+v.es+".",
    options:["gusta","gustan"], answer:"gusta",
    why:L("Er staat een werkwoord na gusta. Bij een werkwoord is het altijd gusta.",
      "There is a verb after gusta ("+v.es+" = "+verbBetekenis(v)+"). With a verb it is always gusta, even if you list several activities."),
    wrongWhy:{"gustan":L("gustan hoort bij meer dingen.","gustan is for several things. A verb always counts as one.")},
    ruleName:L("Bij een werkwoord altijd gusta","With a verb it is always gusta"),
    mistake:L("gustan gebruiken omdat er meerdere activiteiten staan.","Using gustan because several activities are listed."),
    trick:L("Werkwoord erna? Altijd gusta.","Verb after it? Always gusta, no -n.")};
});
reg("gustar","nl2es",()=>{
  const w = R.pick(NOUNS), plural = R.chance(.5), neg = R.chance(.35);
  const thing = plural ? artPlur(w)+" "+w.pl : w.art+" "+w.es;
  const es = (neg?"No me ":"Me ")+(plural?"gustan":"gusta")+" "+thing+".";
  const nl = L("Ik vind "+(plural?w.pl:w.nl)+" "+(neg?"niet ":"")+"leuk.",
               "I "+(neg?"do not like ":"like ")+betekenis(w)+".");
  return {type:"input", prompt:L("Vertaal naar het Spaans.","Translate into Spanish."),
    sentence:nl, showEs:es, answer:es, accept:[es, es.replace(".","")], word:w.key,
    why:L((neg?"no komt helemaal vooraan, voor me. ":"")+"Het ding is "+(plural?"meervoud, dus gustan":"enkelvoud, dus gusta")+".",
      (neg?"no goes right at the front, before me. ":"")+"The thing is "+(plural?"plural, so gustan":"singular, so gusta")+
      ". And keep the article: Spanish says me gustan los gatos, never me gustan gatos."),
    wrongWhy:{},
    ruleName:L("De hele gustar-zin bouwen","Building a full gustar sentence"),
    mistake:L("no ertussen zetten, of het lidwoord weglaten.","Putting no in the middle, or dropping the article."),
    trick:L("Volgorde: (no) + me + gusta/gustan + het ding.","Order: (no) + me + gusta/gustan + the thing.")};
});

/* ---------- VRAAGWOORDEN ---------- */
reg("questions","kies",()=>{
  const set = LANG==="en" ? [
    {q:"¿Dónde",a:"está la llave?",why:"You are asking about a place, so dónde.",nl:"Where is the key?"},
    {q:"¿Cuándo",a:"comemos?",why:"You are asking about time, so cuándo.",nl:"When do we eat?"},
    {q:"¿Quién",a:"es tu profesor?",why:"You are asking about a person, so quién.",nl:"Who is your teacher?"},
    {q:"¿Qué",a:"comes hoy?",why:"You are asking about a thing, so qué.",nl:"What are you eating today?"},
    {q:"¿Cómo",a:"estás?",why:"You are asking how, so cómo.",nl:"How are you?"},
    {q:"¿Por qué",a:"no comes?",why:"You are asking for a reason, so por qué.",nl:"Why are you not eating?"}
  ] : [
    {q:"¿Dónde",a:"está la llave?",why:"Je vraagt naar een plaats, dus dónde.",nl:"Waar is de sleutel?"},
    {q:"¿Cuándo",a:"comemos?",why:"Je vraagt naar tijd, dus cuándo.",nl:"Wanneer eten we?"},
    {q:"¿Quién",a:"es tu profesor?",why:"Je vraagt naar een persoon, dus quién.",nl:"Wie is jouw leraar?"},
    {q:"¿Qué",a:"comes hoy?",why:"Je vraagt naar een ding, dus qué.",nl:"Wat eet je vandaag?"},
    {q:"¿Cómo",a:"estás?",why:"Je vraagt naar de manier, dus cómo.",nl:"Hoe gaat het?"},
    {q:"¿Por qué",a:"no comes?",why:"Je vraagt naar een reden, dus por qué.",nl:"Waarom eet je niet?"}
  ];
  const s = R.pick(set);
  const others = R.pickN(set.filter(x=>x.q!==s.q),3).map(x=>x.q);
  return {type:"mc", prompt:L("Welk vraagwoord hoort hier?","Which question word goes here?"),
    sentence:"___ "+s.a, showEs:s.q+" "+s.a, options:[s.q].concat(others), answer:s.q,
    why:s.why+L(" De hele vraag betekent: "," The whole question means: ")+s.nl,
    wrongWhy:others.reduce((o,x)=>{const m=set.find(y=>y.q===x); o[x]=L(x+" gebruik je in vragen zoals: ","You use "+x+" in questions like: ")+m.q+" "+m.a; return o;},{}),
    ruleName:L("Elk vraagwoord heeft zijn eigen taak","Each question word has its own job"),
    mistake:L("qué en cuál door elkaar halen.","Mixing up qué and cuál. qué asks what, cuál asks which one out of a set."),
    trick:L("Alle vraagwoorden hebben een streepje.","Every question word carries an accent: qué, quién, dónde, cuándo, cómo, cuánto.")};
});
reg("questions","cuanto",()=>{
  const w = R.pick(NOUNS), plural = R.chance(.7), g = GSOORT();
  const right = plural ? (w.g==="f"?"cuántas":"cuántos") : (w.g==="f"?"cuánta":"cuánto");
  return {type:"mc", prompt:L("Vul de juiste vorm van cuánto in.","Put in the right form of cuánto."),
    sentence:"¿___ "+(plural?w.pl:w.es)+" hay?", showEs:"¿"+cap(right)+" "+(plural?w.pl:w.es)+" hay?",
    options:["cuánto","cuánta","cuántos","cuántas"], answer:right, word:w.key,
    why:L("cuánto past mee met het woord erachter. "+(plural?w.pl:w.es)+" is "+G_NL[w.g]+" en "+(plural?"meervoud":"enkelvoud")+", dus "+right+".",
      "cuánto matches the noun after it. "+(plural?w.pl:w.es)+" is "+g[w.g]+" and "+(plural?"plural":"singular")+", so "+right+
      ". English how many never changes, which is why this is easy to forget."),
    wrongWhy:{"cuánto":L("Mannelijk enkelvoud.","Masculine singular. Check the noun."),
      "cuánta":L("Vrouwelijk enkelvoud.","Feminine singular. Check the noun."),
      "cuántos":L("Mannelijk meervoud.","Masculine plural. Check the noun."),
      "cuántas":L("Vrouwelijk meervoud.","Feminine plural. Check the noun.")},
    ruleName:L("cuánto past mee met het woord erna","cuánto matches the noun after it"),
    mistake:L("cuánto altijd hetzelfde laten.","Leaving cuánto unchanged. It is the one question word that agrees."),
    trick:L("cuánto is een beschrijvend woord in vermomming.","cuánto is an adjective in disguise.")};
});
reg("questions","jaofnee",()=>{
  const goed = "¿"+cap(conj(VERBS[0],1))+" español?";
  return {type:"mc", prompt:L("Hoe maak je hier een vraag van: Hablas español.","How do you turn this into a question: Hablas español."),
    sentence:cap(conj(VERBS[0],1))+" español.", showEs:goed,
    options:[goed,"¿Español hablas?","¿Tú hablar español?"], answer:goed,
    why:L("Voor een ja-nee vraag verander je niets aan de woorden.",
      "For a yes-no question you change nothing. No do, no does, no word swapping. Just the question marks and your voice going up."),
    wrongWhy:{"¿Español hablas?":L("Dat mag wel, maar legt de nadruk op español.","That is possible, but it stresses español. The normal question keeps the order."),
      "¿Tú hablar español?":L("Het werkwoord moet vervoegd blijven.","The verb must stay conjugated. hablar is the plain form and cannot be used here.")},
    ruleName:L("Ja-nee vragen: zelfde woorden, ander stemgeluid","Yes-no questions: same words, different intonation"),
    mistake:L("De woorden omdraaien zoals in het Nederlands.","Looking for a word for do. Spanish has none."),
    trick:L("Spaans is lui bij vragen.","Spanish is lazy about questions. Add ¿ ? and raise your voice.")};

/* ---------- BEZIT ---------- */
const POSSP = [
  {p:"Yo",v:"tengo",b:"mi",nl:"ik",en:"I"},{p:"Tú",v:"tienes",b:"tu",nl:"jij",en:"you"},
  {p:"Ella",v:"tiene",b:"su",nl:"zij",en:"she"},{p:"Él",v:"tiene",b:"su",nl:"hij",en:"he"},
  {p:"Nosotros",v:"tenemos",b:"nuestro",nl:"wij",en:"we"},{p:"Ellos",v:"tienen",b:"su",nl:"zij (meervoud)",en:"they"}
];
function possForm(base, w, plural){
  if(base==="nuestro") return "nuestr"+(w.g==="f"?"a":"o")+(plural?"s":"");
  return base+(plural?"s":"");
}
reg("possessives","vorm",()=>{
  const w = R.pick(NOUNS), plural = R.chance(.5);
  const base = R.pick([["mi","mijn","my"],["tu","jouw","your"],["su","zijn of haar","his or her"]]);
  const right = plural ? base[0]+"s" : base[0];
  return {type:"mc", prompt:L("Vul het juiste bezitswoord in.","Fill in the right possessive."),
    sentence:"___ "+(plural?w.pl:w.es)+" "+(plural?"son":"es")+" bonit"+(w.g==="f"?(plural?"as":"a"):(plural?"os":"o"))+".",
    showEs:cap(right)+" "+(plural?w.pl:w.es)+" "+(plural?"son":"es")+" bonit"+(w.g==="f"?(plural?"as":"a"):(plural?"os":"o"))+".",
    options:[base[0], base[0]+"s"], answer:right, word:w.key,
    why:L(base[0]+" betekent "+base[1]+" en kijkt alleen naar het aantal dingen.",
      base[0]+" means "+base[2]+" and only looks at how many things there are, not at gender. "+
      (plural?"There are several, so "+right+".":"There is one, so "+right+".")),
    wrongWhy:{[plural?base[0]:base[0]+"s"]:L("Kijk naar het aantal dingen.",
      plural?"Without the -s it belongs to one thing. Here there are several.":"With the -s it belongs to several things. Here there is one.")},
    ruleName:L("mi, tu en su kijken alleen naar het aantal","mi, tu and su only agree in number"),
    mistake:L("De -s vergeten bij meer dingen.","Forgetting the -s: mi hermanos instead of mis hermanos."),
    trick:L("Tel de dingen, niet de mensen.","Count the things, not the owners.")};
});
reg("possessives","nuestro",()=>{
  const w = R.pick(NOUNS), plural = R.chance(.4), g = GSOORT();
  const right = "nuestr" + (w.g==="f" ? (plural?"as":"a") : (plural?"os":"o"));
  return {type:"mc", prompt:L("Vul de juiste vorm van nuestro (ons) in.","Put in the right form of nuestro (our)."),
    sentence:"___ "+(plural?w.pl:w.es)+" "+(plural?"están":"está")+" aquí.",
    showEs:cap(right)+" "+(plural?w.pl:w.es)+" "+(plural?"están":"está")+" aquí.",
    options:["nuestro","nuestra","nuestros","nuestras"], answer:right, word:w.key,
    why:L("nuestro eindigt op een -o, dus het past mee op geslacht en aantal.",
      "nuestro ends in -o, so unlike mi and tu it agrees in both gender and number. "+(plural?w.pl:w.es)+" is "+g[w.g]+" and "+(plural?"plural":"singular")+", so "+right+"."),
    wrongWhy:{"nuestro":L("Mannelijk enkelvoud.","Masculine singular."),"nuestra":L("Vrouwelijk enkelvoud.","Feminine singular."),
      "nuestros":L("Mannelijk meervoud.","Masculine plural."),"nuestras":L("Vrouwelijk meervoud.","Feminine plural.")},
    ruleName:L("nuestro past mee op geslacht en aantal","nuestro agrees in gender and number"),
    mistake:L("nuestro overal hetzelfde laten.","Leaving nuestro unchanged, like mi and tu."),
    trick:L("Eindigt het bezitswoord op -o? Dan past het volledig mee.","Does the possessive end in -o? Then it agrees fully.")};
});
reg("possessives","herschrijven",()=>{
  const pp = R.pick(POSSP), w = R.pick(NOUNS), plural = R.chance(.45);
  const have = pp.p+" "+pp.v+" "+(plural ? "dos "+w.pl : indefSing(w)+" "+w.es)+".";
  const form = possForm(pp.b, w, plural);
  const out  = (plural?"Son ":"Es ")+form+" "+(plural?w.pl:w.es)+".";
  return {type:"input", prompt:L("Schrijf deze zin om met een bezitswoord.","Rewrite this sentence using a possessive."),

const HABIT = [
  ["todos los días","elke dag","every day"],["los lunes","op maandag","on Mondays"],["los domingos","op zondag","on Sundays"],

function gerund(v){ return v.es.slice(0,-2) + (v.g==="ar" ? "ando" : "iendo"); }

const NLSTEM = {
  hablar:"spreek", comprar:"koop", trabajar:"werk", estudiar:"studeer", cantar:"zing",
  bailar:"dans", escuchar:"luister", mirar:"kijk", esperar:"wacht", cocinar:"kook",
  tomar:"neem", llamar:"bel", ayudar:"help", buscar:"zoek", pagar:"betaal",
  preguntar:"vraag", caminar:"loop", lavar:"was", limpiar:"maak schoon", viajar:"reis",
  llegar:"kom aan", llevar:"draag", entrenar:"train", nadar:"zwem", descansar:"rust uit",
  levantar:"til", necesitar:"heb nodig", comer:"eet", beber:"drink", leer:"lees",
  aprender:"leer", vender:"verkoop", correr:"ren", comprender:"begrijp", responder:"antwoord",
  vivir:"woon", escribir:"schrijf", abrir:"open", subir:"ga omhoog", recibir:"ontvang", decidir:"beslis"
};
const NLSIMPLE = v => NLSTEM[v.es] && NLSTEM[v.es].indexOf(" ") < 0;
const PVERBS = () => VERBS.filter(NLSIMPLE);
function nlPresent(v, i){
  const stam = NLSTEM[v.es] || v.nl.replace(/en$/,"");
  if(i===3) return v.nl;
  if(i===0) return stam;
  return stam.endsWith("t") ? stam : stam+"t";
}
function enPresent(v, i){
  const basis = verbBetekenis(v).replace(/^to /,"");
  return i===2 ? (basis.match(/(s|h|o)$/) ? basis+"es" : basis+"s") : basis;
}

const PREPS = [["en","in","in"],["con","met","with"],["cerca de","dichtbij","near"]];
const PLAATSWW = ["cantar","trabajar","estudiar","cocinar","descansar","entrenar","hablar","esperar","bailar","leer"];
const PLAATSEN = ["casa","cocina","jardín","salón","oficina","gimnasio","hotel","playa","ciudad","dormitorio"];
const FORMADJ = [["grande","grote","big"],["pequeño","kleine","small"],["nuevo","nieuwe","new"],["viejo","oude","old"],
  ["bonito","mooie","pretty"],["limpio","schone","clean"],["sucio","vieze","dirty"],["frío","koude","cold"],["caro","dure","expensive"]];
const DOEPAREN = [
  ["comer",["pan","queso","pollo","pescado","sopa","ensalada","tomate"]],
  ["beber",["agua","leche","café","vino","cerveza","zumo"]],
  ["comprar",["libro","coche","camiseta","pantalón","chaqueta","mesa","silla"]],
  ["escuchar",["música","canción"]],["cantar",["canción","música"]],
  ["limpiar",["cocina","casa","mesa","ventana","suelo"]],
  ["lavar",["camiseta","coche","ropa","mano"]],
  ["buscar",["llave","móvil","dinero","trabajo"]],
  ["leer",["libro","correo","factura"]]
];
function vondWoord(es){ return NOUNS.find(w=>w.es===es); }
function doePaar(){
  for(let k=0;k<20;k++){
    const p = R.pick(DOEPAREN), v = VERBS.find(x=>x.es===p[0]), n = vondWoord(R.pick(p[1]));
    if(v && n) return {v:v, n:n};
  }
  return {v:VERBS.find(x=>x.es==="comer"), n:vondWoord("pan")};
}
function formuleZin(){
  const v = VERBS.find(x=>x.es===R.pick(PLAATSWW)) || VERBS[0];
  const p = R.pick([["en","in","in"],["en","in","in"],["cerca de","dichtbij","near"]]);
  const kandidaten = PLAATSEN.map(vondWoord).filter(Boolean).filter(w => p[0]==="cerca de" ? w.art==="la" : true);
  const n = R.pick(kandidaten.length?kandidaten:[vondWoord("casa")]);
  const ap = R.pick(FORMADJ), a = ADJS.find(x=>x.es===ap[0]) || ADJS[0];
  const wie = R.pick([["Yo",0,"Ik","I"],["Tú",1,"Jij","You"],["Ella",2,"Zij","She"]]);
  const adj = adjForm(a, n.g, 1);
  return {v:v, p:p, n:n, a:a, wie:wie, adj:adj,
    es:wie[0]+" "+conj(v,wie[1])+" "+p[0]+" "+n.art+" "+n.es+" "+adj+".",
    nl:L(wie[2]+" "+nlPresent(v,wie[1])+" "+p[1]+" de "+ap[1]+" "+n.nl+".",
         wie[3]+" "+enPresent(v,wie[1])+" "+p[2]+" the "+ap[2]+" "+betekenis(n)+"."),
    delen:[[wie[0],L("wie","who")],[conj(v,wie[1]),L("werkwoord","verb")],[p[0],L("plaatswoordje","preposition")],
           [n.art,L("lidwoord","article")],[n.es,L("ding","noun")],[adj,L("eigenschap","adjective")]]};
}

reg("zinsformule","geendo",()=>{
  const v = R.pick(PVERBS().filter(x=>x.g==="ar"));
  const goed = "¿"+cap(conj(v,1))+"?";
  const fout1 = "¿Haces "+v.es+"?";
  const fout2 = "¿Tú "+v.es+"?";
  return {type:"mc", prompt:L("Hoe vraag je dit?","How do you ask this?"),
    sentence:L(cap(nlPresent(v,1)).replace(/t$/,"")+" jij?", "Do you "+enPresent(v,0)+"?"),
    showEs:goed, options:[goed,fout1,fout2], answer:goed,
    why:L("Spaans kent geen hulpwerkwoord voor vragen.",
      "Spanish has no helper verb for questions. There is simply no word for do. You conjugate the verb and wrap it in question marks: <b>"+goed+"</b>"),
    wrongWhy:{[fout1]:L("Dit is een letterlijke vertaling van het Engelse do.","This is a word-for-word translation of do. hacer means to make or to do a thing, never to form a question."),
      [fout2]:L("Het werkwoord staat nog in de basisvorm.","The verb is still in its plain form and has to be conjugated.")},
    ruleName:L("Do en does bestaan niet in het Spaans","There is no do or does in Spanish"),
    mistake:L("Een hulpwerkwoord verzinnen.","Inventing a helper verb because English has one."),
    trick:L("Nederlands doet het ook niet.","Just conjugate and add ¿ ?. That is the whole question.")};
});

/* ---------- WERKWOORDEN ---------- */
function verbGen(topic, group, labelNl, labelEn){
  const label = () => L(labelNl, labelEn);
  reg(topic,"vervoegen",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.int(6), pr = P6[i], form = conj(v,i);
    const wrongs = [conj(v,(i+1)%6), conj(v,(i+2)%6), v.es].filter((x,ix,arr)=>x!==form && arr.indexOf(x)===ix);
    return {type:"mc", prompt:L("Vervoeg "+v.es+" ("+v.nl+") voor "+pr.p+".",
                                "Conjugate "+v.es+" ("+verbBetekenis(v)+") for "+pr.p+"."),
      sentence:cap(pr.p)+" ___ .", showEs:cap(pr.p)+" "+form+".",
      options:[form].concat(wrongs.slice(0,3)), answer:form,
      why:L("Haal -"+v.g+" van "+v.es+" af, dat geeft de stam "+v.es.slice(0,-2)+". Bij "+pr.p+" hoort -"+ENDINGS[v.g][i]+". Samen: "+form+".",
        "Take -"+v.g+" off "+v.es+" and you get the stem "+v.es.slice(0,-2)+". "+pr.p+" ("+pronNaam(i)+") takes -"+ENDINGS[v.g][i]+". Together: "+form+"."),
      wrongWhy:{[v.es]:L("Dat is de basisvorm.","That is the plain form. Once you say who does it, it needs an ending.")},
      ruleName:L("Staartjes van "+labelNl+": "+ENDINGS[v.g].join(", "), "Endings for "+labelEn+": "+ENDINGS[v.g].join(", ")),
      mistake:L("De basisvorm laten staan, of het staartje van een andere groep gebruiken.",
                "Leaving the plain form, or borrowing an ending from another group."),
      trick:L("Stam plus staartje.","Stem plus ending. The set is: "+ENDINGS[v.g].join(", ")+".")};
  });
  reg(topic,"invullen",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.int(6), pr = P6[i], form = conj(v,i);
    return {type:"input", prompt:L("Vul de juiste vorm in van "+v.es+" ("+v.nl+").",
                                   "Put in the right form of "+v.es+" ("+verbBetekenis(v)+")."),
      sentence:cap(pr.p)+" ___ ("+v.es+").", showEs:cap(pr.p)+" "+form+".",
      answer:form, accept:[form, pr.p+" "+form],
      why:L("Stam "+v.es.slice(0,-2)+" plus het staartje voor "+pr.p+", dat is -"+ENDINGS[v.g][i]+".",
        "Stem "+v.es.slice(0,-2)+" plus the ending for "+pr.p+" ("+pronNaam(i)+"), which is -"+ENDINGS[v.g][i]+"."),
      wrongWhy:{},
      ruleName:L("Zelf vervoegen in "+labelNl, "Conjugating "+labelEn+" yourself"),
      mistake:L("Het staartje van een andere groep pakken.","Grabbing an ending from another group."),
      trick:L("De klinker van het werkwoord komt terug in het staartje.","The vowel of the infinitive comes back in the ending.")};
  });
  reg(topic,"nl2es",()=>{
    const v = R.pick(VERBS.filter(x=>group.includes(x.g)));
    const i = R.pick([0,1,2,3]), pr = P6[i], form = conj(v,i);
    const nlv = {0:v.nl, 1:v.nl.replace(/en$/,"")+"t", 2:v.nl.replace(/en$/,"")+"t", 3:v.nl}[i];
    const enBasis = verbBetekenis(v).replace(/^to /,"");
    const env = i===2 ? (enBasis.match(/(s|h|o)$/) ? enBasis+"es" : enBasis+"s") : enBasis;
    return {type:"input", prompt:L("Vertaal naar het Spaans. Laat het woordje voor de persoon weg.",
                                   "Translate into Spanish. Leave out the word for the person."),
      sentence:L(cap(pr.nl)+" "+nlv+".", cap(pronNaam(i))+" "+env+"."),
      showEs:cap(form)+".", answer:cap(form)+".", accept:[form, form+".", pr.p+" "+form],
      why:L("Bij "+pr.nl+" hoort de vorm "+form+". Het woordje "+pr.p+" mag weg.",
        pronNaam(i)+" takes the form "+form+". You can drop "+pr.p+" entirely, because the ending already says who does it. Spanish speakers usually do."),
      wrongWhy:{},
      ruleName:L("Van Nederlands naar een vervoegd werkwoord","From your language to a conjugated verb"),
      mistake:L("Het woordje yo of tú erbij zetten uit gewoonte.","Adding yo or tú out of habit, because English always needs I or you."),
      trick:L("Het staartje vertelt wie het doet.","The ending tells you who does it. That is why the pronoun can go.")};
  });
}
verbGen("verbsar",["ar"],"-ar werkwoorden","-ar verbs");
verbGen("verberir",["er","ir"],"-er en -ir werkwoorden","-er and -ir verbs");

reg("verberir","verschil",()=>{
  const v = R.pick(VERBS.filter(x=>x.g!=="ar"));
  const i = R.pick([3,4]), form = conj(v,i);
  const wrong = v.es.slice(0,-2) + ENDINGS[v.g==="er"?"ir":"er"][i];
  return {type:"mc", prompt:L("Kijk goed naar de klinker. Welke vorm is goed voor "+P6[i].p+"?",
                              "Look carefully at the vowel. Which form is right for "+P6[i].p+"?"),
    sentence:cap(P6[i].p)+" ___ ("+v.es+" = "+verbBetekenis(v)+").", showEs:cap(P6[i].p)+" "+form+".",
    options:[form, wrong].filter((x,ix,arr)=>arr.indexOf(x)===ix), answer:form,
    why:L(v.es+" is een -"+v.g+" werkwoord. Bij "+P6[i].p+" hoort dan -"+ENDINGS[v.g][i]+".",
      v.es+" is an -"+v.g+" verb, so "+P6[i].p+" takes -"+ENDINGS[v.g][i]+". This is the only place where -er and -ir differ."),
    wrongWhy:{[wrong]:L("Dat is het staartje van de andere groep.","That is the ending of the other group.")},
    ruleName:L("Bij wij en jullie verschillen -er en -ir","-er and -ir only differ for we and you plural"),
    mistake:L("comimos zeggen in plaats van comemos.","Saying comimos instead of comemos. That is a past tense."),
    trick:L("Alleen bij nosotros en vosotros verschillen ze.","Only nosotros and vosotros tell -er and -ir apart.")};
});

/* ---------- PLAATS ---------- */
const PLACE_EN = {"encima de":"on top of","debajo de":"under","al lado de":"next to","delante de":"in front of",
  "detrás de":"behind","entre":"between","dentro de":"inside","fuera de":"outside","cerca de":"near",
  "lejos de":"far from","a la derecha de":"to the right of","a la izquierda de":"to the left of"};
const placeNl = p => LANG==="en" ? (PLACE_EN[p.es]||p.nl) : p.nl;

reg("place","kies",()=>{
  const p = R.pick(PLACES), w = R.pick(nounsOf("furniture","house")), o = R.pick(nounsOf("animals","otros","furniture"));
  const others = R.pickN(PLACES.filter(x=>x.es!==p.es),3);
  const needsDel = w.art==="el";
  const conn = p.es.endsWith(" de") ? (needsDel ? p.es.slice(0,-3)+" del" : p.es+" la") : p.es+" "+w.art;
  const full = cap(o.art)+" "+o.es+" está "+conn+" "+w.es+".";
  return {type:"mc", prompt:L("Welk plaatswoord betekent "+p.nl+"?","Which word means "+placeNl(p)+"?"),
    sentence:placeNl(p), showEs:full, options:[p.es].concat(others.map(x=>x.es)), answer:p.es,
    why:L(p.es+" betekent "+p.nl+". Voorbeeld: "+full, p.es+" means "+placeNl(p)+". Example: "+full),
    wrongWhy:others.reduce((o2,x)=>{o2[x.es]=L(x.es+" betekent "+x.nl+".", x.es+" means "+placeNl(x)+"."); return o2;},{}),
    ruleName:L("De plaatswoorden","The place words"),
    mistake:L("de vergeten aan het eind.","Dropping the de at the end. English says on the table; Spanish says encima de la mesa."),
    trick:L("Bijna alles eindigt op de.","Almost all of them end in de. Only entre does not.")};
});
reg("place","del",()=>{
  const p = R.pick(PLACES.filter(x=>x.es.endsWith(" de"))), w = R.pick(NOUNS);
  const right = w.art==="el" ? p.es.slice(0,-3)+" del "+w.es : p.es+" la "+w.es;
  const wrong = w.art==="el" ? p.es+" el "+w.es : p.es.slice(0,-3)+" del "+w.es;
  return {type:"mc", prompt:L("Welke vorm is goed?","Which form is correct?"),
    sentence:"El gato está ___ .", showEs:"El gato está "+right+".",
    options:[right,wrong], answer:right, word:w.key,
    why:w.art==="el"
      ? L("de plus el wordt altijd del.","de plus el always merges into del. There is no choice: de el simply does not exist in Spanish.")
      : L(w.es+" is vrouwelijk en krijgt la. Bij la smelt er niets samen.",
          w.es+" is feminine and takes la. Nothing merges with la, so it stays de la."),
    wrongWhy:{[wrong]:w.art==="el" ? L("de el bestaat niet.","de el does not exist. It is always del.")
      : L("del bestaat alleen bij el.","del only happens with el. With a feminine word it stays de la.")},
    ruleName:L("de + el = del","de + el = del"),
    mistake:L("de el schrijven, of del gebruiken bij een vrouwelijk woord.","Writing de el, or using del with a feminine noun."),
    trick:L("del bestaat alleen bij el.","del only exists with el.")};
});
reg("place","zin",()=>{
  const p = R.pick(PLACES.filter(x=>x.es.endsWith(" de"))), w = R.pick(nounsOf("furniture")), o = R.pick(nounsOf("animals"));
  const conn = w.art==="el" ? p.es.slice(0,-3)+" del" : p.es+" la";
  const es = cap(o.art)+" "+o.es+" está "+conn+" "+w.es+".";
  const nl = L("De "+o.nl+" is "+p.nl.split(" / ")[0]+" de "+w.nl+".",
               "The "+betekenis(o)+" is "+placeNl(p)+" the "+betekenis(w)+".");
  return {type:"input", prompt:L("Vertaal naar het Spaans.","Translate into Spanish."),
    sentence:nl, showEs:es, answer:es, accept:[es, es.replace(".","")], word:w.key,
    why:L("Plaats gaat met estar, dus está. "+p.es+" betekent "+p.nl+".",
      "Location uses estar, so está. "+p.es+" means "+placeNl(p)+". "+
      (w.art==="el" ? "And de plus el becomes del." : "With a feminine noun it stays de la.")),
    wrongWhy:{},
    ruleName:L("Een plaatszin bouwen","Building a location sentence"),
    mistake:L("ser gebruiken, of de weglaten.","Using ser, or dropping the de."),
    trick:L("Bekend ding plus plaats is altijd está.","A known thing plus a place is always está.")};
});

/* ---------- WOORDVOLGORDE ---------- */
reg("wordorder","bouw",()=>{
  const w = R.pick(NOUNS), a = R.pick(ADJS), v = R.pick(VERBS.filter(x=>x.g==="ar"));
  const set = R.pick([
    {es:cap(w.art)+" "+w.es+" es "+adjForm(a,w.g,1)+".", nl:L("De "+w.nl+" is "+a.nl+".","The "+betekenis(w)+" is "+betekenis(a)+".")},
    {es:"Tengo un"+(indefSing(w)==="una"?"a":"")+" "+w.es+" "+adjForm(a,w.g,1)+".",
     nl:L("Ik heb een "+a.nl+"e "+w.nl+".","I have a "+betekenis(a)+" "+betekenis(w)+".")},
    {es:"No "+conj(v,0)+" "+w.art+" "+w.es+".",
     nl:L("Ik "+v.nl.replace(/en$/,"")+" de "+w.nl+" niet.","I do not "+verbBetekenis(v).replace(/^to /,"")+" the "+betekenis(w)+".")}
  ]);
  const words = set.es.replace(".","").split(" ");
  return {type:"build", prompt:L("Zet de woorden in de juiste orde.","Put the words in the right order."),
    sentence:set.nl, showEs:set.es, pool:R.shuffle(words), answer:set.es, accept:[set.es, set.es.replace(".","")], word:w.key,
    why:L("De Spaanse volgorde is: wie, werkwoord, wat, en de eigenschap komt achter het ding.",
      "Spanish order is: who, verb, what, and the adjective goes after the noun. Also note there is no word for do in a negative sentence: no simply sits in front of the verb."),
    wrongWhy:{},
    ruleName:L("Wie, doet, wat. Eigenschap achter het ding","Who, does, what. Adjective after the noun"),
    mistake:L("Het beschrijvende woord voor het ding zetten.","Putting the adjective before the noun, as English does."),
    trick:L("Ding eerst, eigenschap daarna.","Noun first, description after.")};
});
reg("wordorder","fout",()=>{
  const w = R.pick(NOUNS), a = R.pick(COLORS);
  const good = "Tengo un"+(indefSing(w)==="una"?"a":"")+" "+w.es+" "+adjForm(a,w.g,1)+".";
  const bad  = "Tengo un"+(indefSing(w)==="una"?"a":"")+" "+adjForm(a,w.g,1)+" "+w.es+".";
  return {type:"mc", prompt:L("Welke zin is goed Spaans?","Which sentence is correct Spanish?"),
    sentence:L("Ik heb een "+a.nl+"e "+w.nl+".","I have a "+betekenis(a)+" "+betekenis(w)+"."),
    showEs:good, options:[good,bad], answer:good, word:w.key,
    why:L("Het beschrijvende woord staat achter het ding.",
      "The adjective goes after the noun: "+w.es+" "+adjForm(a,w.g,1)+", literally "+betekenis(w)+" "+betekenis(a)+"."),
    wrongWhy:{[bad]:L("Dit is de Nederlandse volgorde.","This is the English order. Spanish puts the colour behind the noun.")},
    ruleName:L("Eigenschap achter het ding","Adjective after the noun"),
    mistake:L("De Nederlandse woordvolgorde kopiëren.","Copying English word order."),
    trick:L("casa blanca, vino tinto, coche rojo.","casa blanca, vino tinto, coche rojo.")};
});
reg("wordorder","no",()=>{
  const v = R.pick(VERBS.filter(x=>x.g==="ar")), w = R.pick(NOUNS);
  const good = "No "+conj(v,0)+" "+w.art+" "+w.es+".";
  const bad = cap(conj(v,0))+" no "+w.art+" "+w.es+".";
  return {type:"mc", prompt:L("Waar zet je no?","Where does no go?"),
    sentence:L("Ik "+v.nl.replace(/en$/,"")+" de "+w.nl+" niet.","I do not "+verbBetekenis(v).replace(/^to /,"")+" the "+betekenis(w)+"."),
    showEs:good, options:[good,bad], answer:good, word:w.key,
    why:L("no staat altijd direct voor het werkwoord.",
      "no always sits directly in front of the verb. And notice there is no Spanish word for don't: no does the whole job on its own."),
    wrongWhy:{[bad]:L("In het Nederlands staat niet vaak achteraan.","In English the negative attaches to a helper verb. Spanish has no helper: no goes straight before the verb.")},
    ruleName:L("no komt direct voor het werkwoord","no comes directly before the verb"),
    mistake:L("no achter het werkwoord zetten.","Looking for a word for do not. There is none."),
    trick:L("No en het werkwoord zijn onafscheidelijk.","no and the verb are inseparable.")};
});

/* ---------- GESPREK ---------- */
const CONVO = [
  {q:"¿Cómo te llamas?", a:"Me llamo Ana.", nl:"Hoe heet je?", en:"What is your name?",
   why:"Literally: how do you call yourself? The answer works the same way: me llamo, I call myself."},
  {q:"¿De dónde eres?", a:"Soy de Holanda.", nl:"Waar kom je vandaan?", en:"Where are you from?",
   why:"Origin uses ser plus de, just like English from."},
  {q:"¿Cómo estás?", a:"Muy bien, gracias.", nl:"Hoe gaat het?", en:"How are you?",
   why:"How you are right now uses estar. Answer with bien, not bueno."},
  {q:"¿Cuántos años tienes?", a:"Tengo treinta años.", nl:"Hoe oud ben je?", en:"How old are you?",
   why:"Literally: how many years do you have? Age always uses tener."},
  {q:"¿Dónde vives?", a:"Vivo en Madrid.", nl:"Waar woon je?", en:"Where do you live?",
   why:"vivir is an -ir verb, so the I-form is vivo. No do needed for the question."},
  {q:"¿Qué tal?", a:"Bien, ¿y tú?", nl:"Hoe is het?", en:"How is it going?",
   why:"Always ask back with ¿y tú? Not doing so comes across as uninterested."},
  {q:"¿Hablas español?", a:"Sí, hablo un poco.", nl:"Spreek je Spaans?", en:"Do you speak Spanish?",
   why:"No word for do. Just the conjugated verb between question marks."},
  {q:"¿Cuánto es?", a:"Son cinco euros.", nl:"Hoeveel is het?", en:"How much is it?",
   why:"Prices use son when the amount is more than one."},
  {q:"¿Qué hora es?", a:"Son las dos.", nl:"Hoe laat is het?", en:"What time is it?",
   why:"Time always uses ser. Son las plus the number."},
  {q:"¿Tienes hermanos?", a:"Sí, tengo dos.", nl:"Heb je broers of zussen?", en:"Do you have brothers or sisters?",
   why:"hermanos covers brothers and sisters together."},
  {q:"¿Cómo se dice mesa?", a:"Se dice mesa.", nl:"Hoe zeg je tafel?", en:"How do you say table?",
   why:"Use ¿cómo se dice ...? to ask how something is said. It works for any word."},
  {q:"¿Puedes repetir?", a:"Claro, no hay problema.", nl:"Kun je dat herhalen?", en:"Can you repeat that?",
   why:"After puedes the second verb stays in its plain form."},
  {q:"¿Dónde está el baño?", a:"Está a la derecha.", nl:"Waar is de wc?", en:"Where is the toilet?",
   why:"Location always uses estar."},
  {q:"¿Quieres un café?", a:"Sí, por favor.", nl:"Wil je koffie?", en:"Would you like a coffee?",
   why:"Answer a yes-no question with sí or no, plus por favor or gracias."},
  {q:"¿Qué haces?", a:"Estudio español.", nl:"Wat doe je?", en:"What are you doing?",
   why:"The plain present covers both what do you do and what are you doing."},
  {q:"¿Te gusta España?", a:"Sí, me gusta mucho.", nl:"Vind je Spanje leuk?", en:"Do you like Spain?",
   why:"With gustar you look at the thing. España is one thing, so gusta."}
];
const convoNl = c => LANG==="en" ? c.en : c.nl;

reg("conversation","antwoord",()=>{
  const c = R.pick(CONVO), others = R.pickN(CONVO.filter(x=>x.q!==c.q),3);
  return {type:"mc", prompt:L("Wat is het goede antwoord op deze vraag?","What is the right answer to this question?"),
    sentence:c.q, showEs:c.q+" "+c.a, options:[c.a].concat(others.map(x=>x.a)), answer:c.a,
    why:L("De vraag betekent: "+c.nl, "The question means: "+c.en+" "+c.why),
    wrongWhy:others.reduce((o,x)=>{o[x.a]=L("Dat is het antwoord op: "+x.q+" ("+x.nl+")",
      "That answers: "+x.q+" ("+x.en+")"); return o;},{}),
    ruleName:L("Vaste vragen en antwoorden","Set questions and answers"),
    mistake:L("Het antwoord goed hebben maar de vraag niet herkennen.","Knowing the answer but not recognising the question."),
    trick:L("Leer vraag en antwoord samen als één blokje.","Learn question and answer together as one block.")};
});

  const c = R.pick(CONVO);
  return {type:"input", prompt:L("Hoe vraag je dit in het Spaans?","How do you ask this in Spanish?"),

    why:L("De vraag is: "+c.q, c.why+" The question is: "+c.q),
    wrongWhy:{},
    ruleName:L("Vragen stellen in een gesprek","Asking questions in conversation"),
    mistake:L("Het omgekeerde vraagteken vergeten.","Forgetting the upside-down question mark at the start."),
    trick:L("Elke Spaanse vraag begint met ¿","Every Spanish question opens with ¿ and closes with ?")};
});

reg("conversation","gat",()=>{
  const c = R.pick(CONVO), words = c.a.replace(/[.,]/g,"").split(" ");
  const i = R.int(words.length), gap = words[i];
  const sentence = words.map((w,ix)=>ix===i?"___":w).join(" ");
  const pool = [...new Set(CONVO.filter(x=>x.a!==c.a)
    .map(x=>x.a.replace(/[.,]/g,"").split(" ")[0])
    .filter(x=>x.toLowerCase()!==gap.toLowerCase()))];
  return {type:"mc", prompt:L("Vul het ontbrekende woord in.","Fill in the missing word."),
    sentence:c.q+"  →  "+sentence, showEs:c.a, options:[gap].concat(R.pickN(pool,2)), answer:gap,
    why:L("Het hele antwoord is: "+c.a+" ("+c.nl+")", "The full answer is: "+c.a+" ("+c.en+") "+c.why),
    wrongWhy:{},
    ruleName:L("Vaste antwoorden aanvullen","Completing set answers"),
    mistake:L("Het antwoord half kennen.","Half-knowing the answer."),
    trick:L("Zeg de vraag hardop, dan komt het antwoord vanzelf.","Say the question out loud and the answer follows.")};
});
reg("conversation","es2nl",()=>{
