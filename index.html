/* ---------------- DE OEFENLOOP ---------------- */
let ANSWERED = false, BUILT = [];

function startSession(cfg){
  newSession(cfg);
  ANSWERED = false;
  go("practice");
  renderQuestion();
}
function endSession(){ SESS = null; go("practice"); }

function renderQuestion(){
  if(!SESS) return;
  if(SESS.endAt && Date.now()>SESS.endAt) return renderResult();
  if(SESS.limit && SESS.idx >= SESS.limit) return renderResult();
  fillQueue();
  const e = SESS.queue[SESS.idx];
  if(!e) return renderResult();
  ANSWERED = false; BUILT = [];

  const total = SESS.limit || 0;
  const pct = total ? Math.round(SESS.idx/total*100) : Math.min(100, (SESS.ruleStreak[e.rule]||0)/3*100);
  const label = total ? (SESS.idx+1)+" / "+total : (TOPIC[e.topic] ? TOPIC[e.topic].nl : "Oefenen");

  let h = '<div class="runner stack-20">';
  h += '<div class="run-head"><button class="icon-btn" data-stop="1" aria-label="Stoppen">✕</button>'
    + '<div style="flex:1"><div class="bar"><div class="bar-fill'+(e.rem?' saffron':'')+'" style="width:'+pct+'%"></div></div></div>'
    + '<div class="streak-pill">☀ '+S.streak+'</div></div>';
  if(SESS.endAt) h += '<div class="center mono" id="clock" style="font-size:20px">90</div>';
  h += '<div class="row"><span class="q-kind">'+e.kind+'</span><span class="tiny dim">'+label+'</span>'
    + (e.rem?'<span class="tag tag-saffron">extra oefening op deze regel</span>':'')+'</div>';
  h += '<div class="stack-14"><div class="q-text">'+e.prompt+'</div>';
  if(S.answered < 25 && e.sentence){
    h += '<div class="hintbar">💡 Wijs een Spaans woord aan om te zien wat het betekent</div>';
  }

  if(e.type==="picture"){
    h += '<div class="q-sent" style="font-size:76px;padding:26px">'+e.emoji+'</div>';
  } else if(e.type==="listen"){
    h += '<div class="q-sent"><button class="btn btn-primary" data-speak="'+H(e.audio||e.showEs).replace(/"/g,"&quot;")+'">🔊 Speel af</button></div>';
  } else if(e.type==="match"){
    const left = R.shuffle(e.pairs.map((p,i)=>({t:p[0],i:i})));
    const right = R.shuffle(e.pairs.map((p,i)=>({t:p[1],i:i})));
    h += '<div class="match-cols"><div class="stack-6">'
      + left.map(x=>'<button class="opt" data-m="L" data-i="'+x.i+'"><span class="opt-key">ES</span>'+x.t+'</button>').join("")
      + '</div><div class="stack-6">'
      + right.map(x=>'<button class="opt" data-m="R" data-i="'+x.i+'"><span class="opt-key">NL</span>'+x.t+'</button>').join("")
      + '</div></div>';
  } else if(e.sentence){
    h += '<div class="q-sent">'+glos(e.sentence).replace("___",'<span class="q-blank">&nbsp;&nbsp;&nbsp;</span>')+'</div>';
  }

  if(e.type==="mc" || e.type==="listen" || e.type==="picture"){
    const keys = ["A","B","C","D","E"];
    h += '<div class="opts'+(e.options.length===2?' two':'')+'">'
      + e.options.map((o,i)=>'<button class="opt" data-opt="'+H(o).replace(/"/g,"&quot;")+'"><span class="opt-key">'+keys[i]+'</span><span>'+o+'</span></button>').join("")
      + '</div>';
  } else if(e.type==="input"){
    const gapped = e.sentence && String(e.sentence).indexOf("___")>=0;
    h += '<div class="stack-10"><input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(gapped?"Alleen het ontbrekende woord, of de hele zin":"Typ je antwoord")+'">'
      + '<div class="accents">'+["á","é","í","ó","ú","ñ","¿","¡"].map(c=>'<button data-acc="'+c+'">'+c+'</button>').join("")+'</div>'
      + '<button class="btn btn-primary btn-wide" data-check="1">Controleer</button></div>';
  } else if(e.type==="build"){
    h += '<div class="stack-10"><div class="build-slot" id="slot"></div>'
      + '<div class="build-hint">Tik de woorden aan in de goede volgorde. Tik in het vak om terug te halen.</div>'
      + '<div class="build-pool" id="pool">'+e.pool.map((w,i)=>'<button class="word" data-w="'+i+'">'+w+'</button>').join("")+'</div>'
      + '<button class="btn btn-primary btn-wide" data-check="1">Controleer</button></div>';
  }
  h += '</div><div id="fb"></div></div>';
  $("#sc-practice").innerHTML = h;
  const inp = $("#ans"); if(inp) setTimeout(()=>inp.focus(), 60);
  if(SESS.endAt) tickClock();
}

let clockTimer=null;
function tickClock(){
  clearInterval(clockTimer);
  clockTimer = setInterval(()=>{
    const c = $("#clock"); if(!c || !SESS || !SESS.endAt){ clearInterval(clockTimer); return; }
    const left = Math.max(0, Math.ceil((SESS.endAt - Date.now())/1000));
    c.textContent = left;
    if(left<=0){ clearInterval(clockTimer); renderResult(); }
  }, 250);
}

function answer(given){
  if(ANSWERED || !SESS) return;
  const e = SESS.queue[SESS.idx];
  ANSWERED = true;
  const res = grade(e, given);
  paintTop();
  if(res.ok) shards();

  document.querySelectorAll("[data-opt]").forEach(b=>{
    b.classList.add("lock");
    const v = b.dataset.opt;
    if(v===e.answer) b.classList.add("good");
    else if(v===given) b.classList.add("bad");
    else b.classList.add("fade");
  });
  const inp = $("#ans"); if(inp){ inp.disabled = true; if(!res.ok) inp.classList.add("shake"); }
  const chk = document.querySelector("[data-check]"); if(chk) chk.remove();

  let h = '<div class="fb '+(res.ok?"ok":"no")+'"><div class="fb-top">'
    + (res.ok?"✅ Goed!":"❌ Niet goed") + (res.accentOnly?' <span class="tiny" style="font-weight:600">— let nog even op de accenten</span>':'') + '</div><div class="fb-body">';
  if(e.type!=="match"){
    const shown = e.showEs || e.answer;
    h += '<div class="fb-blk"><div class="fb-lab">Het juiste antwoord</div><div class="row"><div class="fb-txt"><b>'
      + shown + '</b></div>'+spk(shown)+'</div>'
      + (e.showEs ? '<div class="vpron">'+pronOf(String(shown).replace(/\(.*?\)/g,""))+'</div>' : '')
      + '</div>';
  }
  h += '<div class="fb-blk"><div class="fb-lab">Waarom dit klopt</div><div class="fb-txt">'+e.why+'</div></div>';
  if(!res.ok && e.wrongWhy && e.wrongWhy[given]){
    h += '<div class="fb-blk"><div class="fb-lab">Waarom jouw antwoord niet kan</div><div class="fb-txt">'+e.wrongWhy[given]+'</div></div>';
  }
  h += '<div class="fb-blk"><div class="fb-lab">De regel</div><div class="fb-txt">'+e.ruleName+'</div></div>';
  h += '<div class="fb-blk"><div class="fb-lab">Wat beginners fout doen</div><div class="fb-txt">'+e.mistake+'</div></div>';
  h += '<div class="fb-blk" style="background:var(--saffronsoft);margin:-4px -6px;padding:12px 14px;border-radius:12px">'
    + '<div class="fb-lab">Geheugentruc</div><div class="fb-txt">'+e.trick+'</div></div>';
  if(res.extra){
    h += '<div class="fb-blk"><div class="fb-txt tiny">Je krijgt nu '+res.extra+' extra oefeningen over precies deze regel. '
      + 'Drie keer goed op rij en we gaan verder.</div></div>';
  } else if(e.rem && res.ok){
    h += '<div class="fb-blk"><div class="fb-txt tiny">Goed op rij: '+res.streakOnRule+' van 3.</div></div>';
  }
  h += '<button class="btn '+(res.ok?"btn-primary":"btn-saffron")+' btn-wide" data-next="1">Volgende</button>';
  h += '</div></div>';
  $("#fb").innerHTML = h;
  $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function nextQ(){ if(!SESS) return; SESS.idx++; renderQuestion(); }

/* ---------------- RESULTAAT ---------------- */
function renderResult(){
  clearInterval(clockTimer);
  const s = SESS; if(!s) return;
  const total = s.right + s.wrong;
  const pct = total ? Math.round(s.right/total*100) : 0;
  let title = "Klaar", sub = "";
  if(s.mode==="quiz"){
    const t = S.t[s.topic];
    if(pct > t.quiz) t.quiz = pct;
    title = pct>=80 ? "Geslaagd!" : "Nog niet";
    sub = pct>=80 ? "Je beheerst "+TOPIC[s.topic].nl+" goed genoeg. De tegel is geglazuurd." : "Je hebt 80% nodig. Lees de uitleg nog eens en probeer opnieuw.";
    if(pct>=80) addXp(50);
  }
  if(s.mode==="mixed"){ S.mixedBest = Math.max(S.mixedBest, pct); title = "Grote herhaling klaar"; sub="Alles door elkaar, dat is het echte werk."; if(pct>=80) addXp(80); }
  if(s.mode==="master"){ S.masterBest = Math.max(S.masterBest, pct); title = pct>=90?"Meester!":"Meesterproef klaar"; sub = pct>=90?"90% of meer. Heel knap.":"Je hebt 90% nodig voor de meestertitel."; if(pct>=90) addXp(200); }
  if(s.mode==="timed"){ S.timedBest = Math.max(S.timedBest, s.right); title = "Tijd om!"; sub = s.right+" goed in 90 seconden."; }
  save();
  if(pct>=80 && total>=20) shards(60);

  const missed = Object.keys(s.missed).sort((a,b)=>s.missed[b]-s.missed[a]).slice(0,4);
  let h = '<div class="runner stack-20 center">'
    + '<div class="card pad stack-14">'
    + '<div class="h-xl">'+title+'</div>'
    + '<div class="stat-n" style="font-size:52px;color:'+(pct>=80?"var(--verde)":"var(--saffron)")+'">'+pct+'%</div>'
    + '<div class="prose" style="font-size:16px">'+s.right+' goed, '+s.wrong+' fout. '+sub+'</div>'
    + '</div>';
  if(missed.length){
    h += '<div class="card pad" style="text-align:left"><div class="eyebrow" style="margin-bottom:8px">Hier ging het mis</div><div class="stack-6">'
      + missed.map(r=>{
        const top = TOPIC[r.split(".")[0]];
        return '<div class="row"><span>'+(top?top.ico+" "+top.nl:r)+'</span><span class="spacer"></span><span class="tiny dim">'+s.missed[r]+'x fout</span></div>';
      }).join("")
      + '</div><button class="btn btn-wide btn-saffron" style="margin-top:14px" data-drill="'+missed[0]+'">Oefen deze regel</button></div>';
  }
  h += '<div class="row" style="justify-content:center"><button class="btn btn-primary" data-stop="1">Klaar</button>'
    + (s.mode==="quiz"?'<button class="btn" data-quiz="'+s.topic+'">Nog een keer</button>':'')+'</div></div>';
  SESS = null;
  $("#sc-practice").innerHTML = h;
}

/* ---------------- VOORTGANG ---------------- */
function renderStats(){
  const acc = S.answered ? Math.round(S.correct/S.answered*100) : 0;
  const words = Object.keys(S.w).filter(k=>S.w[k].ok>=2).length;
  const rules = Object.keys(S.r).filter(k=>S.r[k].ok>=3).length;
  const mastered = TOPICS.filter(t=>isMastered(t.id)).length;
  const mins = Math.round(S.seconds/60);
  const hrs = Math.floor(mins/60);
  const timeTxt = hrs ? hrs+" u "+(mins%60)+" m" : mins+" min";
  const weak = weakTopics().slice(0,5);

  let h = '<div class="stack-20"><div><div class="eyebrow">Voortgang</div><h1 class="h-xl">Niveau '+levelOf(S.xp)+'</h1></div>';
  h += '<div class="sgrid">'
    + stat(S.xp, "XP") + stat(acc+"%","Goed beantwoord") + stat(S.streak,"Nu op rij") + stat(S.best,"Beste rij ooit")
    + stat(words,"Woorden geleerd") + stat(rules,"Regels geleerd") + stat(mastered,"Onderwerpen meester") + stat(timeTxt,"Tijd geoefend")
    + stat(S.answered,"Vragen gedaan") + stat(TOPICS.filter(t=>isGlazed(t.id)).length,"Tegels geglazuurd")
    + '</div>';

  if(weak.length){
    h += '<div class="card pad"><h3 class="h-lg" style="margin-bottom:4px">Wat aandacht nodig heeft</h3>'
      + '<p class="tiny dim" style="margin-bottom:14px">Deze onderwerpen komen extra vaak terug in de herhaling.</p><div class="blist">'
      + weak.map(t=>{
        const p = Math.round(S.t[t.id].strength);
        return '<div class="brow"><div class="brow-top"><span>'+t.ico+' '+t.nl+'</span><span class="brow-pct">'+p+'%</span></div>'
          + '<div class="bar"><div class="bar-fill '+(p>=70?"verde":(p>=40?"saffron":""))+'" style="width:'+p+'%"></div></div></div>';
      }).join("")
      + '</div><button class="btn btn-wide btn-primary" style="margin-top:16px" data-mode="weak">Oefen je zwakke punten</button></div>';
  }

  h += '<div class="tiny dim center" style="margin-top:-8px">Azulejo versie '+APP_VERSION+'</div>';
  h += '<div class="card pad stack-14"><h3 class="h-lg">Account</h3>';
  if(AUTH.email){
    h += '<div class="acct"><div class="acct-av">'+AUTH.email.charAt(0).toUpperCase()+'</div>'
      + '<div style="min-width:0"><div class="h-md" style="overflow:hidden;text-overflow:ellipsis">'+AUTH.email+'</div>'
      + '<div class="tiny dim">'+(isAdmin()?"beheerder":"ingelogd")+' · voortgang staat online</div></div></div>'
      + '<div class="row"><button class="btn btn-sm btn-primary" data-cloud="push">Nu opslaan</button>'
      + '<button class="btn btn-sm" data-cloud="pull">Nu ophalen</button>'
      + '<button class="btn btn-sm btn-ghost" data-cloud="off">Uitloggen</button></div>';
    if(isAdmin()){
      h += '<div class="hr"></div><button class="btn btn-sm btn-saffron btn-wide" data-go2="admin">Beheerpagina openen</button>';
    }
  } else {
    h += '<p class="prose" style="font-size:15px">Je werkt nu zonder account, dus je voortgang staat alleen in deze browser. '
      + 'Log in en hij staat online, op al je apparaten.</p>'
      + '<button class="btn btn-sm btn-primary" data-showlogin="1">Inloggen of account maken</button>';
  }
  h += '<div class="tiny dim" id="cloudmsg">'+(CLOUD.msg||"")+'</div></div>';

  h += '<div class="card pad stack-14"><h3 class="h-lg">Voortgang bewaren</h3>'
    + '<p class="prose" style="font-size:15px">Je voortgang wordt vanzelf bewaard in deze browser, ook als je het tabblad sluit. '
    + 'Ga je naar een ander apparaat? Maak dan eerst een reservekopie en zet die daar terug.</p>'
    + '<div class="row"><button class="btn btn-sm" data-export="1">Reservekopie opslaan</button>'
    + '<button class="btn btn-sm" data-import="1">Reservekopie terugzetten</button></div>'
    + '<input type="file" id="impf" accept="application/json,.json" style="display:none">'
    + '<div class="tiny dim" id="impmsg"></div></div>';
  h += '<div class="card pad"><h3 class="h-lg" style="margin-bottom:12px">Alle onderwerpen</h3><div class="blist">'
    + TOPICS.map(t=>{
      const st = S.t[t.id], p = Math.round(st.strength);
      return '<div class="brow"><div class="brow-top"><span>'+t.ico+' '+t.nl+'</span>'
        + (isMastered(t.id)?'<span class="tag tag-saffron">meester</span>':(isGlazed(t.id)?'<span class="tag tag-verde">klaar</span>':''))
        + '<span class="brow-pct">'+(isUnlocked(t.id)?p+'%':'op slot')+'</span></div>'
        + '<div class="bar"><div class="bar-fill '+(p>=70?"verde":(p>=40?"saffron":""))+'" style="width:'+(isUnlocked(t.id)?p:0)+'%"></div></div></div>';
    }).join("")
    + '</div></div></div>';
  $("#sc-stats").innerHTML = h;
}
function stat(n,l){ return '<div class="stat"><div class="stat-n">'+n+'</div><div class="stat-l">'+l+'</div></div>'; }

/* ---------------- FEEST ---------------- */
function shards(n){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "shards";
  const cols = ["var(--azul)","var(--saffron2)","var(--verde)","var(--granada)","var(--azul2)"];
  const count = n || 26;
  for(let i=0;i<count;i++){
    const s = document.createElement("i"); s.className = "shard";
    s.style.left = Math.random()*100+"%";
    s.style.background = cols[i%cols.length];
    s.style.setProperty("--dx", (Math.random()*160-80)+"px");
    s.style.setProperty("--rot", (Math.random()*720-360)+"deg");
    s.style.animationDuration = (1.1+Math.random()*0.9)+"s";
    s.style.animationDelay = (Math.random()*0.25)+"s";
    if(i%3===0) s.style.borderRadius = "50%";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(), 2400);
}
/* ============================================================
   7. KNOPPEN EN START
   ============================================================ */
let MATCHST = null;

function paintBuild(){
  const e = SESS && SESS.queue[SESS.idx]; if(!e) return;
  const slot = $("#slot"), pool = $("#pool"); if(!slot) return;
  slot.innerHTML = BUILT.map((ix,pos)=>'<button class="word" data-un="'+pos+'">'+e.pool[ix]+'</button>').join("");
  pool.querySelectorAll("[data-w]").forEach(b=>b.classList.toggle("used", BUILT.indexOf(+b.dataset.w)>=0));
}
function doCheck(){
  const e = SESS && SESS.queue[SESS.idx]; if(!e) return;
  if(e.type==="input"){ const i=$("#ans"); if(i) answer(i.value.trim()); }
  else if(e.type==="build"){ answer(BUILT.map(ix=>e.pool[ix]).join(" ")); }
}
function matchClick(btn){
  const e = SESS && SESS.queue[SESS.idx]; if(!e) return;
  if(!MATCHST || MATCHST.k!==SESS.idx) MATCHST = {k:SESS.idx, sel:null, miss:0, done:0};
  if(btn.classList.contains("done")) return;
  const side = btn.dataset.m, idx = +btn.dataset.i;
  if(!MATCHST.sel){
    document.querySelectorAll("[data-m]").forEach(b=>b.classList.remove("pick"));
    btn.classList.add("pick"); MATCHST.sel = {side, idx, btn}; return;
  }
  if(MATCHST.sel.side===side){ MATCHST.sel.btn.classList.remove("pick"); btn.classList.add("pick"); MATCHST.sel={side,idx,btn}; return; }
  const a = MATCHST.sel;
  if(a.idx===idx){
    a.btn.classList.remove("pick"); a.btn.classList.add("done"); btn.classList.add("done");
    MATCHST.done++; MATCHST.sel=null;
    if(MATCHST.done===e.pairs.length) answer(MATCHST.miss===0 ? e.answer : "\u0000");
  } else {
    MATCHST.miss++;
    btn.classList.add("bad"); a.btn.classList.add("bad");
    const x=a.btn; setTimeout(()=>{ btn.classList.remove("bad"); x.classList.remove("bad","pick"); }, 550);
    MATCHST.sel=null;
  }
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-go],[data-go2],[data-topic],[data-practice],[data-quiz],[data-mode],[data-drill],"
    + "[data-opt],[data-check],[data-next],[data-stop],[data-acc],[data-speak],[data-w],[data-un],[data-wf],"
    + "[data-flash],[data-mem],[data-m],[data-export],[data-import],[data-slot],[data-cloud],"
    + "[data-drillpick],[data-drillset],[data-drillneed],[data-drillgo],[data-drillcheck],"
    + "[data-drillnext],[data-drillexit],[data-drillagain],[data-dacc],[data-login],[data-skiplogin],"
    + "[data-showlogin],[data-unlock],[data-unlockall],[data-closemodal],[data-adm],[data-admdel],#btn-theme,#flash");
  if(!t) return;
  const d = t.dataset || {};

  if(t.id==="btn-theme"){
    S.theme = S.theme==="dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", S.theme);
    t.textContent = S.theme==="dark" ? "☀" : "☾";
    save(); return;
  }
  if(d.speak !== undefined){ speak(d.speak, t); return; }
  if(d.go){ SESS=null; go(d.go); return; }
  if(d.go2){ SESS=null; go(d.go2); return; }
  if(d.topic){ if(!isUnlocked(d.topic)) return askUnlock(d.topic); go("lesson", d.topic); return; }
  if(d.practice){ startSession({mode:"practice", topic:d.practice}); return; }
  if(d.quiz){ startSession({mode:"quiz", topic:d.quiz, limit:20}); return; }
  if(d.drill){
    startSession({mode:"practice", topic:d.drill.split(".")[0]});
    SESS.queue = []; SESS.idx = 0; addRemediation(d.drill, 5); renderQuestion(); return;
  }
  if(d.mode){
    if(d.mode==="weak")   startSession({mode:"weak"});
    if(d.mode==="mixed")  startSession({mode:"mixed", limit:50});
    if(d.mode==="master") startSession({mode:"master", limit:100});
    if(d.mode==="timed")  startSession({mode:"timed", endAt:Date.now()+90000});
    return;
  }
  if(d.opt !== undefined){ answer(d.opt); return; }
  if(d.check){ doCheck(); return; }
  if(d.next !== undefined){ nextQ(); return; }
  if(d.stop){ SESS=null; clearInterval(clockTimer); go(CUR==="practice"?"practice":"learn"); if(CUR==="practice") renderPracticeHub(); return; }
  if(d.acc){ const i=$("#ans"); if(i){ i.value += d.acc; i.focus(); } return; }
  if(d.w !== undefined){ if(BUILT.indexOf(+d.w)<0) BUILT.push(+d.w); paintBuild(); return; }
  if(d.un !== undefined){ BUILT.splice(+d.un,1); paintBuild(); return; }
  if(d.m !== undefined){ matchClick(t); return; }
  if(d.slot){ const key=d.labKey, [k,ix]=d.slot.split("|"); LAB[key]=LAB[key]||{}; LAB[key][k]=+ix; renderLab(key); return; }
  if(d.cloud){
    const msg = m => { CLOUD.msg = m; renderStats(); };
    if(d.cloud==="push"){ msg("Bezig met opslaan..."); cloudPush().then(()=>msg("Opgeslagen in de cloud.")).catch(e=>msg(apiUitleg(e))); return; }
    if(d.cloud==="pull"){ msg("Bezig met ophalen...");
      cloudPull().then(r=>{ if(r){ applyState(r); paintTop(); msg("Voortgang opgehaald."); } else msg("Nog niets gevonden voor dit account."); })
        .catch(e=>msg(apiUitleg(e))); return; }
    if(d.cloud==="off"){ logout(); ADM.users=null; save();
      msg("Uitgelogd. Je voortgang blijft op dit apparaat staan en komt terug als je weer inlogt."); return; }
  }
  if(d.login){ doLogin(); return; }
  if(d.skiplogin){ try{ localStorage.setItem("azulejo:skiplogin","1"); }catch(e){} const g=$("#gate"); if(g) g.remove(); return; }
  if(d.showlogin){ try{ localStorage.removeItem("azulejo:skiplogin"); }catch(e){} renderGate(); return; }
  if(d.unlock){ unlockTopic(d.unlock); return; }
  if(d.unlockall !== undefined){ unlockAll(); return; }
  if(d.closemodal !== undefined){ closeModal(); return; }
  if(d.adm){ if(d.adm==="forget"){ ADM.token=""; ADM.users=null; try{localStorage.removeItem(TKEY);}catch(e){} ADM.msg="Vergeten op dit apparaat."; renderAdmin(); }
    else admCall(d.adm); return; }
  if(d.admdel){ if(confirm("Account "+d.admmail+" verwijderen uit de lijst?")) admCall("delete",{field:d.admdel}); return; }
  if(d.wf){ WF = d.wf; renderWords(); return; }
  if(d.export){ const ok = exportProgress(); const m=$("#impmsg"); if(m) m.textContent = ok?"Reservekopie opgeslagen als azulejo-voortgang.json":"Opslaan lukte niet in deze omgeving."; return; }
  if(d.import){ const f=$("#impf"); if(f) f.click(); return; }
  if(d.flash==="new"){ newFlash(); return; }
  if(t.id==="flash"){ t.classList.toggle("flipped"); return; }
  if(d.mem==="new"){ newMem(); return; }
  if(d.mem !== undefined){
    if(!MEM) return;
    const ix = +d.mem, c = MEM.cards[ix];
    if(t.classList.contains("done") || t.classList.contains("pick")) return;
    t.classList.add("pick"); MEM.open.push({ix, c, btn:t});
    if(MEM.open.length===2){
      const [a,b] = MEM.open; MEM.tries++;
      if(a.c.i===b.c.i && a.c.side!==b.c.side){
        a.btn.classList.remove("pick"); b.btn.classList.remove("pick");
        a.btn.classList.add("done"); b.btn.classList.add("done");
        MEM.done++; MEM.open=[];
        if(MEM.done===6){ $("#memmsg").textContent = "Alle paren gevonden in "+MEM.tries+" beurten. ¡Muy bien!"; shards(40); addXp(20); paintTop(); save(); }
      } else {
        setTimeout(()=>{ a.btn.classList.remove("pick"); b.btn.classList.remove("pick"); MEM.open=[]; }, 620);
      }
    }
    return;
  }
});

document.addEventListener("change", ev => {
  if(ev.target && ev.target.id==="impf" && ev.target.files && ev.target.files[0]){
